name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare deployment files
        run: |
          mkdir -p deploy

          # Generate the Pages landing page from all results*/index.html files.
          python3 generate_summary.py --overview-only
          cp results.html deploy/index.html
          cp results.html deploy/results.html

          # Keep result directories intact so generated links stay valid.
          for result_dir in results*/; do
            if [ -d "$result_dir" ]; then
              cp -r "$result_dir" deploy/
            fi
          done

          touch deploy/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: deploy

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
