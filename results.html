<!doctype html>
<html lang="ru">
<head>

  <title>Все результаты LLM</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      color: #f5f7ff;
      background:
        radial-gradient(circle at 15% 10%, rgba(87, 108, 255, .22), transparent 32rem),
        radial-gradient(circle at 85% 90%, rgba(0, 216, 180, .14), transparent 30rem),
        #0b1020;
    }
    main { width: min(1120px, calc(100% - 32px)); margin: 0 auto; padding: 72px 0; }
    .eyebrow { margin: 0 0 12px; color: #8da2ff; font-size: 13px; font-weight: 800;
               letter-spacing: .14em; text-transform: uppercase; }
    h1 { max-width: 760px; margin: 0; font-size: clamp(38px, 8vw, 76px);
         line-height: .98; letter-spacing: -.045em; }
    .intro { max-width: 680px; margin: 24px 0 48px; color: #aeb8d3;
             font-size: 18px; line-height: 1.65; }
    .count { color: #eef1ff; font-weight: 750; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 18px; }
    .result-card { min-height: 180px; padding: 26px; display: flex; flex-direction: column;
                   justify-content: space-between; border: 1px solid rgba(174, 184, 211, .18);
                   border-radius: 20px; background: rgba(22, 29, 53, .72);
                   box-shadow: 0 20px 60px rgba(0, 0, 0, .18); backdrop-filter: blur(16px);
                   transition: transform .2s ease, border-color .2s ease; }
    .result-card:hover { transform: translateY(-4px); border-color: rgba(141, 162, 255, .7); }
    .result-card h2 { margin: 0 0 28px; overflow-wrap: anywhere; font-size: 21px; line-height: 1.3; }
    .result-card a { color: #9eafff; font-weight: 750; text-decoration: none; }
    .result-card a:hover { color: #c8d1ff; }
    .result-card span { display: inline-block; margin-left: 5px; transition: transform .2s ease; }
    .result-card a:hover span { transform: translateX(4px); }
    .empty { padding: 28px; border: 1px dashed #52607e; border-radius: 18px; color: #aeb8d3; }
    @media (max-width: 600px) { main { padding: 42px 0; } .intro { margin-bottom: 32px; } }
  </style>
</head>
