<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Neon Runner</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0a0a0f;
  overflow: hidden;
  font-family: 'Courier New', monospace;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}
canvas {
  display: block;
  position: absolute;
  top: 0; left: 0;
}
#scanlines {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 10;
  background: repeating-linear-gradient(
    0deg,
    rgba(0,0,0,0.15) 0px,
    rgba(0,0,0,0.15) 1px,
    transparent 1px,
    transparent 3px
  );
}
#hud {
  position: fixed;
  top: 10px; left: 10px; right: 10px;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  z-index: 20;
  pointer-events: none;
}
.hud-item {
  color: #00fff5;
  font-size: 16px;
  text-shadow: 0 0 10px #00fff5, 0 0 20px #00fff5;
  letter-spacing: 2px;
}
#hud-right {
  text-align: right;
}
#lives {
  color: #ff00ff;
  text-shadow: 0 0 10px #ff00ff, 0 0 20px #ff00ff;
  font-size: 20px;
}
#overlay {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 30;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: rgba(10,10,15,0.92);
}
#overlay.hidden { display: none; }
#title {
  font-size: 48px;
  color: #00fff5;
  text-shadow: 0 0 20px #00fff5, 0 0 40px #00fff5, 0 0 80px #00fff5;
  margin-bottom: 10px;
  letter-spacing: 8px;
  animation: titlePulse 2s ease-in-out infinite;
}
#subtitle {
  font-size: 14px;
  color: #ff00ff;
  text-shadow: 0 0 10px #ff00ff;
  margin-bottom: 40px;
  letter-spacing: 4px;
}
@keyframes titlePulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.7; }
}
.btn {
  background: transparent;
  border: 2px solid #00fff5;
  color: #00fff5;
  padding: 15px 50px;
  font-size: 18px;
  font-family: 'Courier New', monospace;
  cursor: pointer;
  letter-spacing: 4px;
  text-shadow: 0 0 10px #00fff5;
  box-shadow: 0 0 15px rgba(0,255,245,0.3), inset 0 0 15px rgba(0,255,245,0.1);
  transition: all 0.3s;
  margin: 8px;
}
.btn:hover {
  background: rgba(0,255,245,0.15);
  box-shadow: 0 0 30px rgba(0,255,245,0.5), inset 0 0 30px rgba(0,255,245,0.2);
  transform: scale(1.05);
}
.btn:active {
  transform: scale(0.95);
}
.btn.pink {
  border-color: #ff00ff;
  color: #ff00ff;
  text-shadow: 0 0 10px #ff00ff;
  box-shadow: 0 0 15px rgba(255,0,255,0.3), inset 0 0 15px rgba(255,0,255,0.1);
}
.btn.pink:hover {
  background: rgba(255,0,255,0.15);
  box-shadow: 0 0 30px rgba(255,0,255,0.5), inset 0 0 30px rgba(255,0,255,0.2);
}
#game-over-screen {
  display: none;
  flex-direction: column;
  align-items: center;
}
#game-over-screen.visible { display: flex; }
#go-title {
  font-size: 36px;
  color: #ff0044;
  text-shadow: 0 0 20px #ff0044, 0 0 40px #ff0044;
  margin-bottom: 20px;
  letter-spacing: 6px;
}
.stat-row {
  color: #00fff5;
  font-size: 16px;
  margin: 5px 0;
  text-shadow: 0 0 8px #00fff5;
  letter-spacing: 2px;
}
.stat-row span { color: #ff00ff; }
#achievements {
  margin: 15px 0;
  max-width: 350px;
}
.achievement {
  color: #39ff14;
  font-size: 13px;
  margin: 4px 0;
  text-shadow: 0 0 8px #39ff14;
  letter-spacing: 1px;
  padding: 4px 12px;
  border: 1px solid rgba(57,255,20,0.3);
  border-radius: 3px;
}
.controls-hint {
  color: rgba(0,255,245,0.5);
  font-size: 12px;
  margin-top: 25px;
  letter-spacing: 2px;
  text-align: center;
  line-height: 1.8;
}
#start-screen { display: flex; flex-direction: column; align-items: center; }
#start-screen.hidden { display: none; }
#high-score {
  color: #ff00ff;
  font-size: 14px;
  margin-bottom: 15px;
  text-shadow: 0 0 8px #ff00ff;
  letter-spacing: 2px;
}
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>
<div id="scanlines"></div>

<div id="hud" style="display:none;">
  <div>
    <div class="hud-item" id="score-display">SCORE: 0</div>
    <div class="hud-item" id="speed-display" style="font-size:12px; margin-top:4px;">SPEED: 1.0x</div>
  </div>
  <div id="hud-right">
    <div id="lives">♥♥♥</div>
  </div>
</div>

<div id="overlay">
  <div id="start-screen">
    <div id="title">NEON RUNNER</div>
    <div id="subtitle">CYBERPUNK EDITION</div>
    <div id="high-score"></div>
    <button class="btn" id="start-btn">START</button>
    <div class="controls-hint">
      SPACE / TAP — JUMP<br>
      HOLD DOWN — DUCK<br>
      AVOID OBSTACLES
    </div>
  </div>
  <div id="game-over-screen">
    <div id="go-title">GAME OVER</div>
    <div class="stat-row">SCORE: <span id="final-score">0</span></div>
    <div class="stat-row">DISTANCE: <span id="final-dist">0</span>m</div>
    <div class="stat-row">BEST: <span id="best-score">0</span></div>
    <div id="achievements"></div>
    <button class="btn pink" id="restart-btn">RETRY</button>
  </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const startScreen = document.getElementById('start-screen');
const gameOverScreen = document.getElementById('game-over-screen');
const hud = document.getElementById('hud');

let W, H, GROUND_Y;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  GROUND_Y = H - 80;
}
resize();
window.addEventListener('resize', resize);

// Audio
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx;
function initAudio() {
  if (!audioCtx) audioCtx = new AudioCtx();
}

function playSound(type) {
  if (!audioCtx) return;
  try {
    const now = audioCtx.currentTime;
    if (type === 'jump') {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(200, now);
      osc.frequency.exponentialRampToValueAtTime(600, now + 0.1);
      gain.gain.setValueAtTime(0.15, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(now); osc.stop(now + 0.15);
    } else if (type === 'hit') {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(150, now);
      osc.frequency.exponentialRampToValueAtTime(30, now + 0.4);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(now); osc.stop(now + 0.4);
    } else if (type === 'duck') {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(300, now);
      osc.frequency.exponentialRampToValueAtTime(100, now + 0.08);
      gain.gain.setValueAtTime(0.1, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(now); osc.stop(now + 0.1);
    } else if (type === 'score') {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(800, now);
      osc.frequency.setValueAtTime(1200, now + 0.05);
      gain.gain.setValueAtTime(0.08, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(now); osc.stop(now + 0.15);
    }
  } catch(e) {}
}

// Background music
let bgmPlaying = false;
let bgmInterval;
function startBGM() {
  if (bgmPlaying || !audioCtx) return;
  bgmPlaying = true;
  let step = 0;
  const notes = [65, 82, 98, 82, 65, 73, 87, 73];
  bgmInterval = setInterval(() => {
    if (!audioCtx) return;
    try {
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'square';
      const freq = notes[step % notes.length];
      osc.frequency.setValueAtTime(freq * 4, now);
      gain.gain.setValueAtTime(0.04, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(now); osc.stop(now + 0.13);
      step++;
    } catch(e) {}
  }, 180);
}
function stopBGM() {
  bgmPlaying = false;
  clearInterval(bgmInterval);
}

// Game state
const COLORS = {
  cyan: '#00fff5',
  magenta: '#ff00ff',
  green: '#39ff14',
  dark: '#0a0a0f',
  red: '#ff0044',
  yellow: '#ffff00'
};

let game = {};

function initGame() {
  game = {
    running: false,
    score: 0,
    distance: 0,
    lives: 3,
    speed: 5,
    baseSpeed: 5,
    speedMult: 1.0,
    invincible: 0,
    flashTimer: 0,
    lastObstacle: 0,
    minGap: 250,
    time: 0,
    groundOffset: 0,
    particles: [],
    bgParticles: [],
    buildings: [],
    midBuildings: [],
    farBuildings: [],
    clouds: [],
    scoreTimer: 0,
    ducking: false,
    achievements: [],
    newAchievements: [],
    deathAnim: 0,
    deathParticles: [],
    shakeTimer: 0
  };
  initPlayer();
  initBackground();
}

let player = {};
function initPlayer() {
  player = {
    x: 80,
    y: GROUND_Y,
    w: 40,
    h: 60,
    vy: 0,
    jumping: false,
    grounded: true,
    duckH: 30,
    runFrame: 0,
    runTimer: 0,
    alive: true
  };
}

function initBackground() {
  game.buildings = [];
  game.midBuildings = [];
  game.farBuildings = [];
  game.clouds = [];
  game.bgParticles = [];

  for (let i = 0; i < 20; i++) {
    game.farBuildings.push({
      x: i * (W / 8) + Math.random() * 50,
      w: 40 + Math.random() * 60,
      h: 60 + Math.random() * 120,
      color: Math.random() > 0.5 ? COLORS.cyan : COLORS.magenta,
      windows: Math.floor(Math.random() * 8) + 2
    });
  }
  for (let i = 0; i < 12; i++) {
    game.midBuildings.push({
      x: i * (W / 5) + Math.random() * 80,
      w: 50 + Math.random() * 80,
      h: 80 + Math.random() * 150,
      color: Math.random() > 0.5 ? COLORS.cyan : COLORS.green
    });
  }
  for (let i = 0; i < 8; i++) {
    game.buildings.push({
      x: i * (W / 3) + Math.random() * 100,
      w: 60 + Math.random() * 100,
      h: 100 + Math.random() * 200,
      color: COLORS.magenta
    });
  }
  for (let i = 0; i < 5; i++) {
    game.clouds.push({
      x: Math.random() * W * 1.5,
      y: 30 + Math.random() * 80,
      w: 60 + Math.random() * 120,
      speed: 0.2 + Math.random() * 0.5
    });
  }
  for (let i = 0; i < 20; i++) {
    game.bgParticles.push({
      x: Math.random() * W,
      y: Math.random() * H,
      size: 1 + Math.random() * 2,
      speed: 0.3 + Math.random() * 0.8,
      color: [COLORS.cyan, COLORS.magenta, COLORS.green][Math.floor(Math.random() * 3)],
      alpha: 0.3 + Math.random() * 0.5
    });
  }
}

let obstacles = [];
function spawnObstacle() {
  const type = Math.random();
  const speed = game.speed;

  if (type < 0.45) {
    // Ground cactus
    obstacles.push({
      type: 'cactus',
      x: W + 50,
      y: GROUND_Y,
      w: 20 + Math.random() * 15,
      h: 35 + Math.random() * 25,
      color: COLORS.green,
      variant: Math.floor(Math.random() * 3)
    });
  } else if (type < 0.75) {
    // Tall obstacle
    obstacles.push({
      type: 'tall',
      x: W + 50,
      y: GROUND_Y,
      w: 25,
      h: 55 + Math.random() * 15,
      color: COLORS.magenta,
      variant: Math.floor(Math.random() * 2)
    });
  } else {
    // Flying bird
    const birdY = GROUND_Y - 50 - Math.random() * 40;
    obstacles.push({
      type: 'bird',
      x: W + 50,
      y: birdY,
      w: 35,
      h: 20,
      color: COLORS.cyan,
      wingPhase: 0
    });
  }
}

// Input
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Space' || e.code === 'ArrowUp') e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  initAudio();
  const touch = e.touches[0];
  if (touch.clientY > H * 0.6) {
    keys['ArrowDown'] = true;
  } else {
    keys['Space'] = true;
  }
});
canvas.addEventListener('touchend', e => {
  e.preventDefault();
  keys['ArrowDown'] = false;
  keys['Space'] = false;
});
canvas.addEventListener('touchmove', e => e.preventDefault());

canvas.addEventListener('mousedown', e => {
  initAudio();
  if (e.clientY > H * 0.6) {
    keys['ArrowDown'] = true;
  } else {
    keys['Space'] = true;
  }
});
canvas.addEventListener('mouseup', () => {
  keys['ArrowDown'] = false;
  keys['Space'] = false;
});

// Player update
function updatePlayer(dt) {
  if (!player.alive) return;

  const jumpPressed = keys['Space'] || keys['ArrowUp'];
  const duckPressed = keys['ArrowDown'];

  player.ducking = duckPressed && player.grounded;

  if (player.ducking) {
    player.h = player.duckH;
    player.y = GROUND_Y;
  } else {
    player.h = 60;
  }

  if (jumpPressed && player.grounded && !player.ducking) {
    player.vy = -14;
    player.jumping = true;
    player.grounded = false;
    playSound('jump');
  }

  if (!player.grounded) {
    player.vy += 0.65;
    player.y += player.vy;
    if (player.y >= GROUND_Y) {
      player.y = GROUND_Y;
      player.vy = 0;
      player.grounded = true;
      player.jumping = false;
    }
  }

  // Run animation
  if (player.grounded) {
    player.runTimer += dt;
    if (player.runTimer > 0.08) {
      player.runTimer = 0;
      player.runFrame = (player.runFrame + 1) % 4;
    }
  } else {
    player.runFrame = 2;
  }
}

// Obstacles
function updateObstacles(dt) {
  game.lastObstacle += game.speed * dt * 60;

  if (game.lastObstacle > game.minGap + Math.random() * 100) {
    spawnObstacle();
    game.lastObstacle = 0;
    game.minGap = Math.max(150, 250 - game.speedMult * 20);
  }

  for (let i = obstacles.length - 1; i >= 0; i--) {
    const o = obstacles[i];
    o.x -= game.speed * dt * 60;

    if (o.type === 'bird') {
      o.wingPhase += dt * 8;
    }

    if (o.x < -60) {
      obstacles.splice(i, 1);
    }
  }
}

// Collision
function checkCollision() {
  if (game.invincible > 0) return;

  const px = player.x;
  const py = player.y - player.h;
  const pw = player.ducking ? player.w + 5 : player.w - 5;
  const ph = player.h - 5;

  for (let o of obstacles) {
    const ox = o.x;
    const oy = o.y - o.h;
    const ow = o.w - 5;
    const oh = o.h - 5;

    if (px < ox + ow && px + pw > ox && py < oy + oh && py + ph > oy) {
      hitPlayer();
      return;
    }
  }
}

function hitPlayer() {
  game.lives--;
  game.invincible = 2;
  game.shakeTimer = 0.3;
  playSound('hit');

  // Death particles
  for (let i = 0; i < 25; i++) {
    game.deathParticles.push({
      x: player.x + player.w / 2,
      y: player.y - player.h / 2,
      vx: (Math.random() - 0.5) * 12,
      vy: (Math.random() - 0.5) * 12,
      life: 0.5 + Math.random() * 0.5,
      maxLife: 0.5 + Math.random() * 0.5,
      size: 2 + Math.random() * 4,
      color: [COLORS.cyan, COLORS.magenta, COLORS.green][Math.floor(Math.random() * 3)]
    });
  }

  if (game.lives <= 0) {
    gameOver();
  }
  updateLivesDisplay();
}

function gameOver() {
  game.running = false;
  player.alive = false;
  stopBGM();

  const finalScore = Math.floor(game.score);
  const best = parseInt(localStorage.getItem('neonRunnerBest') || '0');
  if (finalScore > best) {
    localStorage.setItem('neonRunnerBest', finalScore);
  }

  // Achievements
  const newAch = [];
  const allAch = JSON.parse(localStorage.getItem('neonRunnerAch') || '[]');

  if (!allAch.includes('first_run')) { allAch.push('first_run'); newAch.push('🏃 First Run'); }
  if (finalScore >= 100 && !allAch.includes('score_100')) { allAch.push('score_100'); newAch.push('⭐ Score 100'); }
  if (finalScore >= 500 && !allAch.includes('score_500')) { allAch.push('score_500'); newAch.push('🌟 Score 500'); }
  if (finalScore >= 1000 && !allAch.includes('score_1000')) { allAch.push('score_1000'); newAch.push('💫 Score 1000'); }
  if (finalScore >= 2000 && !allAch.includes('score_2000')) { allAch.push('score_2000'); newAch.push('🔥 Score 2000'); }
  if (game.lives === 3 && finalScore >= 50 && !allAch.includes('perfect')) { allAch.push('perfect'); newAch.push('💎 Perfect Run'); }
  if (game.speedMult >= 2.0 && !allAch.includes('speed_demon')) { allAch.push('speed_demon'); newAch.push('⚡ Speed Demon'); }

  localStorage.setItem('neonRunnerAch', JSON.stringify(allAch));

  // Show game over
  setTimeout(() => {
    hud.style.display = 'none';
    startScreen.classList.add('hidden');
    gameOverScreen.classList.add('visible');
    overlay.classList.remove('hidden');

    document.getElementById('final-score').textContent = finalScore;
    document.getElementById('final-dist').textContent = Math.floor(game.distance);
    document.getElementById('best-score').textContent = Math.max(finalScore, best);

    const achDiv = document.getElementById('achievements');
    achDiv.innerHTML = '';
    newAch.forEach(a => {
      const div = document.createElement('div');
      div.className = 'achievement';
      div.textContent = a;
      achDiv.appendChild(div);
    });
    if (newAch.length === 0) {
      const div = document.createElement('div');
      div.className = 'achievement';
      div.style.color = COLORS.cyan;
      div.style.borderColor = 'rgba(0,255,245,0.3)';
      div.textContent = 'No new achievements';
      achDiv.appendChild(div);
    }
  }, 800);
}

// Drawing
function drawBackground(dt) {
  // Sky gradient
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#050510');
  grad.addColorStop(0.5, '#0a0a1a');
  grad.addColorStop(1, '#0f0a15');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Far buildings (slowest)
  const farSpeed = game.speed * 0.15 * dt * 60;
  console.log(game);
  game.farBuildings.forEach(b => {
    b.x -= farSpeed;
    if (b.x + b.w < 0) b.x += W * 1.2;
    ctx.fillStyle = 'rgba(20,15,30,0.8)';
    ctx.fillRect(b.x, GROUND_Y - b.h, b.w, b.h);
    ctx.strokeStyle = b.color;
    ctx.globalAlpha = 0.2;
    ctx.lineWidth = 1;
    ctx.strokeRect(b.x, GROUND_Y - b.h, b.w, b.h);
    ctx.globalAlpha = 1;

    // Windows
    const ws = 4;
    const gap = 8;
    for (let wy = GROUND_Y - b.h + 10; wy < GROUND_Y - 10; wy += gap) {
      for (let wx = b.x + 5; wx < b.x + b.w - 5; wx += gap) {
        if (Math.random() > 0.3) {
          ctx.fillStyle = b.color;
          ctx.globalAlpha = 0.15 + Math.random() * 0.15;
          ctx.fillRect(wx, wy, ws, ws);
        }
      }
    }
    ctx.globalAlpha = 1;
  });

  // Mid buildings
  const midSpeed = game.speed * 0.3 * dt * 60;
  game.midBuildings.forEach(b => {
    b.x -= midSpeed;
    if (b.x + b.w < 0) b.x += W * 1.5;
    ctx.fillStyle = 'rgba(15,10,25,0.9)';
    ctx.fillRect(b.x, GROUND_Y - b.h, b.w, b.h);
    ctx.strokeStyle = b.color;
    ctx.globalAlpha = 0.35;
    ctx.lineWidth = 1;
    ctx.strokeRect(b.x, GROUND_Y - b.h, b.w, b.h);
    ctx.globalAlpha = 1;

    // Windows
    for (let wy = GROUND_Y - b.h + 8; wy < GROUND_Y - 5; wy += 10) {
      for (let wx = b.x + 6; wx < b.x + b.w - 6; wx += 10) {
        if (Math.sin(wx * 7 + wy * 13) > 0) {
          ctx.fillStyle = b.color;
          ctx.globalAlpha = 0.2 + Math.random() * 0.15;
          ctx.fillRect(wx, wy, 5, 5);
        }
      }
    }
    ctx.globalAlpha = 1;
  });

  // Near buildings
  const nearSpeed = game.speed * 0.5 * dt * 60;
  game.buildings.forEach(b => {
    b.x -= nearSpeed;
    if (b.x + b.w < 0) b.x += W * 2;
    ctx.fillStyle = '#0d0d1a';
    ctx.fillRect(b.x, GROUND_Y - b.h, b.w, b.h);
    ctx.strokeStyle = b.color;
    ctx.globalAlpha = 0.5;
    ctx.lineWidth = 1.5;
    ctx.strokeRect(b.x, GROUND_Y - b.h, b.w, b.h);
    ctx.globalAlpha = 1;

    // Windows
    for (let wy = GROUND_Y - b.h + 10; wy < GROUND_Y - 5; wy += 12) {
      for (let wx = b.x + 8; wx < b.x + b.w - 8; wx += 12) {
        if (Math.sin(wx * 5 + wy * 11 + game.time) > -0.3) {
          ctx.fillStyle = b.color;
          ctx.globalAlpha = 0.3 + Math.random() * 0.2;
          ctx.fillRect(wx, wy, 6, 6);
        }
      }
    }
    ctx.globalAlpha = 1;
  });

  // Clouds
  game.clouds.forEach(c => {
    c.x -= c.speed * dt * 60;
    if (c.x + c.w < 0) c.x = W + c.w;
    ctx.strokeStyle = COLORS.cyan;
    ctx.globalAlpha = 0.08;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.ellipse(c.x, c.y, c.w / 2, 15, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = 1;
  });
}

function drawGround(dt) {
  game.groundOffset = (game.groundOffset + game.speed * dt * 60) % 40;

  // Ground line
  ctx.strokeStyle = COLORS.cyan;
  ctx.globalAlpha = 0.6;
  ctx.lineWidth = 2;
  ctx.shadowColor = COLORS.cyan;
  ctx.shadowBlur = 15;
  ctx.beginPath();
  ctx.moveTo(0, GROUND_Y);
  ctx.lineTo(W, GROUND_Y);
  ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.globalAlpha = 1;

  // Grid lines on ground
  ctx.strokeStyle = COLORS.cyan;
  ctx.globalAlpha = 0.15;
  ctx.lineWidth = 1;
  for (let x = -game.groundOffset; x < W; x += 40) {
    ctx.beginPath();
    ctx.moveTo(x, GROUND_Y);
    ctx.lineTo(x - 20, H);
    ctx.stroke();
  }
  for (let y = GROUND_Y + 20; y < H; y += 20) {
    ctx.globalAlpha = 0.08;
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // Ground fill
  ctx.fillStyle = 'rgba(10,8,20,0.9)';
  ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);
}

function drawPlayer() {
  if (!player.alive) return;
  if (game.invincible > 0 && Math.floor(game.invincible * 10) % 2 === 0) return;

  const px = player.x;
  const py = player.y;
  const ducking = player.ducking;
  const color = COLORS.cyan;

  ctx.save();
  ctx.shadowColor = color;
  ctx.shadowBlur = 12;
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  ctx.fillStyle = 'rgba(0,255,245,0.1)';

  if (ducking) {
    // Ducking dino
    ctx.beginPath();
    // Body
    ctx.moveTo(px, py - 15);
    ctx.lineTo(px + 35, py - 15);
    ctx.lineTo(px + 40, py - 20);
    ctx.lineTo(px + 45, py - 20);
    ctx.lineTo(px + 45, py - 10);
    ctx.lineTo(px + 35, py - 5);
    ctx.lineTo(px, py - 5);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Eye
    ctx.fillStyle = color;
    ctx.fillRect(px + 38, py - 18, 3, 3);

    // Legs
    ctx.strokeStyle = color;
    const legOffset = player.runFrame % 2 === 0 ? 3 : -3;
    ctx.beginPath();
    ctx.moveTo(px + 5, py - 5);
    ctx.lineTo(px + 5 + legOffset, py);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(px + 20, py - 5);
    ctx.lineTo(px + 20 - legOffset, py);
    ctx.stroke();
  } else {
    // Standing/running dino
    ctx.beginPath();
    // Body
    ctx.moveTo(px + 5, py - 60);
    ctx.lineTo(px + 30, py - 55);
    ctx.lineTo(px + 35, py - 45);
    ctx.lineTo(px + 35, py - 20);
    ctx.lineTo(px + 25, py - 10);
    ctx.lineTo(px + 5, py - 10);
    ctx.lineTo(px, py - 25);
    ctx.lineTo(px, py - 50);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Head crest
    ctx.beginPath();
    ctx.moveTo(px + 5, py - 60);
    ctx.lineTo(px + 12, py - 68);
    ctx.lineTo(px + 20, py - 62);
    ctx.stroke();

    // Eye
    ctx.fillStyle = color;
    ctx.fillRect(px + 22, py - 52, 4, 4);

    // Tail
    ctx.beginPath();
    ctx.moveTo(px, py - 30);
    ctx.lineTo(px - 12, py - 40);
    ctx.lineTo(px - 8, py - 35);
    ctx.stroke();

    // Arms
    ctx.beginPath();
    ctx.moveTo(px + 30, py - 40);
    ctx.lineTo(px + 38, py - 35);
    ctx.stroke();

    // Legs
    ctx.strokeStyle = color;
    const rf = player.runFrame;
    ctx.beginPath();
    if (rf === 0) {
      ctx.moveTo(px + 8, py - 10); ctx.lineTo(px + 5, py);
      ctx.moveTo(px + 22, py - 10); ctx.lineTo(px + 25, py);
    } else if (rf === 1) {
      ctx.moveTo(px + 8, py - 10); ctx.lineTo(px + 10, py - 5);
      ctx.moveTo(px + 22, py - 10); ctx.lineTo(px + 28, py);
    } else if (rf === 2) {
      ctx.moveTo(px + 8, py - 10); ctx.lineTo(px + 12, py);
      ctx.moveTo(px + 22, py - 10); ctx.lineTo(px + 20, py - 5);
    } else {
      ctx.moveTo(px + 8, py - 10); ctx.lineTo(px + 2, py);
      ctx.moveTo(px + 22, py - 10); ctx.lineTo(px + 18, py - 5);
    }
    ctx.stroke();
  }

  ctx.restore();
}

function drawObstacles() {
  obstacles.forEach(o => {
    ctx.save();
    ctx.shadowColor = o.color;
    ctx.shadowBlur = 10;
    ctx.strokeStyle = o.color;
    ctx.lineWidth = 2;
    ctx.fillStyle = o.color.replace(')', ',0.1)').replace('rgb', 'rgba').replace('#', '');

    if (o.type === 'cactus') {
      // Cactus
      const cx = o.x, cy = o.y;
      const ch = o.h, cw = o.w;

      ctx.beginPath();
      ctx.moveTo(cx + cw / 2, cy);
      ctx.lineTo(cx + cw, cy + ch * 0.3);
      ctx.lineTo(cx + cw, cy + ch);
      ctx.lineTo(cx, cy + ch);
      ctx.lineTo(cx, cy + ch * 0.3);
      ctx.closePath();
      ctx.fillStyle = 'rgba(57,255,20,0.08)';
      ctx.fill();
      ctx.stroke();

      // Arms
      if (o.variant === 0) {
        ctx.beginPath();
        ctx.moveTo(cx, cy + ch * 0.4);
        ctx.lineTo(cx - 10, cy + ch * 0.4);
        ctx.lineTo(cx - 10, cy + ch * 0.25);
        ctx.stroke();
      } else if (o.variant === 1) {
        ctx.beginPath();
        ctx.moveTo(cx + cw, cy + ch * 0.35);
        ctx.lineTo(cx + cw + 10, cy + ch * 0.35);
        ctx.lineTo(cx + cw + 10, cy + ch * 0.2);
        ctx.stroke();
      }

    } else if (o.type === 'tall') {
      // Tall obstacle
      ctx.fillStyle = 'rgba(255,0,255,0.08)';
      ctx.fillRect(o.x, o.y - o.h, o.w, o.h);
      ctx.strokeRect(o.x, o.y - o.h, o.w, o.h);

      // Top spike
      ctx.beginPath();
      ctx.moveTo(o.x, o.y - o.h);
      ctx.lineTo(o.x + o.w / 2, o.y - o.h - 10);
      ctx.lineTo(o.x + o.w, o.y - o.h);
      ctx.stroke();

    } else if (o.type === 'bird') {
      // Bird
      const bx = o.x, by = o.y;
      const wing = Math.sin(o.wingPhase) * 8;

      ctx.fillStyle = 'rgba(0,255,245,0.08)';
      ctx.beginPath();
      ctx.ellipse(bx + o.w / 2, by, o.w / 2, o.h / 2, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // Wings
      ctx.beginPath();
      ctx.moveTo(bx + 5, by - 5);
      ctx.lineTo(bx - 5, by - 5 - wing);
      ctx.lineTo(bx + 5, by);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(bx + o.w - 5, by - 5);
      ctx.lineTo(bx + o.w + 5, by - 5 - wing);
      ctx.lineTo(bx + o.w - 5, by);
      ctx.stroke();

      // Eye
      ctx.fillStyle = o.color;
      ctx.fillRect(bx + o.w - 8, by - 3, 3, 3);

      // Beak
      ctx.beginPath();
      ctx.moveTo(bx + o.w, by);
      ctx.lineTo(bx + o.w + 8, by + 2);
      ctx.stroke();
    }

    ctx.restore();
  });
}

function drawParticles(dt) {
  // BG particles
  game.bgParticles.forEach(p => {
    p.x -= p.speed * dt * 60;
    if (p.x < 0) { p.x = W; p.y = Math.random() * H; }
    ctx.fillStyle = p.color;
    ctx.globalAlpha = p.alpha * (0.5 + Math.random() * 0.5);
    ctx.fillRect(p.x, p.y, p.size, p.size);
  });
  ctx.globalAlpha = 1;

  // Death particles
  for (let i = game.deathParticles.length - 1; i >= 0; i--) {
    const p = game.deathParticles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.3;
    p.life -= dt;
    if (p.life <= 0) { game.deathParticles.splice(i, 1); continue; }
    ctx.fillStyle = p.color;
    ctx.globalAlpha = p.life / p.maxLife;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 8;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
}

function drawHUD() {
  if (!game.running) return;
  document.getElementById('score-display').textContent = `SCORE: ${Math.floor(game.score)}`;
  document.getElementById('speed-display').textContent = `SPEED: ${game.speedMult.toFixed(1)}x`;
}

function updateLivesDisplay() {
  let hearts = '';
  for (let i = 0; i < 3; i++) {
    hearts += i < game.lives ? '♥' : '♡';
  }
  document.getElementById('lives').textContent = hearts;
}

// Main game loop
let lastTime = 0;
function gameLoop(timestamp) {
  const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
  lastTime = timestamp;

  ctx.clearRect(0, 0, W, H);

  if (game.running) {
    game.time += dt;
    game.distance += game.speed * dt * 0.5;
    game.score += game.speed * dt * 0.3;

    // Speed increase
    game.speedMult = 1 + Math.floor(game.score / 500) * 0.15;
    game.speed = game.baseSpeed * game.speedMult;

    // Invincibility
    if (game.invincible > 0) game.invincible -= dt;

    // Shake
    if (game.shakeTimer > 0) game.shakeTimer -= dt;

    // Score sound
    game.scoreTimer += dt;
    if (game.scoreTimer > 2) {
      game.scoreTimer = 0;
      playSound('score');
    }

    updatePlayer(dt);
    updateObstacles(dt);
    checkCollision();
  }

  // Apply screen shake
  if (game.shakeTimer > 0) {
    ctx.save();
    ctx.translate(
      (Math.random() - 0.5) * 10 * (game.shakeTimer / 0.3),
      (Math.random() - 0.5) * 10 * (game.shakeTimer / 0.3)
    );
  }

  drawBackground(dt);
  drawGround(dt);
  drawObstacles();
  drawPlayer();
  drawParticles(dt);

  if (game.shakeTimer > 0) ctx.restore();
  drawHUD();

  requestAnimationFrame(gameLoop);
}

// Start / Restart
document.getElementById('start-btn').addEventListener('click', () => {
  initAudio();
  startGame();
});
document.getElementById('restart-btn').addEventListener('click', () => {
  initAudio();
  startGame();
});

function startGame() {
  initGame();
  obstacles = [];
  game.running = true;
  overlay.classList.add('hidden');
  startScreen.classList.add('hidden');
  gameOverScreen.classList.remove('visible');
  hud.style.display = 'flex';
  updateLivesDisplay();
  startBGM();
}

// Show high score on start screen
function showHighScore() {
  const best = localStorage.getItem('neonRunnerBest');
  if (best) {
    document.getElementById('high-score').textContent = `BEST: ${best}`;
  }
}
showHighScore();

initGame();

// Start loop
requestAnimationFrame(gameLoop);
</script>
