<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Дино Прыжок</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family: 'Segoe UI', Arial, sans-serif;
    overflow:hidden;
  }
  #gameContainer {
    position:relative;
    width:800px;
    max-width:95vw;
    height:400px;
    max-height:80vh;
    background:linear-gradient(to bottom, #87CEEB 0%, #ffe0b3 100%);
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 10px 40px rgba(0,0,0,0.5);
    border:3px solid #333;
  }
  #ground {
    position:absolute;
    bottom:0;
    width:100%;
    height:50px;
    background:#8B7355;
    border-top:4px solid #654321;
  }
  #ground::before {
    content:'';
    position:absolute;
    top:0; left:0;
    width:200%;
    height:4px;
    background:repeating-linear-gradient(90deg, #654321 0 20px, transparent 20px 40px);
    animation:moveGround 0.5s linear infinite;
  }
  @keyframes moveGround {
    from { transform:translateX(0); }
    to { transform:translateX(-40px); }
  }
  #dino {
    position:absolute;
    bottom:50px;
    left:60px;
    width:44px;
    height:47px;
    z-index:5;
  }
  #dino svg { width:100%; height:100%; }
  .dino-run .leg {
    animation: run 0.3s infinite;
  }
  @keyframes run {
    0%,100% { transform: rotate(15deg); }
    50% { transform: rotate(-15deg); }
  }
  .cactus {
    position:absolute;
    bottom:50px;
    z-index:5;
  }
  #ui {
    position:absolute;
    top:15px;
    left:15px;
    right:15px;
    display:flex;
    justify-content:space-between;
    z-index:10;
    font-weight:bold;
    color:#333;
    font-size:18px;
    text-shadow:1px 1px 2px rgba(255,255,255,0.5);
  }
  #lives { display:flex; gap:5px; }
  .heart { width:24px; height:24px; }
  .heart.lost svg path { fill:#ccc !important; }
  #score { font-size:20px; }
  #startScreen, #gameOverScreen {
    position:absolute;
    top:0; left:0; right:0; bottom:0;
    background:rgba(0,0,0,0.7);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    z-index:20;
    color:white;
    text-align:center;
    padding:20px;
  }
  #gameOverScreen { display:none; }
  h1 { font-size:32px; margin-bottom:10px; text-shadow:2px 2px 4px #000; }
  p { margin-bottom:20px; font-size:16px; opacity:0.9; }
  button {
    padding:12px 30px;
    font-size:18px;
    border:none;
    border-radius:30px;
    background:linear-gradient(135deg, #ff6b6b, #ee5a6f);
    color:white;
    cursor:pointer;
    font-weight:bold;
    box-shadow:0 4px 15px rgba(238,90,111,0.5);
    transition: all 0.3s ease;
  }
  button:hover {
    background:linear-gradient(135deg, #ee5a6f, #ff6b6b);
    transform:translateY(-3px) scale(1.05);
    box-shadow:0 6px 20px rgba(238,90,111,0.7);
  }
  button:active { transform:translateY(0) scale(0.98); }
  #touchArea {
    position:absolute;
    bottom:0; left:0; right:0;
    height:100%;
    z-index:8;
  }
  .cloud {
    position:absolute;
    background:rgba(255,255,255,0.8);
    border-radius:50px;
    z-index:1;
  }
  @keyframes flash {
    0%,100% { opacity:1; }
    50% { opacity:0.3; }
  }
  .invincible { animation: flash 0.15s infinite; }
</style>
</head>
<body>

<div id="gameContainer">
  <div id="ui">
    <div id="lives">
      <div class="heart" id="h1"><svg viewBox="0 0 24 24"><path fill="#ff4757" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg></div>
      <div class="heart" id="h2"><svg viewBox="0 0 24 24"><path fill="#ff4757" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg></div>
      <div class="heart" id="h3"><svg viewBox="0 0 24 24"><path fill="#ff4757" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg></div>
    </div>
    <div id="score">Счёт: 0</div>
  </div>
  <div class="cloud" style="width:60px;height:25px;top:30px;left:100px;"></div>
  <div class="cloud" style="width:80px;height:30px;top:60px;left:400px;"></div>
  <div class="cloud" style="width:50px;height:20px;top:20px;left:650px;"></div>
  <div id="ground"></div>
  <div id="dino">
    <svg viewBox="0 0 44 47">
      <path fill="#2d3436" d="M8 35 L8 44 L14 44 L14 37 L18 37 L18 44 L24 44 L24 35 Z" class="leg"/>
      <path fill="#2d3436" d="M6 12 Q6 4 16 4 L28 4 Q34 4 36 10 L38 15 L34 15 L34 8 L30 8 L30 20 Q30 30 22 34 L10 34 Q6 32 6 26 Z"/>
      <circle cx="30" cy="10" r="2" fill="white"/>
      <circle cx="30" cy="10" r="1" fill="black"/>
      <path fill="#2d3436" d="M4 24 L6 20 L6 28 Z"/>
    </svg>
  </div>
  <div id="touchArea"></div>
  <div id="startScreen">
    <h1>🦖 Дино Прыжок</h1>
    <p>Нажми ПРОБЕЛ, ↑ или тапни по экрану чтобы прыгнуть</p>
    <button id="startBtn">Начать игру</button>
  </div>
  <div id="gameOverScreen">
    <h1>Игра окончена!</h1>
    <p id="finalScore">Счёт: 0</p>
    <button id="restartBtn">Играть снова</button>
  </div>
</div>

<script>
const container = document.getElementById('gameContainer');
const dino = document.getElementById('dino');
const startScreen = document.getElementById('startScreen');
const gameOverScreen = document.getElementById('gameOverScreen');
const startBtn = document.getElementById('startBtn');
const restartBtn = document.getElementById('restartBtn');
const scoreDisplay = document.getElementById('score');
const finalScoreDisplay = document.getElementById('finalScore');
const hearts = [document.getElementById('h1'), document.getElementById('h2'), document.getElementById('h3')];

let gameRunning = false;
let lives = 3;
let score = 0;
let dinoY = 0;
let dinoVelocity = 0;
let isJumping = false;
let gravity = 0.9;
let jumpForce = -14;
let groundY = 0;
let cacti = [];
let gameSpeed = 5;
let spawnTimer = 0;
let invincible = false;
let animFrame;
let highScore = localStorage.getItem('dinoHighScore') || 0;

function createCactusSVG(type) {
  if (type === 0) {
    return `<svg viewBox="0 0 20 40" width="20" height="40">
      <rect x="7" y="0" width="6" height="40" fill="#2d6a4f"/>
      <rect x="0" y="12" width="7" height="5" fill="#2d6a4f"/>
      <rect x="0" y="12" width="5" height="15" fill="#2d6a4f"/>
      <rect x="13" y="20" width="7" height="5" fill="#2d6a4f"/>
      <rect x="15" y="20" width="5" height="12" fill="#2d6a4f"/>
    </svg>`;
  } else {
    return `<svg viewBox="0 0 40 35" width="40" height="35">
      <rect x="4" y="0" width="6" height="35" fill="#40916c"/>
      <rect x="20" y="8" width="6" height="27" fill="#40916c"/>
      <rect x="0" y="15" width="4" height="5" fill="#40916c"/>
      <rect x="0" y="15" width="4" height="10" fill="#40916c"/>
      <rect x="26" y="18" width="4" height="5" fill="#40916c"/>
      <rect x="30" y="18" width="4" height="10" fill="#40916c"/>
    </svg>`;
  }
}

function spawnCactus() {
  const type = Math.random() > 0.5 ? 0 : 1;
  const el = document.createElement('div');
  el.className = 'cactus';
  el.innerHTML = createCactusSVG(type);
  el.style.right = '-40px';
  container.appendChild(el);
  const width = type === 0 ? 20 : 40;
  const height = type === 0 ? 40 : 35;
  cacti.push({ el, x: container.clientWidth, width, height, passed:false });
}

function resetDino() {
  dinoY = 0;
  dinoVelocity = 0;
  isJumping = false;
  dino.style.bottom = '50px';
}

function jump() {
  if (!isJumping && gameRunning) {
    isJumping = true;
    dinoVelocity = jumpForce;
    dino.classList.remove('dino-run');
  }
}

function updateHearts() {
  hearts.forEach((h, i) => {
    h.classList.toggle('lost', i >= lives);
  });
}

function loseLife() {
  if (invincible) return;
  lives--;
  updateHearts();
  if (lives <= 0) {
    endGame();
  } else {
    invincible = true;
    dino.classList.add('invincible');
    setTimeout(() => {
      invincible = false;
      dino.classList.remove('invincible');
    }, 1500);
  }
}

function endGame() {
  gameRunning = false;
  cancelAnimationFrame(animFrame);
  if (score > highScore) {
    highScore = score;
    localStorage.setItem('dinoHighScore', highScore);
  }
  finalScoreDisplay.textContent = `Счёт: ${Math.floor(score)} | Рекорд: ${Math.floor(highScore)}`;
  gameOverScreen.style.display = 'flex';
  cacti.forEach(c => c.el.remove());
  cacti = [];
}

function gameLoop() {
  if (!gameRunning) return;

  // Dino physics
  if (isJumping) {
    dinoY -= dinoVelocity;
    dinoVelocity += gravity;
    if (dinoY <= 0) {
      dinoY = 0;
      isJumping = false;
      dino.classList.add('dino-run');
    }
    dino.style.bottom = (50 + dinoY) + 'px';
  }

  // Spawn cacti
  spawnTimer++;
  if (spawnTimer > 90 - Math.min(gameSpeed*3, 40)) {
    spawnCactus();
    spawnTimer = 0;
  }

  // Move cacti
  const dinoRect = { left: 60, right: 60+44, bottom: 50+dinoY, top: 50+dinoY+47 };

  for (let i = cacti.length - 1; i >= 0; i--) {
    const c = cacti[i];
    c.x -= gameSpeed;
    c.el.style.right = (container.clientWidth - c.x - c.width) + 'px';

    const cLeft = c.x;
    const cRight = c.x + c.width;
    const cTop = 50 + c.height;

    if (!invincible) {
      if (dinoRect.right > cLeft + 5 && dinoRect.left < cRight - 5 &&
          dinoRect.bottom < cTop - 5) {
        loseLife();
        c.el.remove();
        cacti.splice(i, 1);
        continue;
      }
    }

    if (!c.passed && c.x + c.width < 60) {
      c.passed = true;
      score += 10;
      scoreDisplay.textContent = `Счёт: ${Math.floor(score)}`;
    }

    if (c.x < -50) {
      c.el.remove();
      cacti.splice(i, 1);
    }
  }

  score += 0.1;
  scoreDisplay.textContent = `Счёт: ${Math.floor(score)}`;
  gameSpeed += 0.001;

  animFrame = requestAnimationFrame(gameLoop);
}

function startGame() {
  lives = 3;
  score = 0;
  gameSpeed = 5;
  spawnTimer = 0;
  invincible = false;
  cacti.forEach(c => c.el.remove());
  cacti = [];
  updateHearts();
  resetDino();
  dino.classList.add('dino-run');
  startScreen.style.display = 'none';
  gameOverScreen.style.display = 'none';
  scoreDisplay.textContent = 'Счёт: 0';
  gameRunning = true;
  gameLoop();
}

startBtn.addEventListener('click', startGame);
restartBtn.addEventListener('click', startGame);

document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'ArrowUp') {
    e.preventDefault();
    if (!gameRunning && startScreen.style.display !== 'none') {
      startGame();
    } else {
      jump();
    }
  }
});

document.getElementById('touchArea').addEventListener('touchstart', (e) => {
  e.preventDefault();
  if (!gameRunning && startScreen.style.display !== 'none') {
    startGame();
  } else {
    jump();
  }
});

document.getElementById('touchArea').addEventListener('click', () => {
  if (!gameRunning && startScreen.style.display === 'none' && gameOverScreen.style.display === 'none') return;
  jump();
});

updateHearts();
</script>

</body>
</html>
