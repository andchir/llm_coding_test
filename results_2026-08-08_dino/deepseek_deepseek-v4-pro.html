<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Dino Runner</title>
    <style>
        :root {
            --sky-top: #7ec8e3;
            --sky-bottom: #e8d5b7;
            --ground: #c4a882;
            --ground-line: #8b7355;
            --dino-color: #2c2c2c;
            --cactus-color: #4a8c3f;
            --cactus-dark: #356b2e;
            --ui-bg: rgba(0, 0, 0, 0.35);
            --text-color: #fff;
            --heart-full: #e74c3c;
            --heart-empty: rgba(255, 255, 255, 0.35);
            --btn-bg: #e8a840;
            --btn-hover: #f0c060;
            --btn-text: #3d2b0a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', 'Arial', sans-serif;
            overflow: hidden;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        .game-wrapper {
            width: 100%;
            max-width: 820px;
            padding: 10px;
            display: flex;
            justify-content: center;
        }

        .game-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            aspect-ratio: 2/1;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 0 0 0 3px rgba(255, 255, 255, 0.08);
            cursor: pointer;
            transition: transform 0.08s ease;
        }

        .game-container.shake {
            animation: shake 0.35s ease-out;
        }

        @keyframes shake {
            0%,
            100% {
                transform: translateX(0);
            }
            10% {
                transform: translateX(-10px) rotate(-0.5deg);
            }
            20% {
                transform: translateX(9px) rotate(0.4deg);
            }
            30% {
                transform: translateX(-7px);
            }
            50% {
                transform: translateX(5px);
            }
            70% {
                transform: translateX(-3px);
            }
            85% {
                transform: translateX(2px);
            }
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #7ec8e3 0%, #b8dff0 30%, #e0d0b8 70%, #d4bfa5 100%);
        }

        .ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            pointer-events: none;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            z-index: 10;
        }

        .lives-container {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .heart {
            width: 28px;
            height: 28px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.4));
        }

        .heart.lost {
            opacity: 0.2;
            transform: scale(0.6);
            filter: drop-shadow(0 0px 0px transparent) grayscale(1);
        }

        .heart svg {
            width: 100%;
            height: 100%;
        }

        .score-area {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 2px;
        }

        .score-display {
            font-size: 22px;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
            letter-spacing: 2px;
            font-variant-numeric: tabular-nums;
            font-family: 'Courier New', monospace;
            background: rgba(0, 0, 0, 0.3);
            padding: 4px 12px;
            border-radius: 20px;
            min-width: 70px;
            text-align: center;
        }

        .high-score-mini {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.75);
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
            letter-spacing: 1px;
            background: rgba(0, 0, 0, 0.2);
            padding: 2px 10px;
            border-radius: 10px;
        }

        .game-over-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.65);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            animation: fadeIn 0.4s ease;
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
        }

        .game-over-overlay.active {
            display: flex;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .game-over-overlay h2 {
            font-size: clamp(28px, 5vw, 44px);
            color: #fff;
            text-shadow: 0 3px 12px rgba(0, 0, 0, 0.6);
            margin-bottom: 8px;
            letter-spacing: 3px;
            animation: bounceIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes bounceIn {
            0% {
                transform: scale(0.3);
                opacity: 0;
            }
            50% {
                transform: scale(1.08);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .final-score {
            font-size: clamp(18px, 3vw, 26px);
            color: #ffd700;
            font-weight: 700;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
            margin-bottom: 4px;
            letter-spacing: 1px;
        }

        .best-score {
            font-size: clamp(13px, 2.2vw, 18px);
            color: #e0e0e0;
            margin-bottom: 24px;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.4);
        }

        .restart-btn {
            pointer-events: all;
            padding: 14px 40px;
            font-size: clamp(16px, 2.5vw, 20px);
            font-weight: 700;
            letter-spacing: 2px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            background: linear-gradient(135deg, #e8a840 0%, #d4892a 100%);
            color: #3d2b0a;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4), 0 0 0 0 rgba(232, 168, 64, 0.5);
            transition: all 0.3s ease;
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
        }

        .restart-btn:hover {
            background: linear-gradient(135deg, #f0c060 0%, #e8a840 100%);
            transform: translateY(-3px);
            box-shadow: 0 14px 35px rgba(0, 0, 0, 0.45), 0 0 0 8px rgba(232, 168, 64, 0.2);
            color: #2a1a00;
        }
        .restart-btn:active {
            transform: translateY(0) scale(0.96);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            transition: all 0.1s ease;
        }

        .mobile-hint {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.7);
            font-size: 13px;
            letter-spacing: 1px;
            pointer-events: none;
            z-index: 5;
            transition: opacity 0.6s ease;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
            animation: pulse-hint 2s ease-in-out infinite;
        }

        @keyframes pulse-hint {
            0%,
            100% {
                opacity: 0.5;
            }
            50% {
                opacity: 0.9;
            }
        }

        @media (max-width: 600px) {
            .game-wrapper {
                padding: 4px;
            }
            .game-container {
                border-radius: 12px;
                aspect-ratio: 16/10;
                max-height: 60vh;
            }
            .ui-overlay {
                padding: 10px 14px;
            }
            .heart {
                width: 22px;
                height: 22px;
                gap: 5px;
            }
            .score-display {
                font-size: 17px;
                padding: 3px 10px;
            }
            .high-score-mini {
                font-size: 10px;
            }
            .game-over-overlay h2 {
                font-size: 24px;
            }
            .restart-btn {
                padding: 12px 30px;
                font-size: 15px;
            }
        }

        @media (max-width: 380px) {
            .game-container {
                aspect-ratio: 4/3;
                max-height: 50vh;
                border-radius: 10px;
            }
            .heart {
                width: 18px;
                height: 18px;
                gap: 4px;
            }
            .ui-overlay {
                padding: 8px 10px;
            }
            .score-display {
                font-size: 14px;
                padding: 2px 8px;
            }
        }
    </style>
</head>
<body>
    <div class="game-wrapper">
        <div class="game-container" id="gameContainer">
            <canvas id="gameCanvas" width="800" height="400"></canvas>
            <div class="ui-overlay" id="uiOverlay">
                <div class="lives-container" id="livesContainer">
                    <div class="heart" id="heart1">
                        <svg viewBox="0 0 24 24"><path d="M12 21.5l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.68L12 21.5z" fill="#e74c3c"/></svg>
                    </div>
                    <div class="heart" id="heart2">
                        <svg viewBox="0 0 24 24"><path d="M12 21.5l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.68L12 21.5z" fill="#e74c3c"/></svg>
                    </div>
                    <div class="heart" id="heart3">
                        <svg viewBox="0 0 24 24"><path d="M12 21.5l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.68L12 21.5z" fill="#e74c3c"/></svg>
                    </div>
                </div>
                <div class="score-area">
                    <div class="score-display" id="scoreDisplay">0</div>
                    <div class="high-score-mini" id="highScoreMini">Рекорд: 0</div>
                </div>
            </div>
            <div class="mobile-hint" id="mobileHint">Тапните чтобы прыгнуть</div>
            <div class="game-over-overlay" id="gameOverOverlay">
                <h2>Игра окончена</h2>
                <p class="final-score">Счёт: <span id="finalScore">0</span></p>
                <p class="best-score">Рекорд: <span id="bestScore">0</span></p>
                <button class="restart-btn" id="restartButton">Играть снова</button>
            </div>
        </div>
    </div>

    <script>
        (function() {
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const gameContainer = document.getElementById('gameContainer');
            const gameOverOverlay = document.getElementById('gameOverOverlay');
            const scoreDisplay = document.getElementById('scoreDisplay');
            const highScoreMini = document.getElementById('highScoreMini');
            const finalScoreEl = document.getElementById('finalScore');
            const bestScoreEl = document.getElementById('bestScore');
            const restartBtn = document.getElementById('restartButton');
            const mobileHint = document.getElementById('mobileHint');
            const livesContainer = document.getElementById('livesContainer');
            const hearts = [
                document.getElementById('heart1'),
                document.getElementById('heart2'),
                document.getElementById('heart3'),
            ];

            const W = 800;
            const H = 400;
            const GROUND_Y = 345;
            const DINO_X = 100;

            let state;
            let lastTime = 0;
            let highScore = 0;

            try {
                const saved = localStorage.getItem('dinoRunnerHighScore');
                if (saved) highScore = parseInt(saved, 10) || 0;
            } catch (e) {}

            highScoreMini.textContent = 'Рекорд: ' + highScore;
            bestScoreEl.textContent = highScore;

            function initState() {
                state = {
                    dinoY: GROUND_Y,
                    dinoVY: 0,
                    isJumping: false,
                    lives: 3,
                    invulnerable: false,
                    invulnerableTimer: 0,
                    score: 0,
                    speed: 280,
                    isGameOver: false,
                    cacti: [],
                    spawnTimer: 1.8,
                    particles: [],
                    dustParticles: [],
                    legPhase: 0,
                    legSpeed: 10,
                    shakeTimer: 0,
                    mountains: [],
                    clouds: [],
                    groundPebbles: [],
                    difficultyLevel: 1,
                };

                for (let i = 0; i < 5; i++) {
                    state.mountains.push({
                        x: i * 180 + Math.random() * 80,
                        height: 50 + Math.random() * 90,
                        width: 80 + Math.random() * 140,
                        color: `rgba(${180 + Math.random()*40},${150 + Math.random()*30},${120 + Math.random()*25},0.5)`,
                    });
                }
                for (let i = 0; i < 4; i++) {
                    state.clouds.push({
                        x: Math.random() * W,
                        y: 30 + Math.random() * 100,
                        w: 60 + Math.random() * 100,
                        h: 20 + Math.random() * 30,
                        speed: 15 + Math.random() * 25,
                    });
                }
                for (let i = 0; i < 30; i++) {
                    state.groundPebbles.push({
                        x: Math.random() * W,
                        y: GROUND_Y + 8 + Math.random() * 45,
                        r: 1.5 + Math.random() * 3.5,
                        color: `rgba(${140 + Math.random()*60},${110 + Math.random()*40},${70 + Math.random()*35},0.5)`,
                    });
                }
            }

            function resetGame() {
                initState();
                updateHeartsUI();
                scoreDisplay.textContent = '0';
                gameOverOverlay.classList.remove('active');
                mobileHint.style.opacity = '1';
                gameContainer.classList.remove('shake');
                lastTime = performance.now();
            }

            function updateHeartsUI() {
                for (let i = 0; i < 3; i++) {
                    if (i < state.lives) {
                        hearts[i].classList.remove('lost');
                    } else {
                        hearts[i].classList.add('lost');
                    }
                }
            }

            function jump() {
                if (state.isGameOver) return;
                if (!state.isJumping && state.dinoY >= GROUND_Y - 2) {
                    state.isJumping = true;
                    state.dinoVY = -520;
                    state.dinoY = GROUND_Y;
                    for (let i = 0; i < 6; i++) {
                        state.dustParticles.push({
                            x: DINO_X - 10 + Math.random() * 20,
                            y: GROUND_Y,
                            vx: (Math.random() - 0.5) * 80,
                            vy: -(Math.random() * 100 + 60),
                            life: 0.4 + Math.random() * 0.4,
                            maxLife: 0.5,
                            r: 2 + Math.random() * 3,
                        });
                    }
                    if (mobileHint.style.opacity !== '0') {
                        mobileHint.style.opacity = '0';
                    }
                }
            }

            function spawnCactus() {
                const count = Math.random() < 0.25 ? (Math.random() < 0.5 ? 2 : 3) : 1;
                const baseX = W + 40;
                for (let i = 0; i < count; i++) {
                    const h = 35 + Math.random() * 55;
                    const w = 14 + Math.random() * 18;
                    state.cacti.push({
                        x: baseX + i * (50 + Math.random() * 80),
                        y: GROUND_Y - h,
                        width: w,
                        height: h,
                        hasBranch: Math.random() < 0.45,
                        branchSide: Math.random() < 0.5 ? 'left' : 'right',
                        branchHeight: h * (0.4 + Math.random() * 0.35),
                        branchLength: w * (0.8 + Math.random() * 1.5),
                    });
                }
            }

            function createCollisionParticles(x, y) {
                for (let i = 0; i < 18; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = 100 + Math.random() * 300;
                    state.particles.push({
                        x: x,
                        y: y,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed - 100,
                        life: 0.5 + Math.random() * 0.7,
                        maxLife: 0.8,
                        r: 2 + Math.random() * 4,
                        color: Math.random() < 0.5 ? '#ff6b4a' : '#ffaa44',
                    });
                }
            }

            function takeDamage(cactus) {
                if (state.invulnerable || state.isGameOver) return;
                state.lives--;
                state.invulnerable = true;
                state.invulnerableTimer = 1.6;
                state.shakeTimer = 0.35;
                gameContainer.classList.add('shake');
                const cx = cactus.x + cactus.width / 2;
                const cy = cactus.y + cactus.height / 2;
                createCollisionParticles(cx, cy);
                updateHeartsUI();
                if (state.lives <= 0) {
                    state.isGameOver = true;
                    state.lives = 0;
                    if (state.score > highScore) {
                        highScore = state.score;
                        try { localStorage.setItem('dinoRunnerHighScore', highScore); } catch (e) {}
                    }
                    finalScoreEl.textContent = state.score;
                    bestScoreEl.textContent = highScore;
                    highScoreMini.textContent = 'Рекорд: ' + highScore;
                    gameOverOverlay.classList.add('active');
                }
                setTimeout(() => {
                    gameContainer.classList.remove('shake');
                }, 350);
            }

            function update(dt) {
                if (state.isGameOver) return;

                if (state.shakeTimer > 0) {
                    state.shakeTimer -= dt;
                    if (state.shakeTimer <= 0) {
                        gameContainer.classList.remove('shake');
                    }
                }

                state.speed += dt * 8;
                if (state.speed > 650) state.speed = 650;
                state.difficultyLevel = 1 + Math.floor((state.speed - 280) / 80);

                state.score += Math.floor(dt * 12 * (state.speed / 280));
                scoreDisplay.textContent = state.score;

                if (state.invulnerable) {
                    state.invulnerableTimer -= dt;
                    if (state.invulnerableTimer <= 0) {
                        state.invulnerable = false;
                        state.invulnerableTimer = 0;
                    }
                }

                // Dino physics
                if (state.isJumping) {
                    state.dinoVY += 1350 * dt;
                    state.dinoY += state.dinoVY * dt;
                    if (state.dinoY >= GROUND_Y) {
                        state.dinoY = GROUND_Y;
                        state.dinoVY = 0;
                        state.isJumping = false;
                        for (let i = 0; i < 3; i++) {
                            state.dustParticles.push({
                                x: DINO_X - 8 + Math.random() * 16,
                                y: GROUND_Y,
                                vx: (Math.random() - 0.5) * 40,
                                vy: -(Math.random() * 30 + 20),
                                life: 0.2 + Math.random() * 0.3,
                                maxLife: 0.35,
                                r: 1.5 + Math.random() * 2.5,
                            });
                        }
                    }
                }

                // Leg animation
                if (!state.isJumping) {
                    state.legPhase += state.legSpeed * dt * (state.speed / 280);
                }

                // Spawn cacti
                state.spawnTimer -= dt;
                if (state.spawnTimer <= 0) {
                    spawnCactus();
                    const baseInterval = 1.5 / (state.speed / 280);
                    state.spawnTimer = baseInterval * (0.7 + Math.random() * 1.3);
                    if (state.spawnTimer < 0.6) state.spawnTimer = 0.6;
                }

                // Move cacti
                for (let i = state.cacti.length - 1; i >= 0; i--) {
                    state.cacti[i].x -= state.speed * dt;
                    if (state.cacti[i].x < -80) {
                        state.cacti.splice(i, 1);
                    }
                }

                // Collision detection
                if (!state.invulnerable && !state.isGameOver) {
                    const dinoLeft = DINO_X - 20;
                    const dinoRight = DINO_X + 20;
                    const dinoTop = state.dinoY - 48;
                    const dinoBottom = state.dinoY;

                    for (const cactus of state.cacti) {
                        const cLeft = cactus.x + 6;
                        const cRight = cactus.x + cactus.width - 6;
                        const cTop = cactus.y + 4;
                        const cBottom = cactus.y + cactus.height;

                        if (
                            dinoRight > cLeft &&
                            dinoLeft < cRight &&
                            dinoBottom > cTop &&
                            dinoTop < cBottom
                        ) {
                            takeDamage(cactus);
                            break;
                        }

                        if (cactus.hasBranch && !state.invulnerable && !state.isGameOver) {
                            const bY = cactus.y + cactus.height - cactus.branchHeight;
                            let bLeft, bRight;
                            if (cactus.branchSide === 'left') {
                                bLeft = cactus.x - cactus.branchLength;
                                bRight = cactus.x + 4;
                            } else {
                                bLeft = cactus.x + cactus.width - 4;
                                bRight = cactus.x + cactus.width + cactus.branchLength;
                            }
                            const bTop = bY;
                            const bBottom = bY + cactus.branchLength * 0.55;
                            if (
                                dinoRight > bLeft &&
                                dinoLeft < bRight &&
                                dinoBottom > bTop &&
                                dinoTop < bBottom
                            ) {
                                takeDamage(cactus);
                                break;
                            }
                        }
                    }
                }

                // Update particles
                for (let i = state.particles.length - 1; i >= 0; i--) {
                    const p = state.particles[i];
                    p.x += p.vx * dt;
                    p.y += p.vy * dt;
                    p.vy += 400 * dt;
                    p.life -= dt;
                    if (p.life <= 0) state.particles.splice(i, 1);
                }
                for (let i = state.dustParticles.length - 1; i >= 0; i--) {
                    const p = state.dustParticles[i];
                    p.x += p.vx * dt;
                    p.y += p.vy * dt;
                    p.life -= dt;
                    if (p.life <= 0) state.dustParticles.splice(i, 1);
                }

                // Move clouds
                for (const cloud of state.clouds) {
                    cloud.x -= cloud.speed * dt;
                    if (cloud.x < -cloud.w) cloud.x = W + cloud.w;
                }

                // Dust when running
                if (!state.isJumping && Math.random() < 0.5) {
                    state.dustParticles.push({
                        x: DINO_X - 15 + Math.random() * 25,
                        y: GROUND_Y - 1,
                        vx: -(Math.random() * 60 + 30),
                        vy: -(Math.random() * 20 + 8),
                        life: 0.25 + Math.random() * 0.35,
                        maxLife: 0.4,
                        r: 1 + Math.random() * 2.5,
                    });
                }
            }

            function drawSky() {
                const grad = ctx.createLinearGradient(0, 0, 0, H);
                grad.addColorStop(0, '#7ec8e3');
                grad.addColorStop(0.35, '#b5dff5');
                grad.addColorStop(0.7, '#e8d8c0');
                grad.addColorStop(1, '#dcc8a8');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, W, H);
            }

            function drawClouds() {
                for (const cloud of state.clouds) {
                    ctx.fillStyle = 'rgba(255,255,255,0.55)';
                    ctx.beginPath();
                    const cx = cloud.x;
                    const cy = cloud.y;
                    const rY = cloud.h / 2;
                    const rX = cloud.w / 3;
                    ctx.ellipse(cx, cy, rX, rY, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.ellipse(cx - rX * 0.7, cy + rY * 0.3, rX * 0.7, rY * 0.75, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.ellipse(cx + rX * 0.6, cy + rY * 0.2, rX * 0.65, rY * 0.7, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.ellipse(cx - rX * 0.2, cy - rY * 0.5, rX * 0.55, rY * 0.7, 0, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            function drawMountains() {
                for (const m of state.mountains) {
                    ctx.fillStyle = m.color;
                    ctx.beginPath();
                    ctx.moveTo(m.x - m.width / 2, GROUND_Y);
                    ctx.lineTo(m.x, GROUND_Y - m.height);
                    ctx.lineTo(m.x + m.width / 2, GROUND_Y);
                    ctx.closePath();
                    ctx.fill();

                    ctx.fillStyle = 'rgba(255,255,255,0.12)';
                    ctx.beginPath();
                    ctx.moveTo(m.x - m.width / 2, GROUND_Y);
                    ctx.lineTo(m.x, GROUND_Y - m.height);
                    ctx.lineTo(m.x - m.width * 0.1, GROUND_Y);
                    ctx.closePath();
                    ctx.fill();
                }
            }

            function drawGround() {
                ctx.fillStyle = '#c9b292';
                ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);

                ctx.strokeStyle = '#9b8468';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(0, GROUND_Y);
                ctx.lineTo(W, GROUND_Y);
                ctx.stroke();

                ctx.strokeStyle = '#b8a080';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(0, GROUND_Y + 12);
                ctx.lineTo(W, GROUND_Y + 12);
                ctx.stroke();

                for (const pebble of state.groundPebbles) {
                    ctx.fillStyle = pebble.color;
                    ctx.beginPath();
                    ctx.arc(pebble.x, pebble.y, pebble.r, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            function drawDino(x, bottomY, legPhase, alpha) {
                ctx.save();
                ctx.globalAlpha = alpha;

                const bodyCenterX = x;
                const bodyCenterY = bottomY - 32;
                const bodyRX = 16;
                const bodyRY = 13;

                // Tail
                ctx.fillStyle = '#2c2c2c';
                ctx.beginPath();
                ctx.moveTo(bodyCenterX - bodyRX + 2, bodyCenterY - 2);
                ctx.quadraticCurveTo(bodyCenterX - bodyRX - 18, bodyCenterY - 12, bodyCenterX - bodyRX - 22, bodyCenterY -
                    22);
                ctx.quadraticCurveTo(bodyCenterX - bodyRX - 12, bodyCenterY - 5, bodyCenterX - bodyRX + 1, bodyCenterY +
                    5);
                ctx.closePath();
                ctx.fill();

                // Body
                ctx.fillStyle = '#2c2c2c';
                ctx.beginPath();
                ctx.ellipse(bodyCenterX, bodyCenterY, bodyRX, bodyRY, 0, 0, Math.PI * 2);
                ctx.fill();

                // Neck & Head
                const headCX = bodyCenterX + bodyRX - 2;
                const headCY = bodyCenterY - bodyRY - 4;
                ctx.fillStyle = '#2c2c2c';
                ctx.beginPath();
                ctx.ellipse(headCX, headCY, 11, 10, -0.2, 0, Math.PI * 2);
                ctx.fill();

                // Jaw
                ctx.beginPath();
                ctx.moveTo(headCX + 6, headCY + 4);
                ctx.quadraticCurveTo(headCX + 14, headCY + 6, headCX + 16, headCY + 1);
                ctx.quadraticCurveTo(headCX + 10, headCY - 3, headCX + 4, headCY - 5);
                ctx.closePath();
                ctx.fill();

                // Eye
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(headCX + 4, headCY - 3, 3.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#111';
                ctx.beginPath();
                ctx.arc(headCX + 5, headCY - 3, 1.8, 0, Math.PI * 2);
                ctx.fill();

                // Small arms
                ctx.fillStyle = '#2c2c2c';
                ctx.beginPath();
                ctx.moveTo(bodyCenterX + 8, bodyCenterY - 4);
                ctx.quadraticCurveTo(bodyCenterX + 16, bodyCenterY + 2, bodyCenterX + 13, bodyCenterY + 10);
                ctx.lineWidth = 3;
                ctx.strokeStyle = '#2c2c2c';
                ctx.lineCap = 'round';
                ctx.stroke();
                ctx.lineWidth = 1;

                // Legs
                const legTopY = bodyCenterY + bodyRY - 3;
                const legBottomY = bottomY;
                const legLen = legBottomY - legTopY;

                const phaseNorm = legPhase % (Math.PI * 2);
                const leg1Offset = Math.sin(phaseNorm) * 8;
                const leg2Offset = Math.sin(phaseNorm + Math.PI) * 8;

                ctx.strokeStyle = '#2c2c2c';
                ctx.lineWidth = 5;
                ctx.lineCap = 'round';

                // Back leg
                ctx.beginPath();
                ctx.moveTo(bodyCenterX - 5, legTopY);
                ctx.lineTo(bodyCenterX - 5 + leg2Offset, legTopY + legLen * 0.5);
                ctx.lineTo(bodyCenterX - 5 + leg2Offset, legBottomY);
                ctx.stroke();
                ctx.fillStyle = '#2c2c2c';
                ctx.beginPath();
                ctx.arc(bodyCenterX - 5 + leg2Offset, legBottomY, 3.5, 0, Math.PI * 2);
                ctx.fill();

                // Front leg
                ctx.beginPath();
                ctx.moveTo(bodyCenterX + 3, legTopY);
                ctx.lineTo(bodyCenterX + 3 + leg1Offset, legTopY + legLen * 0.5);
                ctx.lineTo(bodyCenterX + 3 + leg1Offset, legBottomY);
                ctx.stroke();
                ctx.fillStyle = '#2c2c2c';
                ctx.beginPath();
                ctx.arc(bodyCenterX + 3 + leg1Offset, legBottomY, 3.5, 0, Math.PI * 2);
                ctx.fill();

                ctx.lineWidth = 1;
                ctx.restore();
            }

            function drawCactus(cactus) {
                const x = cactus.x;
                const y = cactus.y;
                const w = cactus.width;
                const h = cactus.height;

                // Main body
                const grad = ctx.createLinearGradient(x, 0, x + w, 0);
                grad.addColorStop(0, '#5a9e4b');
                grad.addColorStop(0.5, '#6db860');
                grad.addColorStop(1, '#3d7a32');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.roundRect(x, y, w, h, w * 0.4);
                ctx.fill();

                // Highlight
                ctx.fillStyle = 'rgba(255,255,255,0.15)';
                ctx.beginPath();
                ctx.roundRect(x + w * 0.15, y + 2, w * 0.3, h - 4, w * 0.2);
                ctx.fill();

                // Spines
                ctx.fillStyle = '#3d6b30';
                for (let sy = y + 8; sy < y + h - 6; sy += 10 + Math.random() * 6) {
                    ctx.beginPath();
                    ctx.arc(x + 1.5, sy, 1.2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(x + w - 1.5, sy + 4, 1.2, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Branch
                if (cactus.hasBranch) {
                    const bY = y + h - cactus.branchHeight;
                    const bLen = cactus.branchLength;
                    const bW = w * 0.7;
                    const side = cactus.branchSide;

                    let bX;
                    if (side === 'left') {
                        bX = x - bLen;
                    } else {
                        bX = x + w;
                    }

                    const bGrad = ctx.createLinearGradient(bX, 0, bX + bLen, 0);
                    bGrad.addColorStop(0, '#5a9e4b');
                    bGrad.addColorStop(0.5, '#6db860');
                    bGrad.addColorStop(1, '#3d7a32');
                    ctx.fillStyle = bGrad;
                    ctx.beginPath();
                    if (side === 'left') {
                        ctx.roundRect(bX, bY, bLen, bW, bW * 0.4);
                    } else {
                        ctx.roundRect(bX, bY, bLen, bW, bW * 0.4);
                    }
                    ctx.fill();

                    ctx.fillStyle = 'rgba(255,255,255,0.12)';
                    ctx.beginPath();
                    if (side === 'left') {
                        ctx.roundRect(bX + bLen * 0.1, bY + 1, bLen * 0.5, bW - 2, bW * 0.3);
                    } else {
                        ctx.roundRect(bX + bLen * 0.1, bY + 1, bLen * 0.5, bW - 2, bW * 0.3);
                    }
                    ctx.fill();
                }
            }

            function drawParticles() {
                for (const p of state.particles) {
                    const alpha = p.life / p.maxLife;
                    ctx.fillStyle = p.color.replace(')', `,${alpha})`).replace('rgb',
                        'rgba');
                    if (p.color.startsWith('#')) {
                        ctx.fillStyle = p.color;
                        ctx.globalAlpha = alpha;
                    }
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r * alpha, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.globalAlpha = 1;

                for (const p of state.dustParticles) {
                    const alpha = p.life / p.maxLife;
                    ctx.fillStyle = `rgba(180,150,120,${alpha})`;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            function render() {
                ctx.clearRect(0, 0, W, H);
                drawSky();
                drawClouds();
                drawMountains();
                drawGround();

                for (const cactus of state.cacti) {
                    drawCactus(cactus);
                }

                const alpha = (state.invulnerable && Math.floor(state.invulnerableTimer * 20) % 2 === 0) ? 0.35 : 1;
                drawDino(DINO_X, state.dinoY, state.legPhase, alpha);

                drawParticles();

                // Speed indicator
                if (state.speed > 350) {
                    ctx.fillStyle = 'rgba(255,255,255,0.08)';
                    ctx.font = '10px monospace';
                    ctx.textAlign = 'right';
                    ctx.fillText('Speed: ' + Math.floor(state.speed), W - 16, GROUND_Y + 30);
                }
            }

            function gameLoop(timestamp) {
                if (!lastTime) lastTime = timestamp;
                let dt = (timestamp - lastTime) / 1000;
                if (dt > 0.15) dt = 0.15;
                if (dt <= 0) dt = 0.016;
                lastTime = timestamp;

                update(dt);
                render();
                requestAnimationFrame(gameLoop);
            }

            // Input handlers
            function handleInput(e) {
                e.preventDefault();
                if (state.isGameOver) {
                    resetGame();
                } else {
                    jump();
                }
            }

            canvas.addEventListener('touchstart', handleInput, { passive: false });
            canvas.addEventListener('mousedown', handleInput);
            document.addEventListener('keydown', function(e) {
                if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
                    e.preventDefault();
                    if (state.isGameOver) {
                        resetGame();
                    } else {
                        jump();
                    }
                }
            });

            restartBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                resetGame();
            });
            restartBtn.addEventListener('touchend', function(e) {
                e.stopPropagation();
                e.preventDefault();
                resetGame();
            });

            // Prevent double-tap zoom
            document.addEventListener('dblclick', function(e) {
                if (e.target.closest('.game-container')) {
                    e.preventDefault();
                }
            });

            // Initialize and start
            initState();
            updateHeartsUI();
            highScoreMini.textContent = 'Рекорд: ' + highScore;
            bestScoreEl.textContent = highScore;
            lastTime = performance.now();
            requestAnimationFrame(gameLoop);

            // Hide hint after first interaction or after 5 seconds
            setTimeout(() => {
                if (mobileHint.style.opacity !== '0') {
                    mobileHint.style.transition = 'opacity 1s ease';
                    mobileHint.style.opacity = '0';
                }
            }, 6000);

            console.log('🦖 Dino Runner готов! Пробел/тап для прыжка. 3 жизни. Удачи!');
        })();
    </script>
</body>
