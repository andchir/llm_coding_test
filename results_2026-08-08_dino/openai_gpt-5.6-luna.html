<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Дино-прыжок</title>
<style>
:root {
  --bg: #101827;
  --panel: #17243a;
  --accent: #71e05c;
  --accent-2: #ffc857;
  --text: #f5f7ff;
  --muted: #9cabc4;
  --danger: #ff6577;
}
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}
html, body {
  margin: 0;
  min-height: 100%;
  font-family: Arial, sans-serif;
  background:
    radial-gradient(circle at 20% 10%, rgba(113,224,92,.12), transparent 30%),
    linear-gradient(145deg, #0d1422, var(--bg));
  color: var(--text);
  overflow: hidden;
}
body {
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 16px;
}
.app {
  width: min(100%, 920px);
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.title {
  display: flex;
  align-items: center;
  gap: 10px;
}
.title h1 {
  margin: 0;
  font-size: clamp(22px, 5vw, 36px);
  letter-spacing: -1px;
}
.dino-mark {
  width: 44px;
  height: 44px;
  display: grid;
  place-items: center;
  border-radius: 14px;
  background: var(--accent);
  color: #102016;
  font-size: 26px;
  box-shadow: 0 7px 22px rgba(113,224,92,.25);
  animation: bob 2s ease-in-out infinite;
}
.stats {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 9px;
  flex-wrap: wrap;
}
.stat {
  padding: 8px 12px;
  border: 1px solid rgba(255,255,255,.11);
  border-radius: 12px;
  background: rgba(255,255,255,.06);
  color: var(--muted);
  font-size: 13px;
}
.stat strong {
  color: var(--text);
  margin-left: 4px;
}
.game-card {
  position: relative;
  padding: 10px;
  border-radius: 24px;
  background: rgba(255,255,255,.07);
  border: 1px solid rgba(255,255,255,.1);
  box-shadow: 0 20px 60px rgba(0,0,0,.3);
}
.canvas-wrap {
  position: relative;
  overflow: hidden;
  border-radius: 17px;
  background: #a9e5ed;
  aspect-ratio: 16 / 7;
  min-height: 230px;
}
canvas {
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
}
.overlay {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 22px;
  background: rgba(9,17,29,.3);
  transition: opacity .25s ease, visibility .25s ease;
}
.overlay.hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}
.message {
  max-width: 390px;
  padding: 24px;
  border: 1px solid rgba(255,255,255,.2);
  border-radius: 20px;
  background: rgba(15,27,45,.9);
  backdrop-filter: blur(10px);
}
.message h2 {
  margin: 0 0 8px;
  font-size: clamp(22px, 5vw, 32px);
}
.message p {
  margin: 0 0 17px;
  color: var(--muted);
  line-height: 1.45;
}
button {
  border: 0;
  color: #102016;
  background: var(--accent);
  padding: 12px 22px;
  border-radius: 12px;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: background .2s, transform .2s, box-shadow .2s;
  box-shadow: 0 7px 18px rgba(113,224,92,.2);
}
button:hover {
  background: #a2f58e;
  transform: translateY(-2px);
  box-shadow: 0 10px 24px rgba(113,224,92,.32);
}
button:active {
  transform: translateY(1px) scale(.98);
}
.hint {
  display: flex;
  justify-content: center;
  gap: 8px;
  color: var(--muted);
  font-size: 13px;
}
.key {
  padding: 3px 7px;
  color: var(--text);
  border: 1px solid rgba(255,255,255,.18);
  border-radius: 6px;
  background: rgba(255,255,255,.07);
}
@keyframes bob {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-3px); }
}
@media (max-width: 600px) {
  body { padding: 10px; align-items: flex-start; padding-top: 18px; }
  .header { align-items: flex-start; flex-direction: column; }
  .stats { width: 100%; justify-content: flex-start; }
  .canvas-wrap { aspect-ratio: 1 / .82; min-height: 280px; }
  .game-card { padding: 7px; border-radius: 19px; }
  .hint { text-align: center; line-height: 1.5; }
}
</style>
</head>
<body>
<main class="app">
  <header class="header">
    <div class="title">
      <div class="dino-mark">🦖</div>
      <h1>Дино-прыжок</h1>
    </div>
    <div class="stats">
      <div class="stat">Очки <strong id="score">0</strong></div>
      <div class="stat">Рекорд <strong id="best">0</strong></div>
      <div class="stat">Жизни <strong id="lives">❤❤❤</strong></div>
    </div>
  </header>

  <section class="game-card">
    <div class="canvas-wrap">
      <canvas id="game"></canvas>
      <div class="overlay" id="overlay">
        <div class="message">
          <h2 id="messageTitle">Готовы к прыжку?</h2>
          <p id="messageText">Перепрыгивайте кактусы и набирайте очки. Нажмите на экран или пробел.</p>
          <button id="startBtn">Начать игру</button>
        </div>
      </div>
    </div>
  </section>

  <div class="hint">
    <span class="key">ПРОБЕЛ</span> или <span class="key">ТАП</span> — прыжок
  </div>
</main>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const livesEl = document.getElementById('lives');
const overlay = document.getElementById('overlay');
const titleEl = document.getElementById('messageTitle');
const textEl = document.getElementById('messageText');
const startBtn = document.getElementById('startBtn');

let W = 900, H = 394, dpr = 1;
let running = false;
let gameOver = false;
let score = 0;
let lives = 3;
let best = Number(localStorage.getItem('dinoBest') || 0);
let speed = 5;
let spawnTimer = 0;
let lastTime = 0;
let groundY = 320;
let obstacles = [];
let clouds = [];
let particles = [];

const dino = {
  x: 100, y: 0, w: 47, h: 55, vy: 0, jumping: false,
  reset() {
    this.y = groundY - this.h;
    this.vy = 0;
    this.jumping = false;
  },
  jump() {
    if (!running) return;
    if (!this.jumping) {
      this.vy = -13.5;
      this.jumping = true;
      for (let i = 0; i < 5; i++) particles.push({
        x: this.x + 12, y: groundY - 3, vx: -Math.random() * 2, vy: -Math.random() * 2,
        life: .5, size: 2 + Math.random() * 3
      });
    }
  }
};

function resize() {
  const rect = canvas.getBoundingClientRect();
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = rect.width;
  H = rect.height;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  groundY = H * .82;
  dino.x = Math.max(35, W * .12);
  dino.reset();
  clouds = [
    {x: W*.18, y:H*.18, s:1},
    {x: W*.62, y:H*.28, s:.7},
    {x: W*.88, y:H*.13, s:.55}
  ];
}
window.addEventListener('resize', resize);

function updateStats() {
  scoreEl.textContent = Math.floor(score);
  bestEl.textContent = best;
  livesEl.textContent = '❤'.repeat(lives) + '♡'.repeat(3 - lives);
}

function startGame() {
  running = true;
  gameOver = false;
  score = 0;
  lives = 3;
  speed = 5;
  spawnTimer = 0;
  obstacles = [];
  particles = [];
  dino.reset();
  updateStats();
  overlay.classList.add('hidden');
  lastTime = performance.now();
  requestAnimationFrame(loop);
}

function endGame() {
  running = false;
  gameOver = true;
  if (score > best) {
    best = Math.floor(score);
    localStorage.setItem('dinoBest', best);
  }
  updateStats();
  titleEl.textContent = 'Игра окончена';
  textEl.textContent = `Ваш результат: ${Math.floor(score)}. Рекорд: ${best}.`;
  startBtn.textContent = 'Играть снова';
  overlay.classList.remove('hidden');
}

function hit() {
  lives--;
  updateStats();
  for (let i = 0; i < 14; i++) particles.push({
    x: dino.x + dino.w / 2, y: dino.y + dino.h / 2,
    vx: (Math.random() - .5) * 5, vy: (Math.random() - .5) * 5,
    life: .8, size: 3 + Math.random() * 3
  });
  if (lives <= 0) endGame();
  else {
    obstacles = obstacles.filter(o => o.x > dino.x + dino.w + 100);
    dino.reset();
  }
}

function spawnObstacle() {
  const tall = Math.random() > .35;
  obstacles.push({
    x: W + 30,
    w: tall ? 25 : 19,
    h: tall ? 50 : 35,
    arms: tall,
    passed: false
  });
}

function rectsOverlap(a, b) {
  return a.x + a.w - 8 > b.x + 4 &&
         a.x + 8 < b.x + b.w - 4 &&
         a.y + a.h - 5 > b.y + 3 &&
         a.y + 6 < b.y + b.h;
}

function update(dt) {
  score += dt * 10;
  speed = Math.min(11, 5 + score / 230);
  dino.vy += 34 * dt;
  dino.y += dino.vy * dt;
  if (dino.y >= groundY - dino.h) {
    dino.y = groundY - dino.h;
    dino.vy = 0;
    dino.jumping = false;
  }

  spawnTimer -= dt;
  if (spawnTimer <= 0) {
    spawnObstacle();
    spawnTimer = Math.max(.75, 1.35 - score / 700) + Math.random() * .65;
  }

  for (const o of obstacles) {
    o.x -= speed * 60 * dt;
    o.y = groundY - o.h;
    if (!o.passed && o.x + o.w < dino.x) {
      o.passed = true;
      score += 5;
    }
    if (rectsOverlap(dino, o)) {
      o.x = -200;
      hit();
      break;
    }
  }
  obstacles = obstacles.filter(o => o.x + o.w > -30);

  particles.forEach(p => {
    p.x += p.vx * 60 * dt;
    p.y += p.vy * 60 * dt;
    p.vy += 8 * dt;
    p.life -= dt;
  });
  particles = particles.filter(p => p.life > 0);
  updateStats();
}

function drawCloud(x, y, s) {
  ctx.fillStyle = 'rgba(255,255,255,.58)';
  ctx.beginPath();
  ctx.arc(x, y, 15*s, 0, Math.PI*2);
  ctx.arc(x+20*s, y-8*s, 22*s, 0, Math.PI*2);
  ctx.arc(x+45*s, y, 16*s, 0, Math.PI*2);
  ctx.fillRect(x-3*s, y, 52*s, 15*s);
  ctx.fill();
}

function drawDino() {
  const x = dino.x, y = dino.y;
  ctx.save();
  ctx.fillStyle = '#235d45';
  ctx.beginPath();
  ctx.moveTo(x+8,y+25); ctx.lineTo(x-13,y+40); ctx.lineTo(x+8,y+41);
  ctx.lineTo(x+18,y+52); ctx.lineTo(x+43,y+52); ctx.lineTo(x+45,y+25);
  ctx.quadraticCurveTo(x+44,y+5,x+28,y+5);
  ctx.lineTo(x+19,y+16); ctx.lineTo(x+8,y+13); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#31775a';
  ctx.fillRect(x+25,y+2,21,23);
  ctx.beginPath(); ctx.arc(x+42,y+11,14,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(x+47,y+7,4,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#15251e';
  ctx.beginPath(); ctx.arc(x+48,y+7,2,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#17271e';
  ctx.fillRect(x+22,y+50,7,7);
  ctx.fillRect(x+38,y+50,7,7);
  ctx.fillStyle = '#f0c15b';
  ctx.fillRect(x+47,y+17,9,4);
  ctx.restore();
}

function drawCactus(o) {
  const x = o.x, y = o.y;
  ctx.fillStyle = '#27764e';
  ctx.beginPath();
  ctx.roundRect(x+7,y,15,o.h,7);
  if (o.arms) {
    ctx.roundRect(x-4,y+19,12,8,4);
    ctx.roundRect(x-4,y+12,8,17,4);
    ctx.roundRect(x+21,y+27,12,8,4);
    ctx.roundRect(x+27,y+18,8,17,4);
  }
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.22)';
  ctx.fillRect(x+11,y+7,2,Math.max(10,o.h-15));
}

function draw() {
  const sky = ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#9ce2ee');
  sky.addColorStop(1,'#e6f2d1');
  ctx.fillStyle = sky;
  ctx.fillRect(0,0,W,H);

  clouds.forEach(c => drawCloud(c.x, c.y, c.s));
  ctx.fillStyle = '#b4d997';
  ctx.beginPath();
  ctx.moveTo(0,groundY-44);
  for (let x=0; x<=W; x+=90) ctx.quadraticCurveTo(x+45,groundY-80-(x%160)/5,x+90,groundY-44);
  ctx.lineTo(W,H); ctx.lineTo(0,H); ctx.fill();

  ctx.fillStyle = '#d8b66a';
  ctx.fillRect(0,groundY,W,H-groundY);
  ctx.fillStyle = '#a8874d';
  for (let x=0; x<W; x+=42) {
    ctx.fillRect((x + (score*8)%42), groundY+18, 20, 3);
    ctx.fillRect((x + 18 + (score*5)%42), groundY+38, 10, 2);
  }

  obstacles.forEach(drawCactus);
  drawDino();
  particles.forEach(p => {
    ctx.globalAlpha = Math.max(0,p.life);
    ctx.fillStyle = '#fff1aa';
    ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
  });
}

function loop(time) {
  if (!running) return;
  const dt = Math.min((time - lastTime) / 1000, .035);
  lastTime = time;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

function action(e) {
  if (e) e.preventDefault();
  if (!running) {
    if (gameOver) startGame();
    else startGame();
  } else dino.jump();
}
startBtn.addEventListener('click', startGame);
canvas.addEventListener('pointerdown', action);
window.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp') action(e);
});
resize();
updateStats();
draw();
</script>
</body>
</html>
