<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Дино Прыжок</title>
<style>
  :root {
    --sky: #101b35;
    --sky-light: #1c3560;
    --sand: #f6ca74;
    --sand-dark: #d78d43;
    --ink: #172032;
    --mint: #49e0a1;
    --danger: #ff6273;
    --panel: rgba(12, 23, 45, .78);
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    margin: 0;
    min-height: 100svh;
    display: grid;
    place-items: center;
    overflow: hidden;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
    background:
      radial-gradient(circle at 18% 14%, rgba(87, 159, 255, .23), transparent 26%),
      radial-gradient(circle at 82% 85%, rgba(255, 143, 87, .15), transparent 30%),
      linear-gradient(145deg, #0b1020, #172b50 56%, #0d1830);
  }

  .app {
    width: min(960px, 100%);
    padding: clamp(12px, 3vw, 26px);
    display: grid;
    gap: 14px;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: clamp(18px, 3vw, 27px);
    font-weight: 900;
    letter-spacing: .08em;
    text-transform: uppercase;
  }

  .brand-mark {
    width: 36px;
    height: 36px;
    display: grid;
    place-items: center;
    border-radius: 11px;
    color: var(--ink);
    background: var(--mint);
    box-shadow: 0 0 24px rgba(73, 224, 161, .45);
    animation: bob 1.8s ease-in-out infinite;
  }

  .stats {
    display: flex;
    gap: 8px;
  }

  .stat {
    min-width: 82px;
    padding: 8px 11px;
    border: 1px solid rgba(255,255,255,.13);
    border-radius: 13px;
    background: var(--panel);
    text-align: center;
    backdrop-filter: blur(8px);
  }

  .stat small {
    display: block;
    color: #b3c3df;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .08em;
    text-transform: uppercase;
  }

  .stat b {
    display: block;
    margin-top: 2px;
    font-size: 19px;
  }

  .hearts {
    color: #ff6d7b;
    letter-spacing: 1px;
    white-space: nowrap;
  }

  .game-shell {
    position: relative;
    overflow: hidden;
    border: 2px solid rgba(255,255,255,.15);
    border-radius: 24px;
    background: #101b35;
    box-shadow: 0 25px 65px rgba(0,0,0,.42), inset 0 0 55px rgba(91, 159, 255, .1);
  }

  canvas {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 16 / 8;
    touch-action: manipulation;
    cursor: pointer;
  }

  .hint {
    position: absolute;
    left: 50%;
    bottom: 17px;
    transform: translateX(-50%);
    padding: 8px 13px;
    color: #c9d7f0;
    font-size: 12px;
    font-weight: 700;
    white-space: nowrap;
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 999px;
    background: rgba(9, 18, 37, .6);
    pointer-events: none;
    transition: opacity .25s ease, transform .25s ease;
  }

  .hint.hidden {
    opacity: 0;
    transform: translate(-50%, 12px);
  }

  .overlay {
    position: absolute;
    inset: 0;
    z-index: 3;
    display: grid;
    place-items: center;
    padding: 20px;
    background: rgba(7, 13, 28, .45);
    backdrop-filter: blur(3px);
    transition: opacity .3s ease, visibility .3s ease;
  }

  .overlay.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  .card {
    width: min(370px, 100%);
    padding: clamp(22px, 5vw, 35px);
    text-align: center;
    border: 1px solid rgba(255,255,255,.18);
    border-radius: 24px;
    background: linear-gradient(135deg, rgba(30, 56, 98, .94), rgba(10, 20, 41, .96));
    box-shadow: 0 18px 50px rgba(0,0,0,.36);
    animation: cardIn .45s cubic-bezier(.2, 1.4, .4, 1);
  }

  .card-icon {
    width: 65px;
    height: 65px;
    margin: 0 auto 13px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    font-size: 34px;
    background: rgba(73, 224, 161, .17);
    box-shadow: inset 0 0 0 1px rgba(73,224,161,.35);
  }

  .card h1 {
    margin: 0 0 8px;
    font-size: clamp(26px, 6vw, 37px);
  }

  .card p {
    margin: 0 0 21px;
    color: #bdd0ed;
    line-height: 1.5;
  }

  button {
    border: 0;
    border-radius: 14px;
    padding: 13px 20px;
    color: #10223a;
    font: inherit;
    font-weight: 900;
    cursor: pointer;
    background: var(--mint);
    box-shadow: 0 7px 0 #1d9c6a, 0 12px 25px rgba(73,224,161,.24);
    transition: background .2s ease, color .2s ease, transform .15s ease, box-shadow .15s ease;
  }

  button:hover {
    color: #fff;
    background: #398cff;
    box-shadow: 0 7px 0 #1c559e, 0 12px 25px rgba(57,140,255,.3);
  }

  button:active {
    transform: translateY(5px);
    box-shadow: 0 2px 0 #1c559e, 0 5px 12px rgba(0,0,0,.24);
  }

  .controls {
    display: flex;
    justify-content: center;
  }

  .jump-button {
    width: min(370px, 100%);
    min-height: 55px;
    font-size: 16px;
    letter-spacing: .04em;
  }

  .jump-button span {
    display: inline-block;
    margin-right: 8px;
    font-size: 20px;
    transition: transform .2s ease;
  }

  .jump-button:hover span {
    transform: translateY(-3px);
  }

  @keyframes bob {
    50% { transform: translateY(-4px) rotate(-5deg); }
  }

  @keyframes cardIn {
    from { opacity: 0; transform: scale(.84) translateY(14px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }

  @media (max-width: 520px) {
    .app { padding: 10px; gap: 10px; }
    .brand { letter-spacing: .04em; }
    .brand-mark { width: 31px; height: 31px; }
    .stat { min-width: 67px; padding: 6px 7px; }
    .stat b { font-size: 16px; }
    .game-shell { border-radius: 18px; }
    .hint { bottom: 10px; font-size: 10px; }
    .jump-button { min-height: 50px; }
  }
</style>
</head>
<body>
<main class="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">🦖</div>
      <span>Дино Прыжок</span>
    </div>
    <div class="stats">
      <div class="stat">
        <small>Счёт</small>
        <b id="score">0000</b>
      </div>
      <div class="stat">
        <small>Жизни</small>
        <b class="hearts" id="lives">♥♥♥</b>
      </div>
    </div>
  </header>

  <section class="game-shell" aria-label="Игра динозаврик и кактусы">
    <canvas id="game" width="960" height="480"></canvas>
    <div class="hint" id="hint">Пробел · ↑ · касание экрана</div>

    <div class="overlay" id="overlay">
      <div class="card">
        <div class="card-icon" id="cardIcon">🦖</div>
        <h1 id="title">Дино Прыжок</h1>
        <p id="message">Перепрыгивай кактусы и постарайся набрать как можно больше очков. У тебя 3 жизни!</p>
        <button id="startButton">Начать игру</button>
      </div>
    </div>
  </section>

  <div class="controls">
    <button class="jump-button" id="jumpButton"><span>↑</span>ПРЫЖОК</button>
  </div>
</main>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const livesEl = document.getElementById('lives');
  const overlay = document.getElementById('overlay');
  const title = document.getElementById('title');
  const message = document.getElementById('message');
  const cardIcon = document.getElementById('cardIcon');
  const startButton = document.getElementById('startButton');
  const jumpButton = document.getElementById('jumpButton');
  const hint = document.getElementById('hint');

  const W = canvas.width;
  const H = canvas.height;
  const groundY = 386;
  let running = false;
  let score = 0;
  let lives = 3;
  let speed = 7;
  let lastTime = 0;
  let spawnTimer = 75;
  let cactusId = 0;
  let clouds = [];
  let cacti = [];
  let particles = [];
  let shake = 0;
  let gameTime = 0;

  const dino = {
    x: 138, y: groundY - 74, w: 66, h: 74,
    vy: 0, grounded: true, blink: 0, invincible: 0, step: 0
  };

  function resetScene() {
    score = 0;
    lives = 3;
    speed = 7;
    spawnTimer = 90;
    cacti = [];
    particles = [];
    gameTime = 0;
    shake = 0;
    dino.y = groundY - dino.h;
    dino.vy = 0;
    dino.grounded = true;
    dino.invincible = 0;
    clouds = [
      { x: 100, y: 85, s: 1.1 },
      { x: 470, y: 132, s: .72 },
      { x: 770, y: 65, s: .95 }
    ];
    updateUI();
  }

  function updateUI() {
    scoreEl.textContent = String(Math.floor(score)).padStart(4, '0');
    livesEl.textContent = '♥'.repeat(lives) + '♡'.repeat(3 - lives);
  }

  function startGame() {
    resetScene();
    running = true;
    hint.classList.remove('hidden');
    overlay.classList.add('hidden');
    lastTime = performance.now();
    requestAnimationFrame(loop);
  }

  function jump() {
    if (!running) return;
    if (dino.grounded) {
      dino.vy = -16.2;
      dino.grounded = false;
      dino.step = 1;
      makeDust(dino.x + 24, groundY + 1, 8, '#e5a957');
    }
  }

  function makeDust(x, y, count, color) {
    for (let i = 0; i < count; i++) {
      particles.push({
        x, y,
        vx: (Math.random() - .5) * 4,
        vy: -Math.random() * 2.8,
        life: 20 + Math.random() * 14,
        size: 3 + Math.random() * 5,
        color
      });
    }
  }

  function spawnCactus() {
    const tall = Math.random() > .5;
    const h = tall ? 92 + Math.random() * 36 : 55 + Math.random() * 32;
    const w = tall ? 31 + Math.random() * 10 : 27 + Math.random() * 10;
    cacti.push({ id: cactusId++, x: W + 30, y: groundY - h, w, h, hit: false, arm: Math.random() > .35 });
  }

  function hitDino(cactus) {
    if (dino.invincible > 0 || cactus.hit) return;
    cactus.hit = true;
    lives--;
    dino.invincible = 85;
    shake = 11;
    makeDust(dino.x + dino.w / 2, dino.y + dino.h / 2, 19, '#ff6273');
    updateUI();

    if (lives <= 0) {
      running = false;
      setTimeout(() => {
        title.textContent = 'Игра окончена';
        cardIcon.textContent = '💥';
        message.innerHTML = `Твой результат: <b>${Math.floor(score)}</b><br>Кактусы оказались сильнее, но реванш уже ждёт!`;
        startButton.textContent = 'Играть снова';
        overlay.classList.remove('hidden');
      }, 400);
    }
  }

  function collision(a, b) {
    const padX = 9;
    return a.x + padX < b.x + b.w - 4 &&
      a.x + a.w - padX > b.x + 4 &&
      a.y + 9 < b.y + b.h - 4 &&
      a.y + a.h - 5 > b.y + 4;
  }

  function update(dt) {
    const scale = dt / 16.67;
    gameTime += dt;
    speed = Math.min(15, 7 + score / 270);
    score += .17 * scale;
    updateUI();

    hint.classList.toggle('hidden', score > 12);

    dino.vy += .9 * scale;
    dino.y += dino.vy * scale;

    if (dino.y >= groundY - dino.h) {
      if (!dino.grounded && dino.vy > 2) makeDust(dino.x + 25, groundY, 7, '#e5a957');
      dino.y = groundY - dino.h;
      dino.vy = 0;
      dino.grounded = true;
    }

    dino.step += .19 * scale;
    if (dino.invincible > 0) dino.invincible -= scale;
    if (shake > 0) shake -= .6 * scale;

    spawnTimer -= speed * scale;
    if (spawnTimer <= 0) {
      spawnCactus();
      spawnTimer = 115 + Math.random() * 95 - Math.min(score * .2, 35);
    }

    cacti.forEach(c => {
      c.x -= speed * scale;
      if (collision(dino, c)) hitDino(c);
    });
    cacti = cacti.filter(c => c.x + c.w > -35);

    clouds.forEach(cloud => {
      cloud.x -= speed * .12 * cloud.s * scale;
      if (cloud.x < -130) {
        cloud.x = W + 80;
        cloud.y = 45 + Math.random() * 115;
      }
    });

    particles.forEach(p => {
      p.x += p.vx * scale;
      p.y += p.vy * scale;
      p.vy += .13 * scale;
      p.life -= scale;
    });
    particles = particles.filter(p => p.life > 0);
  }

  function roundRect(x, y, w, h, r, fill) {
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, r);
    if (fill) ctx.fill();
  }

  function drawCloud(x, y, s) {
    ctx.fillStyle = 'rgba(223, 239, 255, .15)';
    ctx.beginPath();
    ctx.arc(x, y + 16*s, 15*s, 0, Math.PI * 2);
    ctx.arc(x + 20*s, y + 8*s, 20*s, 0, Math.PI * 2);
    ctx.arc(x + 44*s, y + 17*s, 14*s, 0, Math.PI * 2);
    ctx.fillRect(x - 2*s, y + 17*s, 61*s, 15*s);
    ctx.fill();
  }

  function drawCactus(c) {
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.fillStyle = c.hit ? '#d44f67' : '#38c879';

    roundRect(0, 0, c.w, c.h, 8, true);
    if (c.arm) {
      const armY = c.h * .46;
      roundRect(-14, armY, 15, 11, 5, true);
      roundRect(-14, armY - 17, 10, 23, 5, true);
    }
    if (c.h > 82) {
      const side = c.w + 3;
      roundRect(side, c.h * .3, 14, 11, 5, true);
      roundRect(side + 5, c.h * .3 - 20, 10, 25, 5, true);
    }

    ctx.strokeStyle = 'rgba(9,82,55,.36)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(c.w * .36, 10); ctx.lineTo(c.w * .36, c.h - 9);
    ctx.moveTo(c.w * .68, 10); ctx.lineTo(c.w * .68, c.h - 9);
    ctx.stroke();

    ctx.fillStyle = '#e8f9a5';
    for (let y = 14; y < c.h - 8; y += 17) {
      ctx.fillRect(3, y, 2, 2);
      ctx.fillRect(c.w - 5, y + 5, 2, 2);
    }
    ctx.restore();
  }

  function drawDino() {
    if (dino.invincible > 0 && Math.floor(dino.invincible / 6) % 2 === 0) return;

    const x = dino.x, y = dino.y;
    const leg = dino.grounded ? Math.sin(dino.step) * 5 : 1;
    ctx.save();
    ctx.translate(x, y);

    ctx.fillStyle = '#49e0a1';
    roundRect(4, 28, 39, 34, 9, true);
    roundRect(27, 4, 39, 35, 9, true);
    roundRect(0, 34, 14, 15, 6, true);

    ctx.beginPath();
    ctx.moveTo(9, 44);
    ctx.lineTo(-15, 31);
    ctx.lineTo(-6, 53);
    ctx.closePath();
    ctx.fill();

    roundRect(15, 56 + leg, 11, 18, 4, true);
    roundRect(38, 56 - leg, 11, 18, 4, true);
    roundRect(10, 70 + leg, 20, 6, 3, true);
    roundRect(35, 70 - leg, 20, 6, 3, true);

    ctx.fillStyle = '#10233b';
    ctx.fillRect(51, 13, 6, 7);
    ctx.fillStyle = '#fff';
    ctx.fillRect(52, 14, 2, 2);

    ctx.fillStyle = '#166c55';
    ctx.fillRect(34, 30, 19, 3);
    ctx.fillRect(14, 40, 4, 3);

    ctx.restore();
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    const offsetX = shake > 0 ? (Math.random() - .5) * shake : 0;
    ctx.save();
    ctx.translate(offsetX, 0);

    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#193867');
    sky.addColorStop(.72, '#5c99bc');
    sky.addColorStop(1, '#f0b569');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = '#ffe5a0';
    ctx.beginPath();
    ctx.arc(780, 91, 37, 0, Math.PI * 2);
    ctx.fill();

    clouds.forEach(c => drawCloud(c.x, c.y, c.s));

    ctx.fillStyle = 'rgba(45, 84, 98, .35)';
    ctx.beginPath();
    ctx.moveTo(0, 295);
    for (let x = 0; x <= W; x += 50) {
      ctx.lineTo(x, 270 + Math.sin(x * .019) * 17);
    }
    ctx.lineTo(W, groundY);
    ctx.lineTo(0, groundY);
    ctx.fill();

    ctx.fillStyle = '#f4c46f';
    ctx.fillRect(0, groundY, W, H - groundY);
    ctx.fillStyle = '#c77d3e';
    ctx.fillRect(0, groundY, W, 7);

    ctx.strokeStyle = 'rgba(154, 88, 40, .35)';
    ctx.lineWidth = 2;
    for (let x = -(gameTime * speed * .34) % 38; x < W; x += 38) {
      ctx.beginPath();
      ctx.moveTo(x, groundY + 27);
      ctx.lineTo(x + 18, groundY + 24);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x + 14, groundY + 69);
      ctx.lineTo(x + 32, groundY + 66);
      ctx.stroke();
    }

    cacti.forEach(drawCactus);
    drawDino();

    particles.forEach(p => {
      ctx.globalAlpha = Math.max(0, p.life / 34);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x, p.y, p.size, p.size);
    });
    ctx.globalAlpha = 1;

    ctx.fillStyle = 'rgba(255,255,255,.85)';
    ctx.font = '900 19px Arial';
    ctx.textAlign = 'left';
    ctx.fillText(`СКОРОСТЬ ×${(speed / 7).toFixed(1)}`, 20, 34);

    ctx.restore();
  }

  function loop(time) {
    if (!running) {
      draw();
      return;
    }
    const dt = Math.min(33, time - lastTime || 16.67);
    lastTime = time;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  function beginFromOverlay() {
    title.textContent = 'Дино Прыжок';
    cardIcon.textContent = '🦖';
    startButton.textContent = 'Начать игру';
    startGame();
  }

  startButton.addEventListener('click', beginFromOverlay);
  jumpButton.addEventListener('pointerdown', e => {
    e.preventDefault();
    jump();
  });

  canvas.addEventListener('pointerdown', e => {
    e.preventDefault();
    if (running) jump();
  });

  window.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
      e.preventDefault();
      if (running) jump();
      else if (!overlay.classList.contains('hidden')) beginFromOverlay();
    }
  });

  resetScene();
  draw();
})();
</script>
</body>
</html>
