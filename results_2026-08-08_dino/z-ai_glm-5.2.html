<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>Динозаврик — Прыжки через кактусы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  :root {
    --sky-1: #ff6b9d;
    --sky-2: #ff9a6b;
    --sky-3: #ffd93d;
    --ground: #3d2817;
    --ground-top: #8b5a2b;
    --dino: #2d5016;
    --accent: #ff3e7f;
    --neon: #00ffc6;
    --text: #fff5e1;
  }
  
  html, body {
    height: 100%;
    overflow: hidden;
    font-family: 'Press Start 2P', monospace;
    background: #1a0b2e;
    color: var(--text);
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    min-height: 100dvh;
    padding: 16px;
    position: relative;
  }
  
  /* Анимированный фон */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: 
      radial-gradient(circle at 20% 30%, rgba(255, 62, 127, 0.25), transparent 50%),
      radial-gradient(circle at 80% 70%, rgba(0, 255, 198, 0.18), transparent 50%),
      linear-gradient(135deg, #1a0b2e 0%, #2d1b4e 50%, #1a0b2e 100%);
    z-index: -2;
  }
  
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image: 
      radial-gradient(2px 2px at 20% 30%, rgba(255,255,255,0.8), transparent),
      radial-gradient(1px 1px at 60% 70%, rgba(255,255,255,0.6), transparent),
      radial-gradient(1px 1px at 80% 20%, rgba(255,255,255,0.7), transparent),
      radial-gradient(2px 2px at 40% 80%, rgba(255,255,255,0.5), transparent),
      radial-gradient(1px 1px at 90% 50%, rgba(255,255,255,0.7), transparent);
    background-size: 300px 300px;
    animation: twinkle 8s ease-in-out infinite;
    z-index: -1;
    pointer-events: none;
  }
  
  @keyframes twinkle {
    0%, 100% { opacity: 0.6; }
    50% { opacity: 1; }
  }
  
  .game-wrap {
    width: 100%;
    max-width: 920px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  
  .hud {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  
  .hud-block {
    background: rgba(20, 10, 40, 0.7);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 2px solid rgba(255, 62, 127, 0.4);
    border-radius: 8px;
    padding: 10px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    box-shadow: 0 0 20px rgba(255, 62, 127, 0.2), inset 0 0 20px rgba(255, 62, 127, 0.05);
  }
  
  .hud-label {
    font-size: 8px;
    color: rgba(255, 245, 225, 0.6);
    letter-spacing: 1px;
  }
  
  .hud-value {
    font-size: 14px;
    color: var(--neon);
    text-shadow: 0 0 8px rgba(0, 255, 198, 0.6);
  }
  
  .hearts {
    display: flex;
    gap: 6px;
  }
  
  .heart {
    width: 22px;
    height: 22px;
    transition: all 0.3s;
  }
  
  .heart svg {
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 0 4px rgba(255, 62, 127, 0.8));
  }
  
  .heart.lost {
    transform: scale(0.7);
    opacity: 0.2;
  }
  
  .heart.lost svg {
    filter: grayscale(1);
  }
  
  .heart.pulse {
    animation: heartPulse 0.4s ease;
  }
  
  @keyframes heartPulse {
    0%, 100% { transform: scale(0.7); }
    50% { transform: scale(1.3); }
  }
  
  .canvas-container {
    position: relative;
    width: 100%;
    border-radius: 14px;
    overflow: hidden;
    border: 3px solid rgba(255, 62, 127, 0.5);
    box-shadow: 
      0 0 40px rgba(255, 62, 127, 0.3),
      0 0 80px rgba(0, 255, 198, 0.1),
      inset 0 0 20px rgba(0, 0, 0, 0.4);
    background: linear-gradient(180deg, var(--sky-1) 0%, var(--sky-2) 50%, var(--sky-3) 100%);
    transition: transform 0.05s;
  }
  
  .canvas-container.shake {
    animation: shake 0.4s;
  }
  
  @keyframes shake {
    0%, 100% { transform: translate(0, 0); }
    20% { transform: translate(-8px, 4px) rotate(-0.5deg); }
    40% { transform: translate(8px, -4px) rotate(0.5deg); }
    60% { transform: translate(-6px, -2px); }
    80% { transform: translate(6px, 2px); }
  }
  
  canvas {
    display: block;
    width: 100%;
    height: auto;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  
  /* Оверлеи */
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    background: rgba(10, 5, 25, 0.78);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    z-index: 10;
    opacity: 1;
    transition: opacity 0.4s, visibility 0.4s;
    padding: 20px;
    text-align: center;
  }
  
  .overlay.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }
  
  .title {
    font-size: clamp(20px, 5vw, 38px);
    color: var(--text);
    text-shadow: 
      3px 3px 0 var(--accent),
      6px 6px 0 rgba(0, 255, 198, 0.4);
    animation: titleBob 2s ease-in-out infinite;
    letter-spacing: 2px;
  }
  
  @keyframes titleBob {
    0%, 100% { transform: translateY(0) rotate(-1deg); }
    50% { transform: translateY(-6px) rotate(1deg); }
  }
  
  .subtitle {
    font-size: 10px;
    color: rgba(255, 245, 225, 0.7);
    line-height: 1.8;
    max-width: 400px;
  }
  
  .btn {
    font-family: inherit;
    font-size: 12px;
    padding: 14px 28px;
    border: 3px solid var(--neon);
    background: transparent;
    color: var(--neon);
    cursor: pointer;
    letter-spacing: 2px;
    transition: all 0.25s;
    position: relative;
    overflow: hidden;
    text-transform: uppercase;
    border-radius: 4px;
  }
  
  .btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--neon);
    transform: translateY(100%);
    transition: transform 0.25s;
    z-index: -1;
  }
  
  .btn:hover {
    color: #1a0b2e;
    box-shadow: 0 0 25px var(--neon);
    transform: translateY(-2px);
  }
  
  .btn:hover::before {
    transform: translateY(0);
  }
  
  .btn:active {
    transform: translateY(0);
  }
  
  .btn.accent {
    border-color: var(--accent);
    color: var(--accent);
  }
  
  .btn.accent::before {
    background: var(--accent);
  }
  
  .btn.accent:hover {
    color: #fff;
    box-shadow: 0 0 25px var(--accent);
  }
  
  .game-over-stats {
    display: flex;
    flex-direction: column;
    gap: 10px;
    align-items: center;
  }
  
  .stat-line {
    font-size: 11px;
    color: rgba(255, 245, 225, 0.8);
  }
  
  .stat-line .val {
    color: var(--neon);
    font-size: 16px;
    margin-left: 8px;
    text-shadow: 0 0 8px rgba(0, 255, 198, 0.6);
  }
  
  .new-record {
    font-size: 10px;
    color: var(--accent);
    animation: blink 0.6s infinite;
  }
  
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }
  
  .controls-hint {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 6px;
  }
  
  .key {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 8px;
    color: rgba(255, 245, 225, 0.6);
    padding: 6px 10px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 4px;
  }
  
  .key kbd {
    font-family: inherit;
    background: rgba(255, 62, 127, 0.3);
    border: 1px solid var(--accent);
    padding: 2px 6px;
    border-radius: 3px;
    font-size: 8px;
    color: var(--text);
  }
  
  /* Мобильные кнопки управления */
  .mobile-controls {
    display: none;
    gap: 12px;
    justify-content: center;
    margin-top: 4px;
  }
  
  .mobile-btn {
    flex: 1;
    max-width: 200px;
    padding: 18px;
    font-family: inherit;
    font-size: 11px;
    border: 2px solid rgba(0, 255, 198, 0.5);
    background: rgba(0, 255, 198, 0.1);
    color: var(--neon);
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 1px;
  }
  
  .mobile-btn:active {
    background: rgba(0, 255, 198, 0.4);
    transform: scale(0.96);
  }
  
  @media (hover: none) and (pointer: coarse) {
    .mobile-controls { display: flex; }
  }
  
  @media (max-width: 600px) {
    .mobile-controls { display: flex; }
    body { padding: 8px; }
    .hud-block { padding: 8px 10px; }
    .hud-label { font-size: 7px; }
    .hud-value { font-size: 11px; }
    .heart { width: 16px; height: 16px; }
    .game-wrap { gap: 10px; }
  }
  
  /* Анимация появления */
  .overlay:not(.hidden) > * {
    animation: fadeUp 0.5s ease backwards;
  }
  
  .overlay:not(.hidden) > *:nth-child(2) { animation-delay: 0.1s; }
  .overlay:not(.hidden) > *:nth-child(3) { animation-delay: 0.2s; }
  .overlay:not(.hidden) > *:nth-child(4) { animation-delay: 0.3s; }
  
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<div class="game-wrap">
  <!-- HUD -->
  <div class="hud">
    <div class="hud-block">
      <span class="hud-label">ОЧКИ</span>
      <span class="hud-value" id="scoreEl">0</span>
    </div>
    <div class="hud-block">
      <span class="hud-label">ЖИЗНИ</span>
      <div class="hearts" id="heartsEl"></div>
    </div>
    <div class="hud-block">
      <span class="hud-label">РЕКОРД</span>
      <span class="hud-value" id="highScoreEl">0</span>
    </div>
  </div>
  
  <!-- Игровое поле -->
  <div class="canvas-container" id="canvasContainer">
    <canvas id="game"></canvas>
    
    <!-- Стартовый экран -->
    <div class="overlay" id="startScreen">
      <h1 class="title">ДИНОЗАВРИК</h1>
      <p class="subtitle">Прыгай через кактусы и выживай как можно дольше. У тебя 3 жизни — береги их!</p>
      <button class="btn" id="startBtn">НАЧАТЬ ИГРУ</button>
      <div class="controls-hint">
        <span class="key"><kbd>ПРОБЕЛ</kbd> прыжок</span>
        <span class="key"><kbd>↑</kbd> прыжок</span>
        <span class="key"><kbd>ТАП</kbd> прыжок</span>
      </div>
    </div>
    
    <!-- Экран Game Over -->
    <div class="overlay hidden" id="gameOverScreen">
      <h1 class="title" style="color: var(--accent); text-shadow: 3px 3px 0 #1a0b2e, 6px 6px 0 rgba(0,0,0,0.4);">ИГРА ОКОНЧЕНА</h1>
      <div class="game-over-stats">
        <div class="stat-line">ОЧКИ:<span class="val" id="finalScore">0</span></div>
        <div class="stat-line">РЕКОРД:<span class="val" id="finalHighScore">0</span></div>
        <div class="new-record" id="newRecord" style="display:none;">★ НОВЫЙ РЕКОРД! ★</div>
      </div>
      <button class="btn accent" id="restartBtn">ИГРАТЬ СНОВА</button>
    </div>
  </div>
  
  <!-- Мобильное управление -->
  <div class="mobile-controls">
    <button class="mobile-btn" id="jumpBtn">ПРЫЖОК</button>
  </div>
</div>

<script>
(() => {
  // ============ Конфигурация ============
  const CFG = {
    gravity: 0.65,
    jumpPower: -13.5,
    initialSpeed: 6,
    speedIncrement: 0.0015,
    maxSpeed: 15,
    groundOffset: 0.82, // % от высоты canvas
    spawnMinFrames: 50,
    spawnMaxFrames: 110,
    invulnFrames: 90,
  };
  
  // ============ Состояние ============
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const container = document.getElementById('canvasContainer');
  
  let W = 800, H = 300;
  let dpr = Math.min(window.devicePixelRatio || 1, 2);
  
  let gameState = 'start';
  let score = 0;
  let highScore = parseInt(localStorage.getItem('dinoHighScore') || '0');
  let lives = 3;
  let speed = CFG.initialSpeed;
  let obstacles = [];
  let clouds = [];
  let mountains = [];
  let particles = [];
  let stars = [];
  let frameCount = 0;
  let nextSpawn = 80;
  let invulnerable = 0;
  let groundScroll = 0;
  let mountainScroll = 0;
  let cloudScroll = 0;
  let lastTime = 0;
  let runFrame = 0;
  
  const dino = {
    x: 80,
    y: 0,
    vy: 0,
    width: 44,
    height: 48,
    jumping: false,
    ducking: false,
  };
  
  // ============ Инициализация размеров ============
  function resize() {
    const rect = container.getBoundingClientRect();
    W = rect.width;
    H = Math.min(Math.max(W * 0.42, 240), 380);
    
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.scale(dpr, dpr);
    ctx.imageSmoothingEnabled = false;
    
    // Позиция динозаврика по Y
    dino.y = getGroundY() - dino.height;
  }
  
  function getGroundY() {
    return H * CFG.groundOffset;
  }
  
  // ============ Фоновые элементы ============
  function initBackground() {
    clouds = [];
    for (let i = 0; i < 5; i++) {
      clouds.push({
        x: Math.random() * W,
        y: 30 + Math.random() * (H * 0.35),
        size: 0.7 + Math.random() * 0.6,
        speed: 0.3 + Math.random() * 0.4,
      });
    }
    
    mountains = [];
    let mx = 0;
    while (mx < W * 1.5) {
      const mw = 120 + Math.random() * 100;
      mountains.push({
        x: mx,
        width: mw,
        height: 60 + Math.random() * 50,
      });
      mx += mw * 0.6;
    }
    
    stars = [];
    for (let i = 0; i < 15; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H * 0.4,
        size: 1 + Math.random() * 2,
        twinkle: Math.random() * Math.PI * 2,
      });
    }
  }
  
  // ============ Препятствия ============
  function spawnObstacle() {
    const type = Math.random();
    const groundY = getGroundY();
    let obs;
    
    if (type < 0.45) {
      // Маленький кактус
      obs = { x: W + 20, y: groundY - 32, width: 18, height: 32, type: 'cactus_s' };
    } else if (type < 0.75) {
      // Большой кактус
      obs = { x: W + 20, y: groundY - 48, width: 24, height: 48, type: 'cactus_l' };
    } else if (type < 0.9) {
      // Двойной кактус
      obs = { x: W + 20, y: groundY - 38, width: 38, height: 38, type: 'cactus_d' };
    } else {
      // Тройной маленький
      obs = { x: W + 20, y: groundY - 30, width: 50, height: 30, type: 'cactus_t' };
    }
    
    obstacles.push(obs);
    
    // Следующий спавн зависит от скорости
    const minGap = Math.max(40, CFG.spawnMinFrames - speed * 2);
    const maxGap = Math.max(70, CFG.spawnMaxFrames - speed * 3);
    nextSpawn = frameCount + minGap + Math.random() * (maxGap - minGap);
  }
  
  // ============ Частицы ============
  function spawnDust(x, y) {
    for (let i = 0; i < 2; i++) {
      particles.push({
        x: x + (Math.random() - 0.5) * 10,
        y: y + Math.random() * 4,
        vx: -speed * 0.3 - Math.random() * 1.5,
        vy: -Math.random() * 1.5,
        life: 30,
        maxLife: 30,
        size: 2 + Math.random() * 3,
        type: 'dust',
      });
    }
  }
  
  function spawnJumpParticles(x, y) {
    for (let i = 0; i < 8; i++) {
      const angle = Math.PI + (Math.random() - 0.5) * Math.PI;
      const v = 2 + Math.random() * 3;
      particles.push({
        x: x,
        y: y,
        vx: Math.cos(angle) * v,
        vy: Math.sin(angle) * v - 1,
        life: 25,
        maxLife: 25,
        size: 3 + Math.random() * 3,
        type: 'jump',
      });
    }
  }
  
  function spawnHitParticles(x, y) {
    for (let i = 0; i < 20; i++) {
      const angle = Math.random() * Math.PI * 2;
      const v = 3 + Math.random() * 5;
      particles.push({
        x: x,
        y: y,
        vx: Math.cos(angle) * v,
        vy: Math.sin(angle) * v,
        life: 40,
        maxLife: 40,
        size: 3 + Math.random() * 4,
        type: 'hit',
      });
    }
  }
  
  // ============ Отрисовка ============
  function drawSky() {
    // Градиент заката
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#ff3e7f');
    grad.addColorStop(0.4, '#ff6b9d');
    grad.addColorStop(0.7, '#ffa07a');
    grad.addColorStop(1, '#ffd93d');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
    
    // Звёзды
    stars.forEach(s => {
      const a = (Math.sin(frameCount * 0.05 + s.twinkle) + 1) * 0.5;
      ctx.fillStyle = `rgba(255, 245, 225, ${a * 0.6})`;
      ctx.fillRect(s.x, s.y, s.size, s.size);
    });
    
    // Солнце
    const sunX = W * 0.78;
    const sunY = H * 0.35;
    const sunR = 32;
    
    // Свечение
    const sunGrad = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, sunR * 2.5);
    sunGrad.addColorStop(0, 'rgba(255, 235, 100, 0.6)');
    sunGrad.addColorStop(0.5, 'rgba(255, 150, 100, 0.2)');
    sunGrad.addColorStop(1, 'rgba(255, 100, 100, 0)');
    ctx.fillStyle = sunGrad;
    ctx.fillRect(sunX - sunR * 2.5, sunY - sunR * 2.5, sunR * 5, sunR * 5);
    
    // Диск солнца
    ctx.fillStyle = '#ffeb3b';
    ctx.beginPath();
    ctx.arc(sunX, sunY, sunR, 0, Math.PI * 2);
    ctx.fill();
    
    // Полоски на солнце (ретро стиль)
    ctx.fillStyle = 'rgba(255, 62, 127, 0.5)';
    for (let i = 0; i < 3; i++) {
      const y = sunY + 8 + i * 7;
      const w = Math.sqrt(Math.max(0, sunR * sunR - (y - sunY) * (y - sunY))) * 2;
      ctx.fillRect(sunX - w/2, y, w, 2);
    }
  }
  
  function drawMountains() {
    const groundY = getGroundY();
    mountains.forEach(m => {
      const x = m.x - mountainScroll;
      const wrapped = ((x % (W * 1.5)) + W * 1.5) % (W * 1.5) - 100;
      
      ctx.fillStyle = '#4a2c5e';
      ctx.beginPath();
      ctx.moveTo(wrapped, groundY);
      ctx.lineTo(wrapped + m.width / 2, groundY - m.height);
      ctx.lineTo(wrapped + m.width, groundY);
      ctx.closePath();
      ctx.fill();
      
      // Снежная шапка
      ctx.fillStyle = '#ffd93d';
      ctx.beginPath();
      ctx.moveTo(wrapped + m.width / 2 - 12, groundY - m.height + 18);
      ctx.lineTo(wrapped + m.width / 2, groundY - m.height);
      ctx.lineTo(wrapped + m.width / 2 + 12, groundY - m.height + 18);
      ctx.lineTo(wrapped + m.width / 2 + 6, groundY - m.height + 22);
      ctx.lineTo(wrapped + m.width / 2, groundY - m.height + 16);
      ctx.lineTo(wrapped + m.width / 2 - 6, groundY - m.height + 22);
      ctx.closePath();
      ctx.fill();
    });
  }
  
  function drawClouds() {
    clouds.forEach(c => {
      const x = ((c.x - cloudScroll * c.speed) % (W + 100) + W + 100) % (W + 100) - 50;
      const y = c.y;
      const s = c.size;
      
      ctx.fillStyle = 'rgba(255, 245, 225, 0.85)';
      ctx.beginPath();
      ctx.arc(x, y, 12 * s, 0, Math.PI * 2);
      ctx.arc(x + 14 * s, y - 4 * s, 14 * s, 0, Math.PI * 2);
      ctx.arc(x + 28 * s, y, 11 * s, 0, Math.PI * 2);
      ctx.arc(x + 14 * s, y + 4 * s, 10 * s, 0, Math.PI * 2);
      ctx.fill();
    });
  }
  
  function drawGround() {
    const groundY = getGroundY();
    
    // Земля
    const grad = ctx.createLinearGradient(0, groundY, 0, H);
    grad.addColorStop(0, '#8b5a2b');
    grad.addColorStop(0.3, '#5d3a1a');
    grad.addColorStop(1, '#3d2817');
    ctx.fillStyle = grad;
    ctx.fillRect(0, groundY, W, H - groundY);
    
    // Верхняя линия земли
    ctx.fillStyle = '#d4a574';
    ctx.fillRect(0, groundY, W, 2);
    ctx.fillStyle = '#a87444';
    ctx.fillRect(0, groundY + 2, W, 1);
    
    // Текстура/камни на земле (со скроллом)
    ctx.fillStyle = 'rgba(61, 40, 23, 0.6)';
    const tileSize = 24;
    const offset = groundScroll % tileSize;
    for (let x = -offset; x < W; x += tileSize) {
      ctx.fillRect(x + 4, groundY + 8, 3, 2);
      ctx.fillRect(x + 14, groundY + 16, 2, 2);
      ctx.fillRect(x + 8, groundY + 24, 4, 2);
      ctx.fillRect(x + 20, groundY + 32, 2, 3);
    }
  }
  
  function drawDino() {
    const blink = invulnerable > 0 && Math.floor(frameCount / 4) % 2 === 0;
    if (blink) return;
    
    const x = dino.x;
    const y = dino.y;
    const groundY = getGroundY();
    
    // Тень
    if (dino.jumping) {
      const shadowY = groundY - 2;
      const dist = (shadowY - (y + dino.height)) / 100;
      const shadowScale = Math.max(0.3, 1 - dist * 0.5);
      ctx.fillStyle = `rgba(0, 0, 0, ${0.3 * shadowScale})`;
      ctx.beginPath();
      ctx.ellipse(x + dino.width/2, shadowY, dino.width/2 * shadowScale, 4 * shadowScale, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    
    // Тело динозавра (пиксельная графика)
    ctx.fillStyle = '#2d5016';
    
    // Используем сетку 11x12 (по 4px на клетку)
    const p = 4; // размер пикселя
    const ox = x;
    const oy = y;
    
    // Пиксельная карта динозаврика (1 = тело, 0 = пусто, 2 = глаз, 3 = светлее)
    // Стоя/бег (ноги меняются)
    const bodyMap = [
      "...........",
      "...........",
      ".....11111.",
      "....1111111",
      "....1112211",  // глаз
      "....1111111",
      "....1111111",
      ".1111111111",
      "11111111111",
      "11111113333",  // светлая часть живота/хвоста
      "11111111333",
      ".11..11....",  // ноги (кадр 1)
    ];
    
    const legsFrame2 = [
      "...........",
      "...........",
      ".....11111.",
      "....1111111",
      "....1112211",
      "....1111111",
      "....1111111",
      ".1111111111",
      "11111111111",
      "11111113333",
      "11111111333",
      "..1...11...",  // ноги (кадр 2)
    ];
    
    let map = bodyMap;
    if (!dino.jumping && Math.floor(frameCount / 6) % 2 === 0) {
      map = legsFrame2;
    } else if (dino.jumping) {
      // В прыжке ноги поджаты
      map = [
        "...........",
        "...........",
        ".....11111.",
        "....1111111",
        "....1112211",
        "....1111111",
        "....1111111",
        ".1111111111",
        "11111111111",
        "11111113333",
        "11111111133",
        ".1111..11..",
      ];
    }
    
    for (let row = 0; row < map.length; row++) {
      for (let col = 0; col < map[row].length; col++) {
        const cell = map[row][col];
        if (cell === '1') {
          ctx.fillStyle = '#2d5016';
          ctx.fillRect(ox + col * p, oy + row * p, p, p);
        } else if (cell === '2') {
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(ox + col * p, oy + row * p, p, p);
        } else if (cell === '3') {
          ctx.fillStyle = '#4a8c2a';
          ctx.fillRect(ox + col * p, oy + row * p, p, p);
        }
      }
    }
    
    // Зрачок
    ctx.fillStyle = '#000';
    ctx.fillRect(ox + 7 * p, oy + 4 * p, p, p);
  }
  
  function drawObstacle(obs) {
    const x = obs.x;
    const y = obs.y;
    
    if (obs.type === 'cactus_s') {
      drawCactus(x, y, 18, 32);
    } else if (obs.type === 'cactus_l') {
      drawCactus(x, y, 24, 48);
    } else if (obs.type === 'cactus_d') {
      drawCactus(x, y, 16, 38);
      drawCactus(x + 22, y + 6, 16, 32);
    } else if (obs.type === 'cactus_t') {
      drawCactus(x, y + 4, 14, 26);
      drawCactus(x + 18, y, 14, 30);
      drawCactus(x + 36, y + 6, 14, 24);
    }
  }
  
  function drawCactus(x, y, w, h) {
    // Основной ствол
    ctx.fillStyle = '#1b5e20';
    ctx.fillRect(x + w * 0.3, y, w * 0.4, h);
    
    // Левая ветка
    ctx.fillRect(x, y + h * 0.3, w * 0.3, h * 0.15);
    ctx.fillRect(x, y + h * 0.15, w * 0.15, h * 0.3);
    
    // Правая ветка
    ctx.fillRect(x + w * 0.7, y + h * 0.45, w * 0.3, h * 0.15);
    ctx.fillRect(x + w * 0.85, y + h * 0.3, w * 0.15, h * 0.3);
    
    // Тёмные полоски
    ctx.fillStyle = '#0d3d11';
    ctx.fillRect(x + w * 0.4, y + 2, 2, h - 4);
    ctx.fillRect(x + w * 0.5, y + 4, 2, h - 8);
    
    // Светлые блики
    ctx.fillStyle = '#4caf50';
    ctx.fillRect(x + w * 0.35, y + 2, 2, h - 4);
    
    // Колючки (пиксели)
    ctx.fillStyle = '#0d3d11';
    for (let i = 4; i < h - 4; i += 6) {
      ctx.fillRect(x + w * 0.3 - 1, y + i, 1, 1);
      ctx.fillRect(x + w * 0.7, y + i, 1, 1);
    }
  }
  
  function drawParticles() {
    particles.forEach(p => {
      const alpha = p.life / p.maxLife;
      if (p.type === 'dust') {
        ctx.fillStyle = `rgba(180, 130, 80, ${alpha * 0.6})`;
      } else if (p.type === 'jump') {
        ctx.fillStyle = `rgba(255, 245, 225, ${alpha * 0.8})`;
      } else if (p.type === 'hit') {
        const hue = (frameCount * 10) % 360;
        ctx.fillStyle = `hsla(${hue}, 90%, 60%, ${alpha})`;
      }
      ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
    });
  }
  
  // ============ Обновление ============
  function update(dt) {
    if (gameState !== 'playing') return;
    
    frameCount++;
    
    // Увеличение скорости
    speed = Math.min(CFG.maxSpeed, CFG.initialSpeed + frameCount * CFG.speedIncrement);
    
    // Очки (растут со временем)
    if (frameCount % 6 === 0) {
      score++;
      updateScore();
    }
    
    // Физика динозавра
    if (dino.jumping) {
      dino.vy += CFG.gravity;
      dino.y += dino.vy;
      if (dino.y >= getGroundY() - dino.height) {
        dino.y = getGroundY() - dino.height;
        dino.vy = 0;
        dino.jumping = false;
        spawnDust(dino.x + dino.width/2, getGroundY());
      }
    }
    
    // Пыль при беге
    if (!dino.jumping && frameCount % 5 === 0) {
      spawnDust(dino.x, getGroundY());
    }
    
    // Спавн препятствий
    if (frameCount >= nextSpawn) {
      spawnObstacle();
    }
    
    // Движение препятствий
    obstacles.forEach(o => o.x -= speed);
    obstacles = obstacles.filter(o => o.x + o.width > -20);
    
    // Скролл фона
    groundScroll += speed;
    mountainScroll += speed * 0.2;
    cloudScroll += speed * 0.5;
    
    // Частицы
    particles.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      if (p.type === 'dust' || p.type === 'jump') {
        p.vy += 0.2;
      } else if (p.type === 'hit') {
        p.vy += 0.3;
        p.vx *= 0.96;
      }
      p.life--;
    });
    particles = particles.filter(p => p.life > 0);
    
    // Неуязвимость
    if (invulnerable > 0) invulnerable--;
    
    // Проверка столкновений
    if (invulnerable <= 0) {
      checkCollisions();
    }
  }
  
  function checkCollisions() {
    const dinoBox = {
      x: dino.x + 6,
      y: dino.y + 4,
      width: dino.width - 12,
      height: dino.height - 8,
    };
    
    for (const o of obstacles) {
      // Хитбокс кактуса чуть меньше визуала
      const oBox = {
        x: o.x + 3,
        y: o.y + 3,
        width: o.width - 6,
        height: o.height - 3,
      };
      
      if (
        dinoBox.x < oBox.x + oBox.width &&
        dinoBox.x + dinoBox.width > oBox.x &&
        dinoBox.y < oBox.y + oBox.height &&
        dinoBox.y + dinoBox.height > oBox.y
      ) {
        onHit(o);
        return;
      }
    }
  }
  
  function onHit(o) {
    lives--;
    invulnerable = CFG.invulnFrames;
    spawnHitParticles(dino.x + dino.width/2, dino.y + dino.height/2);
    
    // Удаляем препятствие
    obstacles = obstacles.filter(x => x !== o);
    
    // Тряска
    container.classList.remove('shake');
    void container.offsetWidth;
    container.classList.add('shake');
    
    updateHearts(true);
    
    if (lives <= 0) {
      gameOver();
    }
  }
  
  // ============ Действия ============
  function jump() {
    if (gameState !== 'playing') return;
    if (!dino.jumping) {
      dino.vy = CFG.jumpPower;
      dino.jumping = true;
      spawnJumpParticles(dino.x + dino.width/2, getGroundY());
    }
  }
  
  function startGame() {
    gameState = 'playing';
    score = 0;
    lives = 3;
    speed = CFG.initialSpeed;
    obstacles = [];
    particles = [];
    frameCount = 0;
    nextSpawn = 80;
    invulnerable = 0;
    dino.y = getGroundY() - dino.height;
    dino.vy = 0;
    dino.jumping = false;
    
    document.getElementById('startScreen').classList.add('hidden');
    document.getElementById('gameOverScreen').classList.add('hidden');
    
    updateScore();
    updateHearts();
  }
  
  function gameOver() {
    gameState = 'gameover';
    
    const isNewRecord = score > highScore;
    if (isNewRecord) {
      highScore = score;
      localStorage.setItem('dinoHighScore', highScore);
    }
    
    document.getElementById('finalScore').textContent = score;
    document.getElementById('finalHighScore').textContent = highScore;
    document.getElementById('newRecord').style.display = isNewRecord ? 'block' : 'none';
    document.getElementById('highScoreEl').textContent = highScore;
    
    setTimeout(() => {
      document.getElementById('gameOverScreen').classList.remove('hidden');
    }, 600);
  }
  
  function updateScore() {
    document.getElementById('scoreEl').textContent = score;
  }
  
  function updateHearts(pulse = false) {
    const heartsEl = document.getElementById('heartsEl');
    heartsEl.innerHTML = '';
    for (let i = 0; i < 3; i++) {
      const h = document.createElement('div');
      h.className = 'heart' + (i >= lives ? ' lost' : '');
      if (pulse && i === lives) h.classList.add('pulse');
      h.innerHTML = `<svg viewBox="0 0 24 24" fill="#ff3e7f"><path d="M12 21s-7-4.5-9.5-9C0.5 8 2 4 6 4c2 0 3.5 1 4 2 0.5-1 2-2 4-2 4 0 5.5 4 3.5 8-2.5 4.5-9.5 9-9.5 9z"/></svg>`;
      heartsEl.appendChild(h);
    }
  }
  
  // ============ Главный цикл ============
  function loop(time) {
    const dt = Math.min(32, time - lastTime);
    lastTime = time;
    
    update(dt);
    
    // Отрисовка
    ctx.clearRect(0, 0, W, H);
    drawSky();
    drawClouds();
    drawMountains();
    drawGround();
    drawParticles();
    obstacles.forEach(drawObstacle);
    drawDino();
    
    requestAnimationFrame(loop);
  }
  
  // ============ Управление ============
  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
      e.preventDefault();
      if (gameState === 'start' || gameState === 'gameover') {
        startGame();
      } else {
        jump();
      }
    }
  });
  
  // Тап / клик по canvas
  canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    if (gameState === 'playing') {
      jump();
    }
  });
  
  container.addEventListener('pointerdown', (e) => {
    if (gameState === 'playing') {
      e.preventDefault();
      jump();
    }
  });
  
  document.getElementById('startBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    startGame();
  });
  
  document.getElementById('restartBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    startGame();
  });
  
  document.getElementById('jumpBtn').addEventListener('touchstart', (e) => {
    e.preventDefault();
    if (gameState === 'playing') jump();
  }, { passive: false });
  
  document.getElementById('jumpBtn').addEventListener('click', (e) => {
    e.preventDefault();
    if (gameState === 'playing') jump();
  });
  
  // Resize
  window.addEventListener('resize', () => {
    resize();
    initBackground();
  });
  
  // Предотвращаем скролл на мобильных
  document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
  
  // ============ Старт ============
  resize();
  initBackground();
  document.getElementById('highScoreEl').textContent = highScore;
  updateHearts();
  updateScore();
  requestAnimationFrame(loop);
})();
</script>

</body>
</html>
