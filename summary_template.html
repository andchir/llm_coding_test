<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Сводка результатов LLM</title>
  <style>
    :root { color-scheme: light; font-family: Inter, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f4f6fa; color: #172033; }
    main { width: min(100% - 32px, 1000px); margin: 48px auto; }
    h1 { margin: 0 0 24px; font-size: clamp(28px, 5vw, 44px); }
    .card { background: white; border: 1px solid #dde3ed; border-radius: 16px;
            box-shadow: 0 10px 30px rgba(23, 32, 51, .06); overflow: hidden; }
    .prompt { padding: 24px; border-bottom: 1px solid #e7ebf2; }
    .label { margin: 0 0 8px; color: #68738a; font-size: 13px; font-weight: 700;
             letter-spacing: .08em; }
    .label.label-uppercase { text-transform: uppercase; }
    .prompt-text { margin: 0; line-height: 1.6; white-space: pre-wrap; }
    .stats { display: flex; gap: 32px; padding: 20px 24px; background: #f9fafc; }
    .stat strong { display: block; font-size: 22px; }
    .stat span { color: #68738a; font-size: 13px; }
    .table-wrap { overflow-x: auto; }
    .table-toolbar { display: flex; align-items: center; justify-content: flex-end;
                     gap: 10px; padding: 16px 24px; }
    .table-toolbar label { color: #68738a; font-size: 13px; font-weight: 700; }
    .table-toolbar select { min-height: 38px; padding: 7px 34px 7px 11px;
                            border: 1px solid #cfd6e3; border-radius: 9px;
                            background: white; color: #172033; font: inherit; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 16px 24px; border-top: 1px solid #e7ebf2; text-align: left; }
    th { color: #68738a; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; }
    a { color: #3157d5; font-weight: 650; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .empty { color: #68738a; text-align: center; }
    @media (max-width: 600px) {
      main { width: min(100% - 20px, 1000px); margin: 20px auto; }
      .stats { gap: 20px; flex-wrap: wrap; }
      th, td { padding: 14px 16px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Сводка результатов LLM</h1>
    <section class="card">
      <div class="prompt">
        <p class="label"><a href="https://github.com/andchir/llm_coding_test">https://github.com/andchir/llm_coding_test</a></p>
        <p class="label label-uppercase">Prompt</p>
        <p class="prompt-text">$prompt</p>
      </div>
      <div class="stats">
        <div class="stat"><strong>$model_count</strong><span>моделей</span></div>
        <div class="stat"><strong>$total_tokens</strong><span>исходящих токенов</span></div>
        <div class="stat"><strong>$total_price $currency</strong><span>общая цена</span></div>
      </div>
      <div class="table-toolbar">
        <label for="result-sort">Сортировка</label>
        <select id="result-sort">
          <option value="price">По цене: сначала дорогие</option>
          <option value="model">По названию модели</option>
        </select>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Модель</th><th>Исходящие токены</th><th>Цена</th><th>Валюта</th></tr></thead>
          <tbody>$rows</tbody>
        </table>
      </div>
    </section>
  </main>
  <script>
    (() => {
      const select = document.querySelector('#result-sort');
      const body = document.querySelector('tbody');
      if (!select || !body) return;

      const compareModels = (left, right) =>
        left.dataset.model.localeCompare(right.dataset.model, 'ru', {
          sensitivity: 'base',
          numeric: true
        });

      select.addEventListener('change', () => {
        const rows = Array.from(body.querySelectorAll('tr[data-model]'));
        rows.sort((left, right) => {
          if (select.value === 'model') return compareModels(left, right);
          return Number(right.dataset.price) - Number(left.dataset.price)
            || compareModels(left, right);
        });
        body.append(...rows);
      });
    })();
  </script>
</body>
</html>
