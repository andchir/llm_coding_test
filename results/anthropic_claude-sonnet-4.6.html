<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Тетрис - Anthropic Claude Sonnet 4.6</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
        }

        .game-container {
            display: flex;
            gap: 25px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.5),
                        0 0 0 1px rgba(255, 255, 255, 0.1);
            max-width: 900px;
            width: 100%;
        }

        .left-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #fff;
            font-size: 2em;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
            letter-spacing: 2px;
        }

        .game-board {
            position: relative;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5),
                        0 0 0 2px rgba(255, 255, 255, 0.1);
        }

        canvas#main {
            display: block;
            background: #0a0a0a;
        }

        .right-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
            min-width: 180px;
        }

        .info-card {
            background: linear-gradient(145deg, rgba(255,255,255,0.1), rgba(255,255,255,0.05));
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
        }

        .info-card h3 {
            color: #00d4ff;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .info-card .value {
            color: #fff;
            font-size: 2em;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        .next-piece-container {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 10px;
            padding: 15px;
            margin-top: 10px;
        }

        canvas#next {
            display: block;
            margin: 0 auto;
        }

        .controls-section {
            margin-top: auto;
        }

        .btn {
            width: 100%;
            padding: 15px 20px;
            margin-bottom: 10px;
            border: none;
            border-radius: 10px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #00d4ff, #0080ff);
            color: #fff;
            box-shadow: 0 5px 20px rgba(0, 212, 255, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0, 212, 255, 0.6);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .controls-info {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.85em;
            margin-top: 15px;
            line-height: 1.8;
        }

        .controls-info span {
            display: inline-block;
            background: rgba(255, 255, 255, 0.1);
            padding: 2px 8px;
            border-radius: 4px;
            margin: 0 2px;
            font-family: monospace;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            z-index: 10;
            backdrop-filter: blur(5px);
        }

        .overlay h2 {
            font-size: 2.5em;
            margin-bottom: 20px;
            text-shadow: 0 0 30px rgba(0, 212, 255, 0.8);
        }

        .overlay p {
            font-size: 1.3em;
            margin-bottom: 10px;
            color: rgba(255, 255, 255, 0.8);
        }

        .overlay .final-score {
            font-size: 3em;
            color: #00d4ff;
            font-weight: bold;
            margin: 20px 0;
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
        }

        .hidden {
            display: none !important;
        }

        /* Mobile Controls */
        .mobile-controls {
            display: none;
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            gap: 10px;
            z-index: 100;
        }

        .mobile-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: none;
            background: rgba(0, 212, 255, 0.3);
            backdrop-filter: blur(10px);
            color: #fff;
            font-size: 1.5em;
            cursor: pointer;
            transition: all 0.2s;
            border: 2px solid rgba(0, 212, 255, 0.5);
        }

        .mobile-btn:active {
            background: rgba(0, 212, 255, 0.6);
            transform: scale(0.95);
        }

        .mobile-btn.rotate {
            background: rgba(255, 107, 0, 0.3);
            border-color: rgba(255, 107, 0, 0.5);
        }

        .mobile-btn.drop {
            background: rgba(0, 255, 128, 0.3);
            border-color: rgba(0, 255, 128, 0.5);
        }

        /* Responsive */
        @media (max-width: 768px) {
            body {
                padding: 10px;
                align-items: flex-start;
                padding-top: 20px;
            }

            .game-container {
                flex-direction: column;
                padding: 20px;
                gap: 15px;
            }

            h1 {
                font-size: 1.5em;
                margin-bottom: 15px;
            }

            canvas#main {
                width: 280px;
                height: 560px;
            }

            .right-panel {
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: center;
                min-width: auto;
            }

            .info-card {
                flex: 1;
                min-width: 100px;
                padding: 15px;
            }

            .info-card .value {
                font-size: 1.5em;
            }

            .next-piece-container {
                display: none;
            }

            .controls-section {
                width: 100%;
                display: flex;
                gap: 10px;
            }

            .btn {
                flex: 1;
                margin-bottom: 0;
                padding: 12px;
                font-size: 0.9em;
            }

            .controls-info {
                display: none;
            }

            .mobile-controls {
                display: flex;
            }
        }

        @media (max-width: 400px) {
            canvas#main {
                width: 250px;
                height: 500px;
            }
        }

        /* Animations */
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .pulse {
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .overlay {
            animation: slideIn 0.3s ease-out;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="left-panel">
            <h1>🎮 ТЕТРИС</h1>
            <div class="game-board">
                <canvas id="main" width="300" height="600"></canvas>
                <div class="overlay hidden" id="gameOverlay">
                    <h2 id="overlayTitle">ПАУЗА</h2>
                    <p id="overlayScoreLabel">Счёт:</p>
                    <div class="final-score" id="overlayScore">0</div>
                    <button class="btn btn-primary" id="overlayBtn">Продолжить</button>
                </div>
            </div>
        </div>

        <div class="right-panel">
            <div class="info-card">
                <h3>Счёт</h3>
                <div class="value" id="score">0</div>
            </div>

            <div class="info-card">
                <h3>Уровень</h3>
                <div class="value" id="level">1</div>
            </div>

            <div class="info-card">
                <h3>Линии</h3>
                <div class="value" id="lines">0</div>
            </div>

            <div class="info-card">
                <h3>Следующая</h3>
                <div class="next-piece-container">
                    <canvas id="next" width="100" height="80"></canvas>
                </div>
            </div>

            <div class="controls-section">
                <button class="btn btn-primary" id="startBtn">Старт</button>
                <button class="btn btn-secondary hidden" id="pauseBtn">Пауза</button>
                <div class="controls-info">
                    <span>←</span> <span>→</span> движение<br>
                    <span>↑</span> поворот<br>
                    <span>↓</span> ускорение<br>
                    <span>Пробел</span> сброс
                </div>
            </div>
        </div>
    </div>

    <div class="mobile-controls">
        <button class="mobile-btn" id="btnLeft">←</button>
        <button class="mobile-btn rotate" id="btnRotate">↻</button>
        <button class="mobile-btn" id="btnRight">→</button>
        <button class="mobile-btn drop" id="btnDrop">⤓</button>
    </div>

    <script>
        const canvas = document.getElementById('main');
        const ctx = canvas.getContext('2d');
        const nextCanvas = document.getElementById('next');
        const nextCtx = nextCanvas.getContext('2d');

        // Game constants
        const COLS = 10;
        const ROWS = 20;
        const BLOCK_SIZE = 30;
        const PREVIEW_BLOCK_SIZE = 20;

        // Tetromino shapes with their rotation states
        const SHAPES = {
            I: {
                color: '#00f0f0',
                shape: [[1, 1, 1, 1]]
            },
            O: {
                color: '#f0f000',
                shape: [[1, 1], [1, 1]]
            },
            T: {
                color: '#a000f0',
                shape: [[0, 1, 0], [1, 1, 1]]
            },
            L: {
                color: '#f0a000',
                shape: [[0, 0, 1], [1, 1, 1]]
            },
            J: {
                color: '#0000f0',
                shape: [[1, 0, 0], [1, 1, 1]]
            },
            S: {
                color: '#00f000',
                shape: [[0, 1, 1], [1, 1, 0]]
            },
            Z: {
                color: '#f00000',
                shape: [[1, 1, 0], [0, 1, 1]]
            }
        };

        // Game state
        let board = [];
        let currentPiece = null;
        let nextPiece = null;
        let score = 0;
        let lines = 0;
        let level = 1;
        let gameRunning = false;
        let gamePaused = false;
        let dropCounter = 0;
        let lastTime = 0;
        let animationId = null;
        let combo = 0;

        // Line clear scores
        const LINE_SCORES = [0, 100, 300, 500, 800];

        class Piece {
            constructor(type) {
                this.type = type;
                this.shape = SHAPES[type].shape;
                this.color = SHAPES[type].color;
                this.x = Math.floor((COLS - this.shape[0].length) / 2);
                this.y = 0;
            }

            rotate() {
                const rotated = this.shape[0].map((_, i) =>
                    this.shape.map(row => row[i]).reverse()
                );
                const oldShape = this.shape;
                this.shape = rotated;

                // Wall kick - try to adjust position if rotation causes collision
                if (this.collides()) {
                    const kicks = [-1, 1, -2, 2];
                    for (const kick of kicks) {
                        this.x += kick;
                        if (!this.collides()) return;
                        this.x -= kick;
                    }
                    this.shape = oldShape;
                }
            }

            move(dx, dy) {
                this.x += dx;
                this.y += dy;
                if (this.collides()) {
                    this.x -= dx;
                    this.y -= dy;
                    return false;
                }
                return true;
            }

            collides() {
                for (let y = 0; y < this.shape.length; y++) {
                    for (let x = 0; x < this.shape[y].length; x++) {
                        if (this.shape[y][x]) {
                            const newX = this.x + x;
                            const newY = this.y + y;

                            if (newX < 0 || newX >= COLS || newY >= ROWS) {
                                return true;
                            }
                            if (newY >= 0 && board[newY][newX]) {
                                return true;
                            }
                        }
                    }
                }
                return false;
            }

            lock() {
                for (let y = 0; y < this.shape.length; y++) {
                    for (let x = 0; x < this.shape[y].length; x++) {
                        if (this.shape[y][x]) {
                            const boardY = this.y + y;
                            const boardX = this.x + x;
                            if (boardY >= 0) {
                                board[boardY][boardX] = this.color;
                            }
                        }
                    }
                }
            }
        }

        function initBoard() {
            board = Array(ROWS).fill(null).map(() => Array(COLS).fill(0));
        }

        function createPiece() {
            const types = Object.keys(SHAPES);
            const type = types[Math.floor(Math.random() * types.length)];
            return new Piece(type);
        }

        function getDropInterval() {
            return Math.max(50, 1000 - (level - 1) * 80);
        }

        function drawBlock(ctx, x, y, color, size = BLOCK_SIZE) {
            // Main block
            ctx.fillStyle = color;
            ctx.fillRect(x * size, y * size, size, size);

            // 3D effect - highlight
            ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.fillRect(x * size, y * size, size, 3);
            ctx.fillRect(x * size, y * size, 3, size);

            // 3D effect - shadow
            ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.fillRect(x * size + size - 3, y * size, 3, size);
            ctx.fillRect(x * size, y * size + size - 3, size, 3);

            // Border
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.5)';
            ctx.lineWidth = 1;
            ctx.strokeRect(x * size, y * size, size, size);
        }

        function drawBoard() {
            // Clear canvas
            ctx.fillStyle = '#0a0a0a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw grid lines (subtle)
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
            ctx.lineWidth = 1;
            for (let x = 0; x <= COLS; x++) {
                ctx.beginPath();
                ctx.moveTo(x * BLOCK_SIZE, 0);
                ctx.lineTo(x * BLOCK_SIZE, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y <= ROWS; y++) {
                ctx.beginPath();
                ctx.moveTo(0, y * BLOCK_SIZE);
                ctx.lineTo(canvas.width, y * BLOCK_SIZE);
                ctx.stroke();
            }

            // Draw locked pieces
            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    if (board[y][x]) {
                        drawBlock(ctx, x, y, board[y][x]);
                    }
                }
            }
        }

        function drawPiece(piece, ghost = false) {
            const color = ghost ? piece.color + '40' : piece.color;

            for (let y = 0; y < piece.shape.length; y++) {
                for (let x = 0; x < piece.shape[y].length; x++) {
                    if (piece.shape[y][x]) {
                        if (ghost) {
                            ctx.strokeStyle = piece.color;
                            ctx.lineWidth = 2;
                            ctx.strokeRect(
                                (piece.x + x) * BLOCK_SIZE + 2,
                                (piece.y + y) * BLOCK_SIZE + 2,
                                BLOCK_SIZE - 4,
                                BLOCK_SIZE - 4
                            );
                        } else {
                            drawBlock(ctx, piece.x + x, piece.y + y, color);
                        }
                    }
                }
            }
        }

        function drawGhost() {
            if (!currentPiece) return;

            const ghost = new Piece(currentPiece.type);
            ghost.shape = currentPiece.shape;
            ghost.x = currentPiece.x;
            ghost.y = currentPiece.y;
            ghost.color = currentPiece.color;

            while (ghost.move(0, 1)) {}
            drawPiece(ghost, true);
        }

        function drawNextPiece() {
            nextCtx.fillStyle = '#0a0a0a';
            nextCtx.fillRect(0, 0, nextCanvas.width, nextCanvas.height);

            if (!nextPiece) return;

            const offsetX = Math.floor((5 - nextPiece.shape[0].length) / 2);
            const offsetY = Math.floor((4 - nextPiece.shape.length) / 2);

            for (let y = 0; y < nextPiece.shape.length; y++) {
                for (let x = 0; x < nextPiece.shape[y].length; x++) {
                    if (nextPiece.shape[y][x]) {
                        drawBlock(nextCtx, offsetX + x, offsetY + y, nextPiece.color, PREVIEW_BLOCK_SIZE);
                    }
                }
            }
        }

        function clearLines() {
            let linesCleared = 0;

            for (let y = ROWS - 1; y >= 0; y--) {
                if (board[y].every(cell => cell !== 0)) {
                    board.splice(y, 1);
                    board.unshift(Array(COLS).fill(0));
                    linesCleared++;
                    y++;
                }
            }

            if (linesCleared > 0) {
                combo++;
                const baseScore = LINE_SCORES[linesCleared] * level;
                const comboBonus = combo > 1 ? (combo - 1) * 50 : 0;
                score += baseScore + comboBonus;
                lines += linesCleared;

                // Level up every 10 lines
                const newLevel = Math.floor(lines / 10) + 1;
                if (newLevel > level) {
                    level = newLevel;
                }

                updateUI();
            } else {
                combo = 0;
            }
        }

        function updateUI() {
            document.getElementById('score').textContent = score.toLocaleString();
            document.getElementById('level').textContent = level;
            document.getElementById('lines').textContent = lines;
        }

        function spawnPiece() {
            currentPiece = nextPiece || createPiece();
            nextPiece = createPiece();
            drawNextPiece();

            if (currentPiece.collides()) {
                gameOver();
            }
        }

        function gameOver() {
            gameRunning = false;
            cancelAnimationFrame(animationId);

            document.getElementById('overlayTitle').textContent = 'ИГРА ОКОНЧЕНА';
            document.getElementById('overlayScoreLabel').textContent = 'Финальный счёт:';
            document.getElementById('overlayScore').textContent = score.toLocaleString();
            document.getElementById('overlayBtn').textContent = 'Новая игра';
            document.getElementById('gameOverlay').classList.remove('hidden');

            document.getElementById('startBtn').classList.remove('hidden');
            document.getElementById('pauseBtn').classList.add('hidden');
        }

        function togglePause() {
            if (!gameRunning) return;

            gamePaused = !gamePaused;

            if (gamePaused) {
                cancelAnimationFrame(animationId);
                document.getElementById('overlayTitle').textContent = 'ПАУЗА';
                document.getElementById('overlayScoreLabel').textContent = 'Текущий счёт:';
                document.getElementById('overlayScore').textContent = score.toLocaleString();
                document.getElementById('overlayBtn').textContent = 'Продолжить';
                document.getElementById('gameOverlay').classList.remove('hidden');
                document.getElementById('pauseBtn').textContent = 'Продолжить';
            } else {
                document.getElementById('gameOverlay').classList.add('hidden');
                document.getElementById('pauseBtn').textContent = 'Пауза';
                lastTime = performance.now();
                update(lastTime);
            }
        }

        function hardDrop() {
            if (!gameRunning || gamePaused || !currentPiece) return;

            let dropDistance = 0;
            while (currentPiece.move(0, 1)) {
                dropDistance++;
            }
            score += dropDistance * 2;
            currentPiece.lock();
            clearLines();
            spawnPiece();
            updateUI();
            dropCounter = 0;
        }

        function update(time = 0) {
            if (!gameRunning || gamePaused) return;

            const deltaTime = time - lastTime;
            lastTime = time;
            dropCounter += deltaTime;

            if (dropCounter > getDropInterval()) {
                if (!currentPiece.move(0, 1)) {
                    currentPiece.lock();
                    clearLines();
                    spawnPiece();
                }
                dropCounter = 0;
            }

            drawBoard();
            drawGhost();
            drawPiece(currentPiece);

            animationId = requestAnimationFrame(update);
        }

        function startGame() {
            initBoard();
            score = 0;
            lines = 0;
            level = 1;
            combo = 0;
            gameRunning = true;
            gamePaused = false;
            dropCounter = 0;

            updateUI();
            drawBoard();

            document.getElementById('gameOverlay').classList.add('hidden');
            document.getElementById('startBtn').classList.add('hidden');
            document.getElementById('pauseBtn').classList.remove('hidden');
            document.getElementById('pauseBtn').textContent = 'Пауза';

            nextPiece = createPiece();
            spawnPiece();

            lastTime = performance.now();
            update(lastTime);
        }

        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            if (!gameRunning || gamePaused) {
                if (e.code === 'Space' && !gameRunning && !document.getElementById('gameOverlay').classList.contains('hidden')) {
                    startGame();
                }
                return;
            }

            switch(e.key) {
                case 'ArrowLeft':
                    e.preventDefault();
                    currentPiece.move(-1, 0);
                    break;
                case 'ArrowRight':
                    e.preventDefault();
                    currentPiece.move(1, 0);
                    break;
                case 'ArrowDown':
                    e.preventDefault();
                    if (currentPiece.move(0, 1)) {
                        score += 1;
                        updateUI();
                    }
                    dropCounter = 0;
                    break;
                case 'ArrowUp':
                    e.preventDefault();
                    currentPiece.rotate();
                    break;
                case ' ':
                    e.preventDefault();
                    hardDrop();
                    break;
                case 'p':
                case 'P':
                case 'Escape':
                    e.preventDefault();
                    togglePause();
                    return;
            }

            drawBoard();
            drawGhost();
            drawPiece(currentPiece);
        });

        // Mobile controls
        document.getElementById('btnLeft').addEventListener('click', () => {
            if (gameRunning && !gamePaused && currentPiece) {
                currentPiece.move(-1, 0);
                drawBoard();
                drawGhost();
                drawPiece(currentPiece);
            }
        });

        document.getElementById('btnRight').addEventListener('click', () => {
            if (gameRunning && !gamePaused && currentPiece) {
                currentPiece.move(1, 0);
                drawBoard();
                drawGhost();
                drawPiece(currentPiece);
            }
        });

        document.getElementById('btnRotate').addEventListener('click', () => {
            if (gameRunning && !gamePaused && currentPiece) {
                currentPiece.rotate();
                drawBoard();
                drawGhost();
                drawPiece(currentPiece);
            }
        });

        document.getElementById('btnDrop').addEventListener('click', () => {
            hardDrop();
        });

        // Button event listeners
        document.getElementById('startBtn').addEventListener('click', startGame);
        document.getElementById('pauseBtn').addEventListener('click', togglePause);
        document.getElementById('overlayBtn').addEventListener('click', () => {
            if (gamePaused) {
                togglePause();
            } else {
                startGame();
            }
        });

        // Touch support for mobile
        let touchStartX = 0;
        let touchStartY = 0;

        canvas.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }, { passive: true });

        canvas.addEventListener('touchend', (e) => {
            if (!gameRunning || gamePaused) return;

            const touchEndX = e.changedTouches[0].clientX;
            const touchEndY = e.changedTouches[0].clientY;
            const dx = touchEndX - touchStartX;
            const dy = touchEndY - touchStartY;

            if (Math.abs(dx) > Math.abs(dy)) {
                if (dx > 30) {
                    currentPiece.move(1, 0);
                } else if (dx < -30) {
                    currentPiece.move(-1, 0);
                }
            } else {
                if (dy > 30) {
                    if (currentPiece.move(0, 1)) {
                        score += 1;
                        updateUI();
                    }
                } else if (dy < -30) {
                    currentPiece.rotate();
                }
            }

            drawBoard();
            drawGhost();
            drawPiece(currentPiece);
        }, { passive: true });

        // Double tap to drop
        let lastTap = 0;
        canvas.addEventListener('touchend', (e) => {
            const currentTime = new Date().getTime();
            if (currentTime - lastTap < 300) {
                hardDrop();
            }
            lastTap = currentTime;
        }, { passive: true });

        // Initialize
        initBoard();
        drawBoard();
    </script>
</body>
</html>
