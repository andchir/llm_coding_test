<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Wave Player — Аудиоплеер</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #0a0a14;
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  overflow: hidden;
  position: relative;
}

.bg-orb {
  position: fixed;
  border-radius: 50%;
  filter: blur(80px);
  opacity: 0.4;
  pointer-events: none;
  z-index: 0;
}

.bg-orb.orb1 {
  width: 400px;
  height: 400px;
  background: #ff006e;
  top: -100px;
  left: -100px;
  animation: float1 15s ease-in-out infinite;
}

.bg-orb.orb2 {
  width: 500px;
  height: 500px;
  background: #00f5ff;
  bottom: -150px;
  right: -150px;
  animation: float2 18s ease-in-out infinite;
}

.bg-orb.orb3 {
  width: 300px;
  height: 300px;
  background: #8338ec;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  animation: float3 20s ease-in-out infinite;
}

@keyframes float1 {
  0%, 100% { transform: translate(0, 0) scale(1); }
  33% { transform: translate(100px, 50px) scale(1.2); }
  66% { transform: translate(-50px, 100px) scale(0.9); }
}

@keyframes float2 {
  0%, 100% { transform: translate(0, 0) scale(1); }
  50% { transform: translate(-100px, -80px) scale(1.3); }
}

@keyframes float3 {
  0%, 100% { transform: translate(-50%, -50%) scale(1); }
  50% { transform: translate(-50%, -50%) scale(1.4); }
}

.player {
  width: 95%;
  max-width: 440px;
  background: rgba(20, 20, 35, 0.7);
  backdrop-filter: blur(30px);
  -webkit-backdrop-filter: blur(30px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 32px;
  padding: 28px;
  box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5),
              inset 0 1px 0 rgba(255, 255, 255, 0.1);
  position: relative;
  z-index: 1;
  animation: fadeIn 0.8s ease-out;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px) scale(0.95); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.player::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 32px;
  padding: 1px;
  background: linear-gradient(135deg, rgba(255, 0, 110, 0.3), rgba(0, 245, 255, 0.3), rgba(131, 56, 236, 0.3));
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  pointer-events: none;
}

.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  color: #fff;
  font-weight: 600;
  font-size: 16px;
}

.logo-icon {
  width: 32px;
  height: 32px;
  border-radius: 10px;
  background: linear-gradient(135deg, #ff006e, #8338ec);
  display: flex;
  align-items: center;
  justify-content: center;
  animation: pulse 2s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { box-shadow: 0 0 20px rgba(255, 0, 110, 0.5); }
  50% { box-shadow: 0 0 30px rgba(131, 56, 236, 0.7); }
}

.upload-btn {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 12px;
  padding: 8px 14px;
  color: #fff;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  transition: all 0.3s ease;
}

.upload-btn:hover {
  background: rgba(255, 255, 255, 0.1);
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(255, 0, 110, 0.3);
}

.upload-btn:active {
  transform: translateY(0);
}

.cover {
  width: 100%;
  aspect-ratio: 1;
  border-radius: 24px;
  background: linear-gradient(135deg, #1a1a2e, #16213e);
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
}

.cover.active::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at center, rgba(255, 0, 110, 0.2), transparent 60%);
  animation: glowPulse 2s ease-in-out infinite;
}

@keyframes glowPulse {
  0%, 100% { opacity: 0.5; }
  50% { opacity: 1; }
}

.cover svg {
  width: 50%;
  height: 50%;
  opacity: 0.8;
  transition: all 0.5s ease;
}

.cover.active svg {
  animation: rotate 12s linear infinite;
}

@keyframes rotate {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

.track-info {
  text-align: center;
  margin-bottom: 18px;
}

.track-title {
  color: #fff;
  font-size: 18px;
  font-weight: 600;
  margin-bottom: 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  padding: 0 10px;
}

.track-artist {
  color: rgba(255, 255, 255, 0.5);
  font-size: 13px;
  margin-bottom: 2px;
}

.track-status {
  color: rgba(0, 245, 255, 0.8);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 2px;
  font-weight: 500;
}

.wave-container {
  width: 100%;
  height: 80px;
  margin-bottom: 16px;
  position: relative;
  border-radius: 16px;
  overflow: hidden;
  background: rgba(0, 0, 0, 0.3);
  border: 1px solid rgba(255, 255, 255, 0.05);
}

canvas {
  width: 100%;
  height: 100%;
  display: block;
}

.wave-empty {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: rgba(255, 255, 255, 0.3);
  font-size: 12px;
  letter-spacing: 1px;
  pointer-events: none;
}

.progress-container {
  margin-bottom: 20px;
  padding: 0 4px;
}

.progress-bar {
  width: 100%;
  height: 6px;
  background: rgba(255, 255, 255, 0.1);
  border-radius: 3px;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: height 0.2s ease;
}

.progress-bar:hover {
  height: 8px;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, #ff006e, #8338ec, #00f5ff);
  border-radius: 3px;
  width: 0%;
  position: relative;
  transition: width 0.1s linear;
}

.progress-fill::after {
  content: '';
  position: absolute;
  right: -6px;
  top: 50%;
  transform: translateY(-50%);
  width: 12px;
  height: 12px;
  background: #fff;
  border-radius: 50%;
  opacity: 0;
  transition: opacity 0.2s ease;
  box-shadow: 0 0 10px rgba(0, 245, 255, 0.8);
}

.progress-bar:hover .progress-fill::after {
  opacity: 1;
}

.time-info {
  display: flex;
  justify-content: space-between;
  margin-top: 8px;
  font-size: 11px;
  color: rgba(255, 255, 255, 0.5);
  font-variant-numeric: tabular-nums;
}

.controls {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 20px;
  margin-bottom: 20px;
}

.btn {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 50%;
  color: #fff;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

.btn:hover {
  background: rgba(255, 255, 255, 0.15);
  transform: translateY(-2px) scale(1.05);
}

.btn:active {
  transform: translateY(0) scale(0.95);
}

.btn:disabled {
  opacity: 0.3;
  cursor: not-allowed;
  transform: none;
}

.btn-small {
  width: 44px;
  height: 44px;
}

.btn-play {
  width: 64px;
  height: 64px;
  background: linear-gradient(135deg, #ff006e, #8338ec);
  border: none;
  box-shadow: 0 10px 30px rgba(255, 0, 110, 0.4),
              inset 0 1px 0 rgba(255, 255, 255, 0.2);
}

.btn-play:hover {
  background: linear-gradient(135deg, #ff1a7e, #9d4eec);
  box-shadow: 0 15px 40px rgba(255, 0, 110, 0.6),
              inset 0 1px 0 rgba(255, 255, 255, 0.3);
}

.btn-play svg {
  width: 24px;
  height: 24px;
}

.btn-small svg {
  width: 18px;
  height: 18px;
}

.btn.active {
  background: rgba(0, 245, 255, 0.2);
  border-color: rgba(0, 245, 255, 0.4);
  color: #00f5ff;
}

.bottom-controls {
  display: flex;
  align-items: center;
  gap: 12px;
}

.volume-icon {
  flex-shrink: 0;
  color: rgba(255, 255, 255, 0.6);
  display: flex;
  align-items: center;
}

.volume-slider {
  flex: 1;
  -webkit-appearance: none;
  appearance: none;
  height: 4px;
  background: rgba(255, 255, 255, 0.1);
  border-radius: 2px;
  outline: none;
  cursor: pointer;
}

.volume-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 14px;
  height: 14px;
  background: linear-gradient(135deg, #ff006e, #8338ec);
  border-radius: 50%;
  cursor: pointer;
  box-shadow: 0 0 10px rgba(255, 0, 110, 0.5);
  transition: transform 0.2s ease;
}

.volume-slider::-webkit-slider-thumb:hover {
  transform: scale(1.2);
}

.volume-slider::-moz-range-thumb {
  width: 14px;
  height: 14px;
  background: linear-gradient(135deg, #ff006e, #8338ec);
  border-radius: 50%;
  cursor: pointer;
  border: none;
  box-shadow: 0 0 10px rgba(255, 0, 110, 0.5);
}

.speed-btn {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 12px;
  padding: 6px 10px;
  color: #fff;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s ease;
  min-width: 40px;
}

.speed-btn:hover {
  background: rgba(0, 245, 255, 0.2);
  border-color: rgba(0, 245, 255, 0.4);
  color: #00f5ff;
}

input[type="file"] {
  display: none;
}

.toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: rgba(20, 20, 35, 0.95);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  color: #fff;
  padding: 12px 24px;
  border-radius: 16px;
  font-size: 13px;
  opacity: 0;
  transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  z-index: 100;
  pointer-events: none;
}

.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

@media (max-width: 480px) {
  .player {
    padding: 20px;
    border-radius: 24px;
  }
  .cover {
    border-radius: 20px;
  }
  .controls {
    gap: 14px;
  }
  .btn-play {
    width: 58px;
    height: 58px;
  }
}

@media (max-width: 360px) {
  .header {
    flex-direction: column;
    gap: 12px;
    align-items: stretch;
  }
}
</style>
</head>
<body>

<div class="bg-orb orb1"></div>
<div class="bg-orb orb2"></div>
<div class="bg-orb orb3"></div>

<div class="player">
  <div class="header">
    <div class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
          <path d="M9 18V5l12-2v13"/>
          <circle cx="6" cy="18" r="3"/>
          <circle cx="18" cy="16" r="3"/>
        </svg>
      </div>
      <span>Wave Player</span>
    </div>
    <label class="upload-btn" for="fileInput">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="17 8 12 3 7 8"/>
        <line x1="12" y1="3" x2="12" y2="15"/>
      </svg>
      <span>Загрузить MP3</span>
    </label>
    <input type="file" id="fileInput" accept="audio/mp3,audio/*">
  </div>

  <div class="cover" id="cover">
    <svg viewBox="0 0 100 100" fill="none">
      <circle cx="50" cy="50" r="45" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
      <circle cx="50" cy="50" r="25" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
      <circle cx="50" cy="50" r="10" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
      <circle cx="50" cy="50" r="2" fill="white"/>
    </svg>
  </div>

  <div class="track-info">
    <div class="track-title" id="trackTitle">Файл не выбран</div>
    <div class="track-artist" id="trackArtist">Загрузите MP3 для воспроизведения</div>
    <div class="track-status" id="trackStatus">Готов к работе</div>
  </div>

  <div class="wave-container">
    <canvas id="waveCanvas"></canvas>
    <div class="wave-empty" id="waveEmpty">♪ Загрузите трек ♪</div>
  </div>

  <div class="progress-container">
    <div class="progress-bar" id="progressBar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="time-info">
      <span id="currentTime">0:00</span>
      <span id="duration">0:00</span>
    </div>
  </div>

  <div class="controls">
    <button class="btn btn-small" id="prevBtn" disabled title="Перезапустить">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
    </button>
    <button class="btn btn-small" id="rewBtn" disabled title="Назад 10 сек">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M11 18V6l-8.5 6 8.5 6zm.5-6l8.5 6V6l-8.5 6z"/></svg>
    </button>
    <button class="btn btn-play" id="playBtn" disabled>
      <svg id="playIcon" viewBox="0 0 24 24" fill="white">
        <path d="M8 5v14l11-7z"/>
      </svg>
    </button>
    <button class="btn btn-small" id="fwdBtn" disabled title="Вперёд 10 сек">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 6v12l8.5-6L13 6zM2 18h2V6H2v12z"/></svg>
    </button>
    <button class="btn btn-small" id="loopBtn" title="Повтор">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
        <polyline points="17 1 21 5 17 9"/>
        <path d="M3 11V9a4 4 0 0 1 4-4h14"/>
        <polyline points="7 23 3 19 7 15"/>
        <path d="M21 13v2a4 4 0 0 1-4 4H3"/>
      </svg>
    </button>
  </div>

  <div class="bottom-controls">
    <div class="volume-icon" id="volumeIcon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
        <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>
      </svg>
    </div>
    <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="80">
    <button class="speed-btn" id="speedBtn">1x</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const audio = new Audio();
const fileInput = document.getElementById('fileInput');
const playBtn = document.getElementById('playBtn');
const playIcon = document.getElementById('playIcon');
const prevBtn = document.getElementById('prevBtn');
const rewindBtn = document.getElementById('rewBtn');
const fwdBtn = document.getElementById('fwdBtn');
const loopBtn = document.getElementById('loopBtn');
const progressBar = document.getElementById('progressBar');
const progressFill = document.getElementById('progressFill');
const currentTimeEl = document.getElementById('currentTime');
const durationEl = document.getElementById('duration');
const volumeSlider = document.getElementById('volumeSlider');
const volumeIcon = document.getElementById('volumeIcon');
const speedBtn = document.getElementById('speedBtn');
const trackTitle = document.getElementById('trackTitle');
const trackArtist = document.getElementById('trackArtist');
const trackStatus = document.getElementById('trackStatus');
const cover = document.getElementById('cover');
const canvas = document.getElementById('waveCanvas');
const waveEmpty = document.getElementById('waveEmpty');
const toast = document.getElementById('toast');

const ctx = canvas.getContext('2d');
let audioCtx, analyser, source, dataArray, bufferLength;
let isPlaying = false;
let isLooping = false;
let animationId = null;
let playbackRates = [0.5, 0.75, 1, 1.25, 1.5, 2];
let speedIndex = 2;

const savedVolume = localStorage.getItem('wp_volume');
if (savedVolume !== null) {
  volumeSlider.value = savedVolume;
  audio.volume = savedVolume / 100;
}

function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toast._timer);
  toast._timer = setTimeout(() => toast.classList.remove('show'), 2500);
}

function formatTime(sec) {
  if (isNaN(sec)) return '0:00';
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return `${m}:${s.toString().padStart(2, '0')}`;
}

function resizeCanvas() {
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * window.devicePixelRatio;
  canvas.height = rect.height * window.devicePixelRatio;
  ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
}
resizeCanvas();
window.addEventListener('resize', () => {
  resizeCanvas();
  if (!isPlaying) drawIdleWave();
});

function setupAnalyser() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  source = audioCtx.createMediaElementSource(audio);
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 256;
  source.connect(analyser);
  analyser.connect(audioCtx.destination);
  bufferLength = analyser.frequencyBinCount;
  dataArray = new Uint8Array(bufferLength);
}

function drawIdleWave() {
  const rect = canvas.getBoundingClientRect();
  const w = rect.width;
  const h = rect.height;
  ctx.clearRect(0, 0, w, h);
  
  const gradient = ctx.createLinearGradient(0, 0, w, 0);
  gradient.addColorStop(0, '#ff006e');
  gradient.addColorStop(0.5, '#8338ec');
  gradient.addColorStop(1, '#00f5ff');
  
  ctx.strokeStyle = gradient;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  
  for (let x = 0; x < w; x += 2) {
    const y = h / 2 + Math.sin(x * 0.02 + Date.now() * 0.001) * 2;
    if (x === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.stroke();
}

function drawWave() {
  if (!analyser) return;
  animationId = requestAnimationFrame(drawWave);
  analyser.getByteFrequencyData(dataArray);
  
  const rect = canvas.getBoundingClientRect();
  const w = rect.width;
  const h = rect.height;
  ctx.clearRect(0, 0, w, h);
  
  const bars = 64;
  const step = Math.floor(bufferLength / bars);
  const barWidth = w / bars;
  
  const gradient = ctx.createLinearGradient(0, 0, 0, h);
  gradient.addColorStop(0, '#00f5ff');
  gradient.addColorStop(0.5, '#8338ec');
  gradient.addColorStop(1, '#ff006e');
  
  ctx.fillStyle = gradient;
  ctx.shadowColor = 'rgba(0, 245, 255, 0.5)';
  ctx.shadowBlur = 8;
  
  for (let i = 0; i < bars; i++) {
    let sum = 0;
    for (let j = 0; j < step; j++) {
      sum += dataArray[i * step + j] || 0;
    }
    const avg = sum / step;
    const barHeight = (avg / 255) * h * 0.9;
    const x = i * barWidth;
    const y = (h - barHeight) / 2;
    
    ctx.fillRect(x + 1, y, Math.max(barWidth - 2, 1), barHeight);
  }
  
  ctx.shadowBlur = 0;
}

function drawIdleCircles() {
  const rect = canvas.getBoundingClientRect();
  const w = rect.width;
  const h = rect.height;
  ctx.clearRect(0, 0, w, h);
  
  const t = Date.now() * 0.002;
  for (let i = 0; i < 5; i++) {
    const radius = 5 + Math.sin(t + i * 0.7) * 3;
    const x = w / 2;
    const y = h / 2 + Math.sin(t + i * 0.7) * 15;
    const alpha = 0.3 + Math.sin(t + i * 0.7) * 0.3;
    
    ctx.fillStyle = `rgba(0, 245, 255, ${alpha})`;
    ctx.beginPath();
    ctx.arc(x + (i - 2) * 30, y, radius, 0, Math.PI * 2);
    ctx.fill();
  }
}

let idleAnimId = null;
function startIdleAnim() {
  if (animationId) cancelAnimationFrame(animationId);
  if (idleAnimId) cancelAnimationFrame(idleAnimId);
  const loop = () => {
    drawIdleCircles();
    idleAnimId = requestAnimationFrame(loop);
  };
  loop();
}

startIdleAnim();

fileInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  
  if (!file.type.startsWith('audio/')) {
    showToast('⚠️ Пожалуйста, выберите аудио файл');
    return;
  }
  
  const url = URL.createObjectURL(file);
  audio.src = url;
  audio.load();
  
  const name = file.name.replace(/\.[^/.]+$/, '');
  trackTitle.textContent = name;
  trackArtist.textContent = `Размер: ${(file.size / 1024 / 1024).toFixed(2)} MB`;
  trackStatus.textContent = 'Загружено';
  waveEmpty.style.display = 'none';
  
  playBtn.disabled = false;
  prevBtn.disabled = false;
  rewindBtn.disabled = false;
  fwdBtn.disabled = false;
  
  setupAnalyser();
  showToast('✓ Трек загружен');
});

audio.addEventListener('loadedmetadata', () => {
  durationEl.textContent = formatTime(audio.duration);
});

audio.addEventListener('timeupdate', () => {
  const progress = (audio.currentTime / audio.duration) * 100;
  progressFill.style.width = progress + '%';
  currentTimeEl.textContent = formatTime(audio.currentTime);
});

audio.addEventListener('ended', () => {
  if (!isLooping) {
    isPlaying = false;
    updatePlayIcon();
    cover.classList.remove('active');
    trackStatus.textContent = 'Завершено';
    if (animationId) cancelAnimationFrame(animationId);
    startIdleAnim();
  }
});

playBtn.addEventListener('click', () => {
  if (!audio.src) return;
  if (audioCtx && audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
  if (isPlaying) {
    audio.pause();
    isPlaying = false;
    trackStatus.textContent = 'Пауза';
    if (animationId) cancelAnimationFrame(animationId);
    cover.classList.remove('active');
    startIdleAnim();
  } else {
    audio.play();
    isPlaying = true;
    trackStatus.textContent = 'Воспроизведение';
    if (idleAnimId) cancelAnimationFrame(idleAnimId);
    drawWave();
    cover.classList.add('active');
  }
  updatePlayIcon();
});

function updatePlayIcon() {
  if (isPlaying) {
    playIcon.innerHTML = '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';
  } else {
    playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
  }
}

prevBtn.addEventListener('click', () => {
  audio.currentTime = 0;
  showToast('↻ Трек перезапущен');
});

rewindBtn.addEventListener('click', () => {
  audio.currentTime = Math.max(0, audio.currentTime - 10);
});

fwdBtn.addEventListener('click', () => {
  audio.currentTime = Math.min(audio.duration, audio.currentTime + 10);
});

loopBtn.addEventListener('click', () => {
  isLooping = !isLooping;
  audio.loop = isLooping;
  loopBtn.classList.toggle('active', isLooping);
  showToast(isLooping ? '🔁 Повтор включён' : 'Повтор выключен');
});

progressBar.addEventListener('click', (e) => {
  if (!audio.duration) return;
  const rect = progressBar.getBoundingClientRect();
  const percent = (e.clientX - rect.left) / rect.width;
  audio.currentTime = percent * audio.duration;
});

let isDragging = false;
function updateProgressFromTouch(e) {
  if (!audio.duration) return;
  const rect = progressBar.getBoundingClientRect();
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const percent = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
  audio.currentTime = percent * audio.duration;
}

progressBar.addEventListener('mousedown', (e) => {
  isDragging = true;
  updateProgressFromTouch(e);
});
progressBar.addEventListener('touchstart', (e) => {
  isDragging = true;
  updateProgressFromTouch(e);
});
document.addEventListener('mousemove', (e) => {
  if (isDragging) updateProgressFromTouch(e);
});
document.addEventListener('touchmove', (e) => {
  if (isDragging) updateProgressFromTouch(e);
});
document.addEventListener('mouseup', () => isDragging = false);
document.addEventListener('touchend', () => isDragging = false);

volumeSlider.addEventListener('input', (e) => {
  const value = e.target.value / 100;
  audio.volume = value;
  localStorage.setItem('wp_volume', e.target.value);
  if (value === 0) {
    volumeIcon.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>';
  } else if (value < 0.5) {
    volumeIcon.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>';
  } else {
    volumeIcon.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>';
  }
});

speedBtn.addEventListener('click', () => {
  speedIndex = (speedIndex + 1) % playbackRates.length;
  const rate = playbackRates[speedIndex];
  audio.playbackRate = rate;
  speedBtn.textContent = rate + 'x';
  showToast(`Скорость: ${rate}x`);
});

document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space' && audio.src) {
    e.preventDefault();
    playBtn.click();
  } else if (e.code === 'ArrowLeft' && audio.src) {
    audio.currentTime = Math.max(0, audio.currentTime - 5);
  } else if (e.code === 'ArrowRight' && audio.src) {
    audio.currentTime = Math.min(audio.duration, audio.currentTime + 5);
  } else if (e.code === 'ArrowUp') {
    e.preventDefault();
    volumeSlider.value = Math.min(100, parseInt(volumeSlider.value) + 5);
    volumeSlider.dispatchEvent(new Event('input'));
  } else if (e.code === 'ArrowDown') {
    e.preventDefault();
    volumeSlider.value = Math.max(0, parseInt(volumeSlider.value) - 5);
    volumeSlider.dispatchEvent(new Event('input'));
  }
});
</script>

</body>
</html>
