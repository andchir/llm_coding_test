<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Wave Player</title>
<style>
:root{
  --accent:#00f2ff;
  --accent-rgb:0,242,255;
  --accent-glow:rgba(0,242,255,0.45);
  --bg1:#0f0c29;
  --bg2:#302b63;
  --bg3:#24243e;
}
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}
html,body{
  margin:0;
  padding:0;
  min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Oxygen,Ubuntu,Cantarell,sans-serif;
  color:#fff;
  overflow-x:hidden;
}
body{
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(-45deg,var(--bg1),var(--bg2),var(--bg3),#1a1a2e);
  background-size:400% 400%;
  animation:bgMove 18s ease infinite;
}
@keyframes bgMove{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}
.app{
  width:100%;
  max-width:480px;
  margin:16px;
  padding:24px;
  border-radius:28px;
  background:rgba(255,255,255,0.07);
  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);
  border:1px solid rgba(255,255,255,0.12);
  box-shadow:0 24px 70px rgba(0,0,0,0.55);
  animation:fadeIn .8s ease both;
}
@keyframes fadeIn{
  from{opacity:0;transform:translateY(16px)}
  to{opacity:1;transform:translateY(0)}
}
header{
  display:flex;
  align-items:center;
  gap:14px;
  margin-bottom:22px;
}
.logo{
  width:46px;
  height:46px;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  gap:4px;
}
.logo .bar{
  width:7px;
  background:var(--accent);
  border-radius:4px;
  box-shadow:0 0 12px var(--accent-glow);
  animation:bounce 1.1s ease-in-out infinite;
}
.logo .bar:nth-child(1){height:35%;animation-delay:0s}
.logo .bar:nth-child(2){height:65%;animation-delay:.18s}
.logo .bar:nth-child(3){height:45%;animation-delay:.36s}
@keyframes bounce{
  0%,100%{height:25%}
  50%{height:100%}
}
h1{
  margin:0;
  font-size:1.55rem;
  font-weight:700;
  letter-spacing:.6px;
  text-shadow:0 0 18px rgba(0,242,255,0.35);
}
input[type="file"]{
  display:none;
}
.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  width:100%;
  padding:14px 18px;
  border:none;
  border-radius:16px;
  font-size:1rem;
  font-weight:600;
  color:#fff;
  cursor:pointer;
  background:rgba(255,255,255,0.1);
  border:1px solid rgba(255,255,255,0.14);
  transition:background .25s,color .25s,transform .15s,box-shadow .25s;
}
.btn:hover{
  background:var(--accent);
  color:#000;
  transform:translateY(-2px);
  box-shadow:0 8px 24px var(--accent-glow);
}
.btn svg{
  width:22px;
  height:22px;
  fill:currentColor;
}
.visualizer{
  position:relative;
  width:100%;
  height:170px;
  margin:22px 0 14px;
  border-radius:22px;
  background:rgba(0,0,0,0.22);
  border:1px solid rgba(255,255,255,0.08);
  overflow:hidden;
  box-shadow:inset 0 0 30px rgba(0,0,0,0.35);
}
#waveCanvas{
  display:block;
  width:100%;
  height:100%;
}
.placeholder{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:20px;
  font-size:.95rem;
  color:#9aa0a6;
  pointer-events:none;
  transition:opacity .3s;
}
.placeholder.hidden{
  opacity:0;
}
.now-playing{
  text-align:center;
  font-size:.95rem;
  color:#e8eaed;
  min-height:1.4em;
  margin-bottom:10px;
  font-weight:500;
}
.controls{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:22px;
  margin:18px 0;
}
.control-btn{
  width:58px;
  height:58px;
  border:none;
  border-radius:50%;
  background:rgba(255,255,255,0.1);
  color:#fff;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:background .25s,transform .15s,box-shadow .25s;
  box-shadow:0 4px 14px rgba(0,0,0,0.25);
}
.control-btn svg{
  width:26px;
  height:26px;
  fill:currentColor;
}
.control-btn:hover{
  background:var(--accent);
  transform:scale(1.1);
  box-shadow:0 0 24px var(--accent-glow);
}
.play-btn{
  width:74px;
  height:74px;
  background:var(--accent);
  color:#000;
}
.play-btn:hover{
  background:#fff;
  color:var(--accent);
  box-shadow:0 0 30px var(--accent-glow);
}
.play-btn svg{
  width:32px;
  height:32px;
}
.progress-wrap{
  display:flex;
  align-items:center;
  gap:10px;
  margin:14px 0;
  font-size:.78rem;
  color:#bdc1c6;
}
.progress-wrap span{
  min-width:34px;
  text-align:center;
}
input[type=range]{
  -webkit-appearance:none;
  flex:1;
  height:6px;
  border-radius:3px;
  background:rgba(255,255,255,0.14);
  outline:none;
  cursor:pointer;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;
  width:16px;
  height:16px;
  border-radius:50%;
  background:var(--accent);
  box-shadow:0 0 10px var(--accent-glow);
  cursor:pointer;
  transition:transform .15s;
}
input[type=range]::-webkit-slider-thumb:hover{
  transform:scale(1.25);
}
input[type=range]::-moz-range-thumb{
  width:16px;
  height:16px;
  border:none;
  border-radius:50%;
  background:var(--accent);
  box-shadow:0 0 10px var(--accent-glow);
  cursor:pointer;
}
.playlist{
  max-height:210px;
  overflow-y:auto;
  margin-top:18px;
  padding-right:4px;
}
.playlist::-webkit-scrollbar{
  width:6px;
}
.playlist::-webkit-scrollbar-thumb{
  background:rgba(255,255,255,0.18);
  border-radius:3px;
}
.empty{
  text-align:center;
  padding:22px;
  color:#9aa0a6;
  font-size:.9rem;
}
.track{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px;
  margin-bottom:8px;
  border-radius:16px;
  background:rgba(255,255,255,0.06);
  border:1px solid transparent;
  cursor:pointer;
  transition:background .2s,transform .15s,border-color .2s;
}
.track:hover{
  background:rgba(255,255,255,0.12);
  transform:translateX(5px);
}
.track.active{
  background:rgba(var(--accent-rgb),0.16);
  border-color:var(--accent);
}
.track svg{
  width:22px;
  height:22px;
  fill:currentColor;
  flex-shrink:0;
  color:var(--accent);
}
.track-info{
  flex:1;
  min-width:0;
}
.track-title{
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  font-size:.9rem;
  font-weight:500;
}
.track-duration{
  font-size:.75rem;
  color:#9aa0a6;
  margin-top:2px;
}
.remove{
  width:30px;
  height:30px;
  border:none;
  border-radius:50%;
  background:transparent;
  color:#9aa0a6;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:background .2s,color .2s,transform .15s;
}
.remove:hover{
  background:rgba(255,80,80,0.18);
  color:#ff6b6b;
  transform:rotate(90deg);
}
.remove svg{
  width:16px;
  height:16px;
  fill:currentColor;
}
.clear-btn{
  margin-top:10px;
  background:rgba(255,255,255,0.06);
}
.clear-btn:hover{
  background:#ff6b6b;
  color:#fff;
}
@media (max-width:480px){
  .app{
    margin:8px;
    padding:18px;
    border-radius:22px;
  }
  h1{font-size:1.35rem}
  .visualizer{height:150px}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
    </div>
    <h1>Wave Player</h1>
  </header>

  <label class="btn upload-btn" for="fileInput">
    <svg viewBox="0 0 24 24"><path d="M9 16v-6H5l7-7 7 7h-4v6zm-4 2h14v2H5z"/></svg>
    <span>Загрузить MP3</span>
  </label>
  <input type="file" id="fileInput" accept="audio/mp3,audio/mpeg,audio/*" multiple>

  <div class="visualizer" id="visualizer">
    <canvas id="waveCanvas"></canvas>
    <div class="placeholder" id="placeholder">Загрузите трек, чтобы увидеть волну</div>
  </div>

  <div class="now-playing" id="nowPlaying">Ничего не воспроизводится</div>

  <div class="controls">
    <button class="control-btn" id="prevBtn" aria-label="Предыдущий">
      <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm4 6l9-6v12z"/></svg>
    </button>
    <button class="control-btn play-btn" id="playBtn" aria-label="Играть / Пауза">
      <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      <svg id="pauseIcon" viewBox="0 0 24 24" style="display:none"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
    </button>
    <button class="control-btn" id="nextBtn" aria-label="Следующий">
      <svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zm-9 6l9-6v12z"/></svg>
    </button>
  </div>

  <div class="progress-wrap">
    <span id="currentTime">0:00</span>
    <input type="range" id="progress" min="0" max="100" value="0" step="0.1">
    <span id="duration">0:00</span>
  </div>

  <div class="progress-wrap">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.8-1-3.4-2.5-4.2v8.4c1.5-.8 2.5-2.4 2.5-4.2z"/></svg>
    <input type="range" id="volume" min="0" max="1" value="1" step="0.01">
  </div>

  <div class="playlist" id="playlist">
    <div class="empty">Плейлист пуст</div>
  </div>

  <button class="btn clear-btn" id="clearBtn" style="display:none">Очистить плейлист</button>
</div>

<audio id="audio" preload="metadata"></audio>

<script>
(function(){
  const fileInput=document.getElementById('fileInput');
  const audio=document.getElementById('audio');
  const playBtn=document.getElementById('playBtn');
  const playIcon=document.getElementById('playIcon');
  const pauseIcon=document.getElementById('pauseIcon');
  const prevBtn=document.getElementById('prevBtn');
  const nextBtn=document.getElementById('nextBtn');
  const progress=document.getElementById('progress');
  const currentTimeEl=document.getElementById('currentTime');
  const durationEl=document.getElementById('duration');
  const volume=document.getElementById('volume');
  const playlistEl=document.getElementById('playlist');
  const clearBtn=document.getElementById('clearBtn');
  const nowPlaying=document.getElementById('nowPlaying');
  const placeholder=document.getElementById('placeholder');
  const canvas=document.getElementById('waveCanvas');
  const ctx=canvas.getContext('2d');

  let playlist=[];
  let currentIndex=-1;
  let audioCtx=null;
  let analyser=null;
  let source=null;
  let dataArray=null;
  let animationId=null;
  let lastSave=0;

  function formatTime(sec){
    if(!isFinite(sec)||sec<0) return '0:00';
    const m=Math.floor(sec/60);
    const s=Math.floor(sec%60);
    return m+':'+(s<10?'0':'')+s;
  }

  function resizeCanvas(){
    const dpr=window.devicePixelRatio||1;
    const rect=canvas.getBoundingClientRect();
    canvas.width=Math.floor(rect.width*dpr);
    canvas.height=Math.floor(rect.height*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  window.addEventListener('resize',resizeCanvas);
  resizeCanvas();

  function initAudioContext(){
    if(audioCtx) return;
    const AudioContext=window.AudioContext||window.webkitAudioContext;
    if(!AudioContext) return;
    audioCtx=new AudioContext();
    analyser=audioCtx.createAnalyser();
    analyser.fftSize=256;
    analyser.smoothingTimeConstant=0.85;
    const bufferLength=analyser.frequencyBinCount;
    dataArray=new Uint8Array(bufferLength);
    source=audioCtx.createMediaElementSource(audio);
    source.connect(analyser);
    analyser.connect(audioCtx.destination);
  }

  async function resumeContext(){
    if(audioCtx && audioCtx.state==='suspended'){
      try{ await audioCtx.resume(); }catch(e){}
    }
  }

  function draw(){
    if(!analyser){
      ctx.clearRect(0,0,canvas.width,canvas.height);
      animationId=requestAnimationFrame(draw);
      return;
    }
    analyser.getByteFrequencyData(dataArray);
    const w=canvas.clientWidth;
    const h=canvas.clientHeight;
    ctx.clearRect(0,0,w,h);
    const barCount=dataArray.length;
    const gap=3;
    const barWidth=(w-(barCount-1)*gap)/barCount;
    const grad=ctx.createLinearGradient(0,h,0,0);
    grad.addColorStop(0,'rgba(0,242,255,0.25)');
    grad.addColorStop(.5,'rgba(0,242,255,0.85)');
    grad.addColorStop(1,'#ffffff');
    ctx.fillStyle=grad;
    for(let i=0;i<barCount;i++){
      const value=dataArray[i];
      const percent=value/255;
      const barHeight=percent*h*0.85;
      const x=i*(barWidth+gap)+barWidth/2;
      const radius=Math.max(1,barWidth/2);
      ctx.beginPath();
      ctx.roundRect(x-barWidth/2,h-barHeight,barWidth,barHeight,radius);
      ctx.fill();
    }
    animationId=requestAnimationFrame(draw);
  }
  draw();

  function saveVolume(){
    try{ localStorage.setItem('wavePlayer_volume',audio.volume); }catch(e){}
  }
  function loadVolume(){
    try{
      const v=localStorage.getItem('wavePlayer_volume');
      if(v!==null){
        audio.volume=parseFloat(v);
        volume.value=audio.volume;
      }
    }catch(e){}
  }

  function saveProgress(){
    const now=Date.now();
    if(now-lastSave<2000) return;
    lastSave=now;
    if(currentIndex<0) return;
    const track=playlist[currentIndex];
    try{
      localStorage.setItem('wavePlayer_lastTrack',track.name);
      localStorage.setItem('wavePlayer_lastTime',String(audio.currentTime));
    }catch(e){}
  }
  function restoreProgress(track){
    try{
      const lastName=localStorage.getItem('wavePlayer_lastTrack');
      const lastTime=parseFloat(localStorage.getItem('wavePlayer_lastTime')||'0');
      if(lastName===track.name && isFinite(lastTime) && lastTime>0 && lastTime<audio.duration-2){
        audio.currentTime=lastTime;
      }
    }catch(e){}
  }

  function renderPlaylist(){
    playlistEl.innerHTML='';
    if(playlist.length===0){
      playlistEl.innerHTML='<div class="empty">Плейлист пуст</div>';
      clearBtn.style.display='none';
      return;
    }
    clearBtn.style.display='inline-flex';
    playlist.forEach((track,i)=>{
      const div=document.createElement('div');
      div.className='track'+(i===currentIndex?' active':'');
      div.innerHTML=`
        <svg viewBox="0 0 24 24"><path d="M9 18V5l10-3v13"/><circle cx="6" cy="18" r="3"/><circle cx="16" cy="15" r="3"/></svg>
        <div class="track-info">
          <div class="track-title">${escapeHtml(track.name)}</div>
          <div class="track-duration">${formatTime(track.duration)}</div>
        </div>
        <button class="remove" aria-label="Удалить" data-index="${i}">
          <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      `;
      div.addEventListener('click',(e)=>{
        if(e.target.closest('.remove')) return;
        loadTrack(i,true);
      });
      div.querySelector('.remove').addEventListener('click',(e)=>{
        e.stopPropagation();
        removeTrack(i);
      });
      playlistEl.appendChild(div);
    });
  }

  function escapeHtml(text){
    const div=document.createElement('div');
    div.textContent=text;
    return div.innerHTML;
  }

  function updateDuration(){
    if(currentIndex>=0){
      playlist[currentIndex].duration=audio.duration||0;
      renderPlaylist();
    }
    durationEl.textContent=formatTime(audio.duration);
    progress.max=audio.duration||100;
  }

  function loadTrack(index,autoplay=false){
    if(index<0||index>=playlist.length) return;
    currentIndex=index;
    const track=playlist[index];
    audio.src=track.url;
    audio.load();
    nowPlaying.textContent=track.name;
    placeholder.classList.add('hidden');
    initAudioContext();
    audio.onloadedmetadata=()=>{
      updateDuration();
      restoreProgress(track);
      if(autoplay){
        audio.play().catch(()=>{});
      }
    };
    renderPlaylist();
  }

  function playPause(){
    if(playlist.length===0){
      fileInput.click();
      return;
    }
    if(currentIndex===-1){
      loadTrack(0,true);
      return;
    }
    initAudioContext();
    resumeContext();
    if(audio.paused){
      audio.play().catch(()=>{});
    }else{
      audio.pause();
    }
  }

  function updatePlayIcon(){
    if(audio.paused){
      playIcon.style.display='block';
      pauseIcon.style.display='none';
    }else{
      playIcon.style.display='none';
      pauseIcon.style.display='block';
    }
  }

  function nextTrack(){
    if(playlist.length===0) return;
    let next=currentIndex+1;
    if(next>=playlist.length) next=0;
    loadTrack(next,true);
  }
  function prevTrack(){
    if(playlist.length===0) return;
    let prev=currentIndex-1;
    if(prev<0) prev=playlist.length-1;
    loadTrack(prev,true);
  }

  function removeTrack(index){
    const wasCurrent=index===currentIndex;
    if(wasCurrent){
      audio.pause();
      audio.src='';
      nowPlaying.textContent='Ничего не воспроизводится';
      placeholder.classList.remove('hidden');
      currentIndex=-1;
      progress.value=0;
      currentTimeEl.textContent='0:00';
      durationEl.textContent='0:00';
    }else if(index<currentIndex){
      currentIndex--;
    }
    URL.revokeObjectURL(playlist[index].url);
    playlist.splice(index,1);
    if(wasCurrent && playlist.length>0){
      loadTrack(Math.min(index,playlist.length-1),false);
    }
    renderPlaylist();
    updatePlayIcon();
  }

  function clearPlaylist(){
    audio.pause();
    audio.src='';
    playlist.forEach(t=>URL.revokeObjectURL(t.url));
    playlist=[];
    currentIndex=-1;
    nowPlaying.textContent='Ничего не воспроизводится';
    placeholder.classList.remove('hidden');
    progress.value=0;
    currentTimeEl.textContent='0:00';
    durationEl.textContent='0:00';
    renderPlaylist();
    updatePlayIcon();
  }

  function addFiles(files){
    if(!files.length) return;
    let firstNewIndex=playlist.length;
    Array.from(files).forEach(file=>{
      if(!file.type.startsWith('audio/')) return;
      const url=URL.createObjectURL(file);
      playlist.push({name:file.name.replace(/\.[^/.]+$/,''),url:url,duration:0});
    });
    renderPlaylist();
    if(currentIndex===-1 && playlist.length>0){
      loadTrack(firstNewIndex,true);
    }
  }

  fileInput.addEventListener('change',()=>{
    addFiles(fileInput.files);
    fileInput.value='';
  });

  playBtn.addEventListener('click',playPause);
  nextBtn.addEventListener('click',nextTrack);
  prevBtn.addEventListener('click',prevTrack);
  clearBtn.addEventListener('click',clearPlaylist);

  audio.addEventListener('play',()=>{updatePlayIcon(); resumeContext();});
  audio.addEventListener('pause',updatePlayIcon);
  audio.addEventListener('ended',nextTrack);
  audio.addEventListener('timeupdate',()=>{
    if(!isNaN(audio.duration)){
      progress.value=audio.currentTime;
      currentTimeEl.textContent=formatTime(audio.currentTime);
      saveProgress();
    }
  });
  audio.addEventListener('loadedmetadata',updateDuration);

  progress.addEventListener('input',()=>{
    audio.currentTime=parseFloat(progress.value);
    currentTimeEl.textContent=formatTime(audio.currentTime);
  });

  volume.addEventListener('input',()=>{
    audio.volume=parseFloat(volume.value);
    saveVolume();
  });

  loadVolume();
  renderPlaylist();
})();
</script>
</body>
</html>
