<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WAVE — Оффлайн аудиоплеер</title>
<style>
  :root {
    --bg: #090b15;
    --surface: rgba(23, 26, 48, .78);
    --surface-light: rgba(45, 49, 81, .7);
    --text: #f7f7ff;
    --muted: #969ab8;
    --accent: #8b5cf6;
    --accent-2: #20d9d2;
    --line: rgba(255,255,255,.1);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    color: var(--text);
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background:
      radial-gradient(circle at 14% 18%, rgba(103, 47, 211, .26), transparent 31rem),
      radial-gradient(circle at 88% 78%, rgba(10, 187, 190, .16), transparent 27rem),
      var(--bg);
    overflow-x: hidden;
  }

  .orb {
    position: fixed;
    width: 28vw;
    aspect-ratio: 1;
    border-radius: 50%;
    filter: blur(80px);
    opacity: .16;
    pointer-events: none;
    animation: drift 11s ease-in-out infinite alternate;
  }

  .orb.one { background: #a855f7; top: -12vw; right: -9vw; }
  .orb.two { background: #1ee0d5; bottom: -15vw; left: -10vw; animation-delay: -6s; }

  @keyframes drift {
    to { transform: translate(-5vw, 6vw) scale(1.15); }
  }

  .app {
    width: min(1080px, calc(100% - 32px));
    min-height: 100vh;
    margin: auto;
    padding: 30px 0 42px;
    position: relative;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
    margin-bottom: 28px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 11px;
    font-weight: 800;
    letter-spacing: .13em;
    font-size: 16px;
  }

  .brand-mark {
    width: 36px;
    height: 36px;
    border-radius: 12px;
    display: grid;
    place-items: center;
    background: linear-gradient(135deg, var(--accent), #bc69ef);
    box-shadow: 0 8px 25px rgba(139, 92, 246, .4);
  }

  .brand-mark svg { width: 21px; height: 21px; }

  .offline {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    color: #aeb2ce;
    background: rgba(255,255,255,.045);
    border: 1px solid var(--line);
    padding: 8px 11px;
    border-radius: 100px;
  }

  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent-2);
    box-shadow: 0 0 10px var(--accent-2);
    animation: blink 2s infinite;
  }

  @keyframes blink { 50% { opacity: .35; } }

  .player {
    overflow: hidden;
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 28px;
    background: var(--surface);
    box-shadow: 0 25px 70px rgba(0,0,0,.3);
    backdrop-filter: blur(18px);
  }

  .visual-area {
    min-height: 305px;
    padding: 36px 36px 20px;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    overflow: hidden;
  }

  .visual-area::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(125deg, rgba(139,92,246,.14), transparent 45%, rgba(32,217,210,.08));
    pointer-events: none;
  }

  .track-meta {
    position: relative;
    z-index: 2;
    min-width: 0;
  }

  .eyebrow {
    color: var(--accent-2);
    text-transform: uppercase;
    letter-spacing: .15em;
    font-size: 11px;
    font-weight: 750;
    margin-bottom: 9px;
  }

  .track-title {
    margin: 0;
    font-size: clamp(24px, 4vw, 39px);
    letter-spacing: -.045em;
    line-height: 1.12;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .track-subtitle {
    margin: 9px 0 0;
    color: var(--muted);
    font-size: 14px;
  }

  .wave-wrap {
    height: 130px;
    position: relative;
    z-index: 1;
    margin-top: 12px;
  }

  #waveform {
    display: block;
    width: 100%;
    height: 100%;
  }

  .file-zone {
    display: grid;
    place-items: center;
    min-height: 305px;
    padding: 32px;
    border: 1px dashed rgba(255,255,255,.2);
    border-radius: 20px;
    margin: 0;
    background: rgba(8,10,24,.22);
    cursor: pointer;
    transition: border-color .25s ease, background .25s ease, transform .25s ease;
  }

  .file-zone:hover, .file-zone.dragging {
    border-color: var(--accent-2);
    background: rgba(32,217,210,.07);
    transform: scale(.995);
  }

  .file-zone-content { text-align: center; }
  .upload-icon {
    width: 54px;
    height: 54px;
    margin: 0 auto 16px;
    display: grid;
    place-items: center;
    color: var(--accent-2);
    border-radius: 18px;
    background: rgba(32,217,210,.12);
  }

  .upload-icon svg { width: 27px; height: 27px; }
  .file-zone h2 { margin: 0; font-size: 20px; letter-spacing: -.03em; }
  .file-zone p { color: var(--muted); font-size: 13px; margin: 8px 0 18px; }

  .upload-button {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 11px 16px;
    color: white;
    border: 0;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), #a855f7);
    font: inherit;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 9px 22px rgba(139,92,246,.26);
    transition: transform .2s ease, filter .2s ease, background .25s ease;
  }

  .upload-button:hover { filter: brightness(1.16); transform: translateY(-2px); }
  .upload-button:active { transform: translateY(0) scale(.97); }

  .controls {
    border-top: 1px solid var(--line);
    padding: 20px 36px 25px;
    background: rgba(7, 9, 21, .2);
  }

  .progress-row {
    display: grid;
    grid-template-columns: 42px 1fr 42px;
    align-items: center;
    gap: 11px;
    color: var(--muted);
    font-size: 12px;
    font-variant-numeric: tabular-nums;
  }

  .time:last-child { text-align: right; }

  .range {
    --progress: 0%;
    appearance: none;
    width: 100%;
    height: 4px;
    border-radius: 50px;
    outline: none;
    cursor: pointer;
    background: linear-gradient(to right, var(--accent-2) var(--progress), rgba(255,255,255,.14) var(--progress));
  }

  .range::-webkit-slider-thumb {
    appearance: none;
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: white;
    box-shadow: 0 0 0 4px rgba(32,217,210,.18);
    transition: transform .2s ease;
  }

  .range:hover::-webkit-slider-thumb { transform: scale(1.22); }
  .range::-moz-range-thumb { width: 13px; height: 13px; border: 0; border-radius: 50%; background: white; }

  .control-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 17px;
    margin-top: 22px;
  }

  button.icon-button {
    border: 0;
    color: #c7cae0;
    background: transparent;
    width: 43px;
    height: 43px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    cursor: pointer;
    transition: background .25s ease, color .25s ease, transform .2s ease;
  }

  button.icon-button:hover {
    color: white;
    background: rgba(255,255,255,.1);
    transform: translateY(-2px);
  }

  button.icon-button:active { transform: scale(.9); }
  .icon-button svg { width: 22px; height: 22px; fill: currentColor; }

  .play-button {
    border: 0;
    width: 64px;
    height: 64px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    color: white;
    background: linear-gradient(135deg, var(--accent-2), #468bf7);
    box-shadow: 0 10px 27px rgba(32,217,210,.26);
    cursor: pointer;
    transition: transform .22s ease, filter .25s ease, background .25s ease;
  }

  .play-button:hover { transform: scale(1.08); filter: brightness(1.13); }
  .play-button:active { transform: scale(.93); }
  .play-button svg { width: 27px; height: 27px; fill: currentColor; }

  .bottom-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    padding: 16px 6px 0;
  }

  .volume-box {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 175px;
    color: var(--muted);
  }

  .volume-box svg { width: 19px; height: 19px; fill: currentColor; flex: none; }
  .volume-box .range { height: 3px; }

  .new-file {
    border: 1px solid var(--line);
    border-radius: 11px;
    padding: 8px 11px;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    color: var(--muted);
    background: rgba(255,255,255,.035);
    font: inherit;
    font-size: 12px;
    cursor: pointer;
    transition: color .25s ease, border-color .25s ease, background .25s ease, transform .2s ease;
  }

  .new-file svg { width: 16px; height: 16px; fill: currentColor; }
  .new-file:hover { color: var(--accent-2); border-color: rgba(32,217,210,.55); background: rgba(32,217,210,.08); transform: translateY(-2px); }

  #fileInput { display: none; }
  .hidden { display: none !important; }

  @media (max-width: 600px) {
    .app { width: min(100% - 20px, 1080px); padding-top: 17px; }
    header { margin-bottom: 18px; }
    .visual-area { min-height: 284px; padding: 26px 20px 14px; }
    .controls { padding: 18px 20px 21px; }
    .file-zone { min-height: 284px; }
    .control-row { gap: 8px; }
    .control-row .icon-button { width: 40px; height: 40px; }
    .bottom-bar { padding-top: 14px; }
    .volume-box { width: 132px; }
    .offline { font-size: 11px; padding: 7px 9px; }
  }
</style>
</head>
<body>
<div class="orb one"></div>
<div class="orb two"></div>

<main class="app">
  <header>
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round">
          <path d="M4 12h2l2-6 4 12 3-8 2 2h3"></path>
        </svg>
      </div>
      WAVE
    </div>
    <div class="offline"><span class="status-dot"></span>ОФФЛАЙН-ПЛЕЕР</div>
  </header>

  <section class="player">
    <div class="visual-area">
      <label class="file-zone" id="fileZone" for="fileInput">
        <div class="file-zone-content">
          <div class="upload-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 16V3"></path><path d="m7 8 5-5 5 5"></path><path d="M4 14v5a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-5"></path>
            </svg>
          </div>
          <h2>Загрузите свой трек</h2>
          <p>Выберите MP3-файл или перетащите его сюда</p>
          <span class="upload-button">Выбрать MP3</span>
        </div>
      </label>

      <div id="trackView" class="hidden">
        <div class="track-meta">
          <div class="eyebrow">Сейчас играет</div>
          <h1 class="track-title" id="trackTitle">Мой трек</h1>
          <p class="track-subtitle" id="trackInfo">Локальный аудиофайл</p>
        </div>
        <div class="wave-wrap"><canvas id="waveform"></canvas></div>
      </div>
    </div>

    <div class="controls">
      <div class="progress-row">
        <span class="time" id="currentTime">0:00</span>
        <input id="progress" class="range" type="range" min="0" max="100" value="0" aria-label="Прогресс трека">
        <span class="time" id="duration">0:00</span>
      </div>

      <div class="control-row">
        <button class="icon-button" id="rewind" aria-label="Назад на 10 секунд">
          <svg viewBox="0 0 24 24"><path d="M11 18V6l-8 6 8 6Zm1-6 8 6V6l-8 6Z"></path></svg>
        </button>
        <button class="icon-button" id="backward" aria-label="Назад на 5 секунд">
          <svg viewBox="0 0 24 24"><path d="M11 18V6l-8 6 8 6Zm1-6 8 6V6l-8 6Z" transform="scale(.85) translate(2 2.1)"></path></svg>
        </button>
        <button class="play-button" id="playButton" aria-label="Воспроизвести">
          <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5.2v13.6a1 1 0 0 0 1.54.84l10.25-6.8a1 1 0 0 0 0-1.68L9.54 4.36A1 1 0 0 0 8 5.2Z"></path></svg>
        </button>
        <button class="icon-button" id="forward" aria-label="Вперёд на 5 секунд">
          <svg viewBox="0 0 24 24"><path d="M13 18V6l8 6-8 6Zm-1-6L4 6v12l8-6Z" transform="scale(.85) translate(2 2.1)"></path></svg>
        </button>
        <button class="icon-button" id="skip" aria-label="Вперёд на 10 секунд">
          <svg viewBox="0 0 24 24"><path d="M13 18V6l8 6-8 6Zm-1-6L4 6v12l8-6Z"></path></svg>
        </button>
      </div>

      <div class="bottom-bar">
        <div class="volume-box">
          <svg id="volumeIcon" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4Zm12.5 3a4.5 4.5 0 0 0-2-3.74v7.48A4.5 4.5 0 0 0 16.5 12Zm-2-8.14v2.15a6.5 6.5 0 0 1 0 11.98v2.15a8.5 8.5 0 0 0 0-16.28Z"></path></svg>
          <input id="volume" class="range" type="range" min="0" max="100" value="80" aria-label="Громкость">
        </div>
        <button class="new-file" id="newFile" aria-label="Открыть другой файл">
          <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2Z"></path></svg>
          Другой трек
        </button>
      </div>
    </div>
  </section>

  <input id="fileInput" type="file" accept="audio/mpeg,audio/mp3,.mp3">
  <audio id="audio"></audio>
</main>

<script>
  const audio = document.getElementById('audio');
  const fileInput = document.getElementById('fileInput');
  const fileZone = document.getElementById('fileZone');
  const trackView = document.getElementById('trackView');
  const trackTitle = document.getElementById('trackTitle');
  const trackInfo = document.getElementById('trackInfo');
  const playButton = document.getElementById('playButton');
  const playIcon = document.getElementById('playIcon');
  const progress = document.getElementById('progress');
  const volume = document.getElementById('volume');
  const currentTime = document.getElementById('currentTime');
  const duration = document.getElementById('duration');
  const canvas = document.getElementById('waveform');
  const ctx = canvas.getContext('2d');

  let audioContext, analyser, source, dataArray, animationFrame;
  let currentUrl = null;
  let isConnected = false;

  function formatTime(seconds) {
    if (!isFinite(seconds)) return '0:00';
    const min = Math.floor(seconds / 60);
    const sec = Math.floor(seconds % 60).toString().padStart(2, '0');
    return `${min}:${sec}`;
  }

  function setRangeProgress(range, value) {
    range.style.setProperty('--progress', `${value}%`);
  }

  setRangeProgress(progress, 0);
  setRangeProgress(volume, 80);
  audio.volume = .8;

  function setupVisualizer() {
    if (!audioContext) {
      audioContext = new (window.AudioContext || window.webkitAudioContext)();
      analyser = audioContext.createAnalyser();
      analyser.fftSize = 128;
      dataArray = new Uint8Array(analyser.frequencyBinCount);
    }
    if (!isConnected) {
      source = audioContext.createMediaElementSource(audio);
      source.connect(analyser);
      analyser.connect(audioContext.destination);
      isConnected = true;
    }
  }

  function resizeCanvas() {
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function drawWave() {
    animationFrame = requestAnimationFrame(drawWave);
    resizeCanvas();
    const width = canvas.clientWidth;
    const height = canvas.clientHeight;
    ctx.clearRect(0, 0, width, height);

    let values;
    if (analyser && !audio.paused) {
      analyser.getByteFrequencyData(dataArray);
      values = dataArray;
    } else {
      values = Array.from({ length: 46 }, (_, i) => 18 + Math.abs(Math.sin(i * 1.7)) * 16);
    }

    const bars = 46;
    const gap = width < 400 ? 3 : 5;
    const barWidth = Math.max(2, (width - gap * (bars - 1)) / bars);
    const center = height / 2;

    for (let i = 0; i < bars; i++) {
      const sourceIndex = Math.floor(i * values.length / bars);
      const raw = values[sourceIndex] || 0;
      const idle = audio.paused ? raw : 9;
      const barHeight = audio.paused
        ? Math.max(7, idle)
        : Math.max(8, (raw / 255) * height * .95);

      const x = i * (barWidth + gap);
      const y = center - barHeight / 2;
      const gradient = ctx.createLinearGradient(0, y, 0, y + barHeight);
      gradient.addColorStop(0, '#8b5cf6');
      gradient.addColorStop(.55, '#5d8dff');
      gradient.addColorStop(1, '#20d9d2');
      ctx.fillStyle = gradient;
      ctx.globalAlpha = audio.paused ? .55 : .95;
      ctx.beginPath();
      ctx.roundRect(x, y, barWidth, barHeight, barWidth);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function updatePlayIcon() {
    if (audio.paused) {
      playIcon.innerHTML = '<path d="M8 5.2v13.6a1 1 0 0 0 1.54.84l10.25-6.8a1 1 0 0 0 0-1.68L9.54 4.36A1 1 0 0 0 8 5.2Z"></path>';
      playButton.setAttribute('aria-label', 'Воспроизвести');
    } else {
      playIcon.innerHTML = '<path d="M7 5h3.5v14H7V5Zm6.5 0H17v14h-3.5V5Z"></path>';
      playButton.setAttribute('aria-label', 'Пауза');
    }
  }

  function loadFile(file) {
    if (!file || !file.type.startsWith('audio/')) return;
    if (currentUrl) URL.revokeObjectURL(currentUrl);
    currentUrl = URL.createObjectURL(file);
    audio.src = currentUrl;
    audio.load();

    const cleanName = file.name.replace(/\.[^/.]+$/, '');
    trackTitle.textContent = cleanName;
    trackInfo.textContent = `${(file.size / 1024 / 1024).toFixed(2)} МБ · MP3`;
    fileZone.classList.add('hidden');
    trackView.classList.remove('hidden');
    progress.value = 0;
    setRangeProgress(progress, 0);
    currentTime.textContent = '0:00';
    duration.textContent = '0:00';
    setupVisualizer();
    if (audioContext.state === 'suspended') audioContext.resume();
    audio.play().catch(() => {});
  }

  fileInput.addEventListener('change', e => loadFile(e.target.files[0]));

  ['dragenter', 'dragover'].forEach(event => {
    fileZone.addEventListener(event, e => {
      e.preventDefault();
      fileZone.classList.add('dragging');
    });
  });

  ['dragleave', 'drop'].forEach(event => {
    fileZone.addEventListener(event, e => {
      e.preventDefault();
      fileZone.classList.remove('dragging');
    });
  });

  fileZone.addEventListener('drop', e => loadFile(e.dataTransfer.files[0]));

  playButton.addEventListener('click', () => {
    if (!audio.src) {
      fileInput.click();
      return;
    }
    setupVisualizer();
    if (audioContext.state === 'suspended') audioContext.resume();
    audio.paused ? audio.play() : audio.pause();
  });

  audio.addEventListener('play', updatePlayIcon);
  audio.addEventListener('pause', updatePlayIcon);
  audio.addEventListener('ended', updatePlayIcon);

  audio.addEventListener('loadedmetadata', () => {
    duration.textContent = formatTime(audio.duration);
  });

  audio.addEventListener('timeupdate', () => {
    const value = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
    progress.value = value;
    setRangeProgress(progress, value);
    currentTime.textContent = formatTime(audio.currentTime);
  });

  progress.addEventListener('input', () => {
    if (audio.duration) {
      audio.currentTime = (progress.value / 100) * audio.duration;
      setRangeProgress(progress, progress.value);
    }
  });

  volume.addEventListener('input', () => {
    audio.volume = volume.value / 100;
    setRangeProgress(volume, volume.value);
  });

  document.getElementById('rewind').addEventListener('click', () => {
    audio.currentTime = Math.max(0, audio.currentTime - 10);
  });

  document.getElementById('backward').addEventListener('click', () => {
    audio.currentTime = Math.max(0, audio.currentTime - 5);
  });

  document.getElementById('forward').addEventListener('click', () => {
    audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 5);
  });

  document.getElementById('skip').addEventListener('click', () => {
    audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 10);
  });

  document.getElementById('newFile').addEventListener('click', () => fileInput.click());

  window.addEventListener('resize', resizeCanvas);
  drawWave();
</script>
</body>
</html>
