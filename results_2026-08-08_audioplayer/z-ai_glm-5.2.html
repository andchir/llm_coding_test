<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WAVE — Оффлайн Аудиоплеер</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  :root {
    --bg-0: #0a0612;
    --bg-1: #14091f;
    --bg-2: #1d0f2b;
    --fg: #f5e6ff;
    --muted: #9a8bb0;
    --accent: #ff6b35;
    --accent-2: #ff2d75;
    --accent-3: #ffd23f;
    --glow: rgba(255, 107, 53, 0.5);
    --card: rgba(255, 255, 255, 0.04);
    --border: rgba(255, 255, 255, 0.08);
  }

  html, body {
    height: 100%;
    overflow: hidden;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: var(--bg-0);
    color: var(--fg);
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }

  /* Фоновые орбы */
  .orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.5;
    pointer-events: none;
    animation: float 20s ease-in-out infinite;
  }
  .orb-1 {
    width: 500px;
    height: 500px;
    background: var(--accent);
    top: -200px;
    left: -150px;
  }
  .orb-2 {
    width: 450px;
    height: 450px;
    background: var(--accent-2);
    bottom: -180px;
    right: -120px;
    animation-delay: -7s;
  }
  .orb-3 {
    width: 350px;
    height: 350px;
    background: #6a2dff;
    top: 40%;
    left: 50%;
    transform: translate(-50%, -50%);
    opacity: 0.3;
    animation-delay: -14s;
  }

  @keyframes float {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(40px, -30px) scale(1.1); }
    66% { transform: translate(-30px, 40px) scale(0.95); }
  }

  /* Шум-текстура */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/%3E%3C/svg%3E");
    opacity: 0.08;
    pointer-events: none;
    mix-blend-mode: overlay;
    z-index: 1;
  }

  .player {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 460px;
    max-height: calc(100vh - 32px);
    background: linear-gradient(165deg, rgba(30, 15, 45, 0.85), rgba(15, 8, 25, 0.95));
    backdrop-filter: blur(30px) saturate(150%);
    -webkit-backdrop-filter: blur(30px) saturate(150%);
    border: 1px solid var(--border);
    border-radius: 32px;
    padding: 28px 24px 24px;
    box-shadow: 
      0 30px 80px rgba(0, 0, 0, 0.5),
      inset 0 1px 0 rgba(255, 255, 255, 0.08);
    display: flex;
    flex-direction: column;
    gap: 20px;
    overflow: hidden;
  }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .brand-logo {
    width: 36px;
    height: 36px;
    border-radius: 11px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: grid;
    place-items: center;
    box-shadow: 0 6px 20px var(--glow);
  }

  .brand-name {
    font-size: 18px;
    font-weight: 800;
    letter-spacing: 2px;
  }

  .brand-name span {
    background: linear-gradient(90deg, var(--accent), var(--accent-3));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .header-actions {
    display: flex;
    gap: 8px;
  }

  .icon-btn {
    width: 38px;
    height: 38px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--muted);
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: all 0.3s ease;
  }

  .icon-btn:hover {
    color: var(--fg);
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border-color: transparent;
    transform: translateY(-2px);
    box-shadow: 0 8px 20px var(--glow);
  }

  .icon-btn svg {
    width: 18px;
    height: 18px;
  }

  /* Artwork */
  .artwork-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 1;
    border-radius: 24px;
    overflow: hidden;
    background: 
      radial-gradient(circle at 30% 30%, rgba(255, 107, 53, 0.3), transparent 50%),
      radial-gradient(circle at 70% 70%, rgba(255, 45, 117, 0.3), transparent 50%),
      linear-gradient(135deg, #2a0d3e, #0d0820);
    box-shadow: 
      inset 0 0 60px rgba(0, 0, 0, 0.5),
      0 20px 50px rgba(0, 0, 0, 0.4);
  }

  #waveCanvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  .artwork-empty {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    text-align: center;
    padding: 24px;
    transition: opacity 0.4s ease;
  }

  .artwork-empty.hidden {
    opacity: 0;
    pointer-events: none;
  }

  .empty-icon {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: grid;
    place-items: center;
    box-shadow: 0 10px 30px var(--glow);
    animation: pulse 3s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); box-shadow: 0 10px 30px var(--glow); }
    50% { transform: scale(1.05); box-shadow: 0 15px 40px var(--glow); }
  }

  .empty-icon svg {
    width: 32px;
    height: 32px;
    color: white;
  }

  .empty-text {
    font-size: 14px;
    color: var(--muted);
    line-height: 1.5;
  }

  .empty-text strong {
    color: var(--fg);
    display: block;
    font-size: 16px;
    margin-bottom: 4px;
  }

  /* Track info */
  .track-info {
    text-align: center;
    min-height: 56px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .track-title {
    font-size: 20px;
    font-weight: 700;
    color: var(--fg);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: all 0.3s;
  }

  .track-artist {
    font-size: 13px;
    color: var(--muted);
    margin-top: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Progress */
  .progress-section {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .progress-bar {
    position: relative;
    height: 6px;
    background: rgba(255, 255, 255, 0.08);
    border-radius: 10px;
    cursor: pointer;
    overflow: visible;
  }

  .progress-fill {
    position: absolute;
    inset: 0;
    width: 0%;
    background: linear-gradient(90deg, var(--accent), var(--accent-2), var(--accent-3));
    background-size: 200% 100%;
    border-radius: 10px;
    transition: width 0.1s linear;
    animation: shimmer 3s linear infinite;
  }

  @keyframes shimmer {
    0% { background-position: 0% 0; }
    100% { background-position: 200% 0; }
  }

  .progress-thumb {
    position: absolute;
    top: 50%;
    left: 0%;
    transform: translate(-50%, -50%) scale(0);
    width: 14px;
    height: 14px;
    background: white;
    border-radius: 50%;
    box-shadow: 0 0 0 4px rgba(255, 107, 53, 0.3), 0 4px 12px rgba(0, 0, 0, 0.4);
    transition: transform 0.2s ease, left 0.1s linear;
    pointer-events: none;
  }

  .progress-bar:hover .progress-thumb,
  .progress-bar.active .progress-thumb {
    transform: translate(-50%, -50%) scale(1);
  }

  .time-row {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.5px;
  }

  /* Controls */
  .controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
  }

  .control-btn {
    border: none;
    background: var(--card);
    color: var(--fg);
    cursor: pointer;
    display: grid;
    place-items: center;
    border-radius: 50%;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    border: 1px solid var(--border);
  }

  .control-btn svg {
    width: 22px;
    height: 22px;
  }

  .control-btn.small {
    width: 44px;
    height: 44px;
  }

  .control-btn.small:hover {
    color: var(--accent);
    background: rgba(255, 107, 53, 0.1);
    border-color: rgba(255, 107, 53, 0.3);
    transform: translateY(-2px);
  }

  .control-btn.small.active {
    color: var(--accent);
    background: rgba(255, 107, 53, 0.15);
    border-color: rgba(255, 107, 53, 0.4);
  }

  .play-btn {
    width: 64px;
    height: 64px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow: 0 10px 30px var(--glow);
    border: none;
  }

  .play-btn svg {
    width: 26px;
    height: 26px;
    color: white;
  }

  .play-btn:hover {
    transform: scale(1.08);
    box-shadow: 0 15px 40px var(--glow);
  }

  .play-btn:active {
    transform: scale(0.95);
  }

  /* Volume */
  .volume-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 4px;
  }

  .volume-row svg {
    width: 18px;
    height: 18px;
    color: var(--muted);
    flex-shrink: 0;
  }

  .volume-bar {
    flex: 1;
    position: relative;
    height: 4px;
    background: rgba(255, 255, 255, 0.08);
    border-radius: 10px;
    cursor: pointer;
  }

  .volume-fill {
    position: absolute;
    inset: 0;
    width: 70%;
    background: linear-gradient(90deg, var(--accent-3), var(--accent));
    border-radius: 10px;
    transition: width 0.15s ease;
  }

  /* Playlist */
  .playlist {
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-height: 200px;
    overflow-y: auto;
    padding-right: 4px;
    margin: 0 -4px 0 0;
  }

  .playlist::-webkit-scrollbar {
    width: 4px;
  }
  .playlist::-webkit-scrollbar-track {
    background: transparent;
  }
  .playlist::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.1);
    border-radius: 10px;
  }

  .playlist-empty {
    text-align: center;
    padding: 20px;
    color: var(--muted);
    font-size: 13px;
  }

  .track-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    cursor: pointer;
    transition: all 0.25s ease;
  }

  .track-item:hover {
    background: rgba(255, 255, 255, 0.07);
    border-color: rgba(255, 107, 53, 0.3);
    transform: translateX(4px);
  }

  .track-item.playing {
    background: linear-gradient(135deg, rgba(255, 107, 53, 0.15), rgba(255, 45, 117, 0.1));
    border-color: rgba(255, 107, 53, 0.4);
  }

  .track-item-icon {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: grid;
    place-items: center;
    flex-shrink: 0;
    position: relative;
  }

  .track-item-icon svg {
    width: 16px;
    height: 16px;
    color: white;
  }

  .track-item.playing .track-item-icon::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 10px;
    background: rgba(0, 0, 0, 0.5);
    display: grid;
    place-items: center;
  }

  .equalizer {
    position: absolute;
    inset: 0;
    display: none;
    align-items: flex-end;
    justify-content: center;
    gap: 2px;
    padding: 8px 0;
    z-index: 2;
  }

  .track-item.playing .equalizer {
    display: flex;
  }

  .track-item.playing .track-item-icon svg {
    opacity: 0;
  }

  .equalizer span {
    width: 3px;
    background: white;
    border-radius: 2px;
    animation: eq 0.8s ease-in-out infinite;
  }
  .equalizer span:nth-child(1) { animation-delay: 0s; height: 40%; }
  .equalizer span:nth-child(2) { animation-delay: 0.2s; height: 70%; }
  .equalizer span:nth-child(3) { animation-delay: 0.4s; height: 50%; }
  .equalizer span:nth-child(4) { animation-delay: 0.1s; height: 90%; }

  @keyframes eq {
    0%, 100% { transform: scaleY(0.3); }
    50% { transform: scaleY(1); }
  }

  .track-item-info {
    flex: 1;
    min-width: 0;
  }

  .track-item-name {
    font-size: 13px;
    font-weight: 600;
    color: var(--fg);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .track-item-duration {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
  }

  .track-item-delete {
    width: 28px;
    height: 28px;
    border-radius: 8px;
    border: none;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: all 0.2s;
    flex-shrink: 0;
  }

  .track-item-delete:hover {
    color: var(--accent-2);
    background: rgba(255, 45, 117, 0.1);
  }

  .track-item-delete svg {
    width: 14px;
    height: 14px;
  }

  /* Drag overlay */
  .drag-overlay {
    position: fixed;
    inset: 0;
    background: rgba(10, 6, 18, 0.9);
    backdrop-filter: blur(20px);
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }

  .drag-overlay.active {
    display: flex;
  }

  .drag-box {
    padding: 60px 80px;
    border: 2px dashed var(--accent);
    border-radius: 30px;
    text-align: center;
    background: rgba(255, 107, 53, 0.05);
  }

  .drag-box svg {
    width: 60px;
    height: 60px;
    color: var(--accent);
    margin-bottom: 16px;
  }

  .drag-box h3 {
    font-size: 22px;
    color: var(--fg);
    margin-bottom: 6px;
  }

  .drag-box p {
    color: var(--muted);
    font-size: 14px;
  }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(120%);
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: white;
    padding: 12px 22px;
    border-radius: 14px;
    font-size: 13px;
    font-weight: 600;
    box-shadow: 0 15px 40px var(--glow);
    z-index: 200;
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    pointer-events: none;
    white-space: nowrap;
  }

  .toast.show {
    transform: translateX(-50%) translateY(0);
  }

  /* Rotating effect when playing */
  .artwork-wrap.playing::before {
    content: "";
    position: absolute;
    inset: -2px;
    border-radius: 26px;
    background: conic-gradient(from 0deg, var(--accent), var(--accent-2), var(--accent-3), var(--accent));
    z-index: -1;
    animation: rotate 8s linear infinite;
    filter: blur(8px);
    opacity: 0.6;
  }

  @keyframes rotate {
    to { transform: rotate(360deg); }
  }

  input[type="file"] {
    display: none;
  }

  /* Responsive */
  @media (max-width: 500px) {
    body { padding: 0; }
    .player {
      max-width: 100%;
      height: 100vh;
      max-height: 100vh;
      border-radius: 0;
      padding: 20px 18px;
    }
    .brand-name { font-size: 16px; }
    .track-title { font-size: 18px; }
    .play-btn { width: 58px; height: 58px; }
    .control-btn.small { width: 42px; height: 42px; }
    .controls { gap: 14px; }
  }

  @media (max-height: 700px) and (min-width: 501px) {
    .player { max-height: 96vh; }
    .playlist { max-height: 120px; }
  }
</style>
</head>
<body>

<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>

<div class="drag-overlay" id="dragOverlay">
  <div class="drag-box">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
      <polyline points="17 8 12 3 7 8"/>
      <line x1="12" y1="3" x2="12" y2="15"/>
    </svg>
    <h3>Отпустите файлы</h3>
    <p>MP3, WAV, OGG, M4A</p>
  </div>
</div>

<main class="player">
  <header class="header">
    <div class="brand">
      <div class="brand-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round">
          <line x1="3" y1="12" x2="3" y2="12"/>
          <line x1="7" y1="8" x2="7" y2="16"/>
          <line x1="11" y1="4" x2="11" y2="20"/>
          <line x1="15" y1="9" x2="15" y2="15"/>
          <line x1="19" y1="6" x2="19" y2="18"/>
          <line x1="23" y1="11" x2="23" y2="13"/>
        </svg>
      </div>
      <div class="brand-name">WAVE<span>.</span></div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="loadBtn" title="Загрузить файлы" aria-label="Загрузить файлы">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
      </button>
      <button class="icon-btn" id="shuffleBtn" title="Перемешать" aria-label="Перемешать">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="16 3 21 3 21 8"/>
          <line x1="4" y1="20" x2="21" y2="3"/>
          <polyline points="21 16 21 21 16 21"/>
          <line x1="15" y1="15" x2="21" y2="21"/>
          <line x1="4" y1="4" x2="9" y2="9"/>
        </svg>
      </button>
    </div>
  </header>

  <div class="artwork-wrap" id="artworkWrap">
    <canvas id="waveCanvas"></canvas>
    <div class="artwork-empty" id="artworkEmpty">
      <div class="empty-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18V5l12-2v13"/>
          <circle cx="6" cy="18" r="3"/>
          <circle cx="18" cy="16" r="3"/>
        </svg>
      </div>
      <div class="empty-text">
        <strong>Нет загруженной музыки</strong>
        Нажмите кнопку загрузки или перетащите MP3 файлы сюда
      </div>
    </div>
  </div>

  <div class="track-info">
    <div class="track-title" id="trackTitle">Выберите трек</div>
    <div class="track-artist" id="trackArtist">Библиотека пуста</div>
  </div>

  <div class="progress-section">
    <div class="progress-bar" id="progressBar">
      <div class="progress-fill" id="progressFill"></div>
      <div class="progress-thumb" id="progressThumb"></div>
    </div>
    <div class="time-row">
      <span id="currentTime">0:00</span>
      <span id="totalTime">0:00</span>
    </div>
  </div>

  <div class="controls">
    <button class="control-btn small" id="prevBtn" aria-label="Предыдущий трек">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>
      </svg>
    </button>
    <button class="control-btn small" id="backwardBtn" aria-label="Назад 10 секунд">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="1 4 1 10 7 10"/>
        <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
      </svg>
    </button>
    <button class="control-btn play-btn" id="playBtn" aria-label="Воспроизвести">
      <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor">
        <path d="M8 5v14l11-7z"/>
      </svg>
    </button>
    <button class="control-btn small" id="forwardBtn" aria-label="Вперёд 10 секунд">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="23 4 23 10 17 10"/>
        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
      </svg>
    </button>
    <button class="control-btn small" id="nextBtn" aria-label="Следующий трек">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M16 6h2v12h-2zM6 18l8.5-6L6 6v12z"/>
      </svg>
    </button>
  </div>

  <div class="volume-row">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="volIcon">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
      <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>
    </svg>
    <div class="volume-bar" id="volumeBar">
      <div class="volume-fill" id="volumeFill"></div>
    </div>
  </div>

  <div class="playlist" id="playlist">
    <div class="playlist-empty">Ваша библиотека пуста.<br>Загрузите музыку, чтобы начать.</div>
  </div>
</main>

<div class="toast" id="toast">Готово</div>

<input type="file" id="fileInput" accept="audio/*" multiple>

<script>
(() => {
  // ============ Состояние ============
  const state = {
    tracks: [],          // [{id, name, url, size, duration}]
    currentId: null,
    isPlaying: false,
    isShuffle: false,
    repeatMode: 0,       // 0: off, 1: all, 2: one
    audio: new Audio(),
    audioCtx: null,
    analyser: null,
    source: null,
    dataArray: null,
    volume: 0.7,
  };

  // ============ DOM ============
  const $ = (id) => document.getElementById(id);
  const els = {
    fileInput: $('fileInput'),
    loadBtn: $('loadBtn'),
    shuffleBtn: $('shuffleBtn'),
    artworkWrap: $('artworkWrap'),
    artworkEmpty: $('artworkEmpty'),
    waveCanvas: $('waveCanvas'),
    trackTitle: $('trackTitle'),
    trackArtist: $('trackArtist'),
    progressBar: $('progressBar'),
    progressFill: $('progressFill'),
    progressThumb: $('progressThumb'),
    currentTime: $('currentTime'),
    totalTime: $('totalTime'),
    playBtn: $('playBtn'),
    playIcon: $('playIcon'),
    prevBtn: $('prevBtn'),
    nextBtn: $('nextBtn'),
    forwardBtn: $('forwardBtn'),
    backwardBtn: $('backwardBtn'),
    volumeBar: $('volumeBar'),
    volumeFill: $('volumeFill'),
    volIcon: $('volIcon'),
    playlist: $('playlist'),
    dragOverlay: $('dragOverlay'),
    toast: $('toast'),
  };

  const ctx = els.waveCanvas.getContext('2d');

  // ============ Утилиты ============
  function formatTime(s) {
    if (!isFinite(s) || s < 0) return '0:00';
    const m = Math.floor(s / 60);
    const sec = Math.floor(s % 60);
    return `${m}:${sec.toString().padStart(2, '0')}`;
  }

  function showToast(msg) {
    els.toast.textContent = msg;
    els.toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => els.toast.classList.remove('show'), 2200);
  }

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  // ============ Audio Context ============
  function initAudioContext() {
    if (state.audioCtx) return;
    try {
      state.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      state.analyser = state.audioCtx.createAnalyser();
      state.analyser.fftSize = 256;
      state.analyser.smoothingTimeConstant = 0.78;
      state.source = state.audioCtx.createMediaElementSource(state.audio);
      state.source.connect(state.analyser);
      state.analyser.connect(state.audioCtx.destination);
      state.dataArray = new Uint8Array(state.analyser.frequencyBinCount);
    } catch (e) {
      console.warn('AudioContext init failed', e);
    }
  }

  // ============ Canvas ============
  function resizeCanvas() {
    const rect = els.waveCanvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    els.waveCanvas.width = rect.width * dpr;
    els.waveCanvas.height = rect.height * dpr;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.scale(dpr, dpr);
  }

  window.addEventListener('resize', resizeCanvas);

  // Псевдо-данные для покоя (когда музыка не играет)
  const idleOffset = [];
  for (let i = 0; i < 64; i++) idleOffset.push(Math.random() * Math.PI * 2);

  function drawWave() {
    const rect = els.waveCanvas.getBoundingClientRect();
    const w = rect.width;
    const h = rect.height;
    ctx.clearRect(0, 0, w, h);

    const bars = 64;
    const barW = w / bars * 0.55;
    const gap = w / bars * 0.45;
    const step = w / bars;

    let data;
    if (state.isPlaying && state.analyser) {
      state.analyser.getByteFrequencyData(state.dataArray);
      data = state.dataArray;
    }

    const cx = w / 2;
    const cy = h / 2;
    const time = performance.now() / 1000;

    for (let i = 0; i < bars; i++) {
      let amp;
      if (state.isPlaying && data) {
        const idx = Math.floor(i / bars * data.length * 0.7);
        amp = data[idx] / 255;
      } else {
        // Idle gentle waves
        amp = 0.12 + Math.sin(time * 1.5 + idleOffset[i]) * 0.06 + 0.06;
      }

      const barH = Math.max(2, amp * h * 0.7);
      const x = i * step + gap / 2;

      // Градиент по высоте бара
      const grad = ctx.createLinearGradient(0, cy - barH / 2, 0, cy + barH / 2);
      grad.addColorStop(0, '#ffd23f');
      grad.addColorStop(0.5, '#ff6b35');
      grad.addColorStop(1, '#ff2d75');

      ctx.fillStyle = grad;

      // Свечение
      ctx.shadowColor = '#ff6b35';
      ctx.shadowBlur = state.isPlaying ? 15 : 5;

      // Скруглённый прямоугольник
      const r = barW / 2;
      const yTop = cy - barH / 2;
      ctx.beginPath();
      ctx.moveTo(x + r, yTop);
      ctx.arcTo(x + barW, yTop, x + barW, yTop + r, r);
      ctx.arcTo(x + barW, yTop + barH, x + barW - r, yTop + barH, r);
      ctx.arcTo(x, yTop + barH, x, yTop + barH - r, r);
      ctx.arcTo(x, yTop, x + r, yTop, r);
      ctx.closePath();
      ctx.fill();
    }

    ctx.shadowBlur = 0;
    requestAnimationFrame(drawWave);
  }

  // ============ Треки ============
  async function addFiles(files) {
    const audioFiles = Array.from(files).filter(f => f.type.startsWith('audio/') || /\.(mp3|wav|ogg|m4a|aac|flac)$/i.test(f.name));
    if (audioFiles.length === 0) {
      showToast('Аудиофайлы не найдены');
      return;
    }

    let added = 0;
    for (const file of audioFiles) {
      const url = URL.createObjectURL(file);
      const duration = await getDuration(url).catch(() => 0);
      state.tracks.push({
        id: uid(),
        name: file.name.replace(/\.[^/.]+$/, ''),
        url,
        size: file.size,
        duration,
      });
      added++;
    }
    renderPlaylist();
    if (state.currentId === null && state.tracks.length > 0) {
      loadTrack(state.tracks[0].id, false);
    }
    saveMetadata();
    showToast(`Добавлено треков: ${added}`);
  }

  function getDuration(url) {
    return new Promise((resolve, reject) => {
      const a = new Audio();
      a.preload = 'metadata';
      a.onloadedmetadata = () => resolve(a.duration);
      a.onerror = reject;
      a.src = url;
    });
  }

  function loadTrack(id, autoplay = true) {
    const track = state.tracks.find(t => t.id === id);
    if (!track) return;
    state.currentId = id;
    state.audio.src = track.url;
    els.trackTitle.textContent = track.name;
    els.trackArtist.textContent = 'Локальный файл';
    els.artworkEmpty.classList.add('hidden');
    renderPlaylist();
    if (autoplay) {
      play();
    } else {
      state.audio.load();
    }
  }

  function removeTrack(id) {
    const idx = state.tracks.findIndex(t => t.id === id);
    if (idx < 0) return;
    const wasCurrent = state.currentId === id;
    URL.revokeObjectURL(state.tracks[idx].url);
    state.tracks.splice(idx, 1);

    if (wasCurrent) {
      state.audio.pause();
      state.isPlaying = false;
      state.currentId = null;
      if (state.tracks.length > 0) {
        const nextIdx = Math.min(idx, state.tracks.length - 1);
        loadTrack(state.tracks[nextIdx].id, false);
      } else {
        els.trackTitle.textContent = 'Выберите трек';
        els.trackArtist.textContent = 'Библиотека пуста';
        els.artworkEmpty.classList.remove('hidden');
        els.progressFill.style.width = '0%';
        els.progressThumb.style.left = '0%';
        els.currentTime.textContent = '0:00';
        els.totalTime.textContent = '0:00';
        updatePlayIcon();
      }
    }
    renderPlaylist();
    saveMetadata();
    showToast('Трек удалён');
  }

  // ============ Воспроизведение ============
  function play() {
    if (!state.currentId && state.tracks.length > 0) {
      loadTrack(state.tracks[0].id, false);
    }
    if (!state.audio.src) {
      showToast('Сначала загрузите музыку');
      return;
    }
    initAudioContext();
    if (state.audioCtx && state.audioCtx.state === 'suspended') {
      state.audioCtx.resume();
    }
    state.audio.play().then(() => {
      state.isPlaying = true;
      updatePlayIcon();
      els.artworkWrap.classList.add('playing');
    }).catch(e => {
      console.warn('Play failed', e);
      showToast('Не удалось воспроизвести');
    });
  }

  function pause() {
    state.audio.pause();
    state.isPlaying = false;
    updatePlayIcon();
    els.artworkWrap.classList.remove('playing');
  }

  function togglePlay() {
    if (state.isPlaying) pause(); else play();
  }

  function updatePlayIcon() {
    if (state.isPlaying) {
      els.playIcon.innerHTML = '<path d="M6 4h4v16H6V4zm8 0h4v16h-4V4z"/>';
    } else {
      els.playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
    }
  }

  function next() {
    if (state.tracks.length === 0) return;
    let idx = state.tracks.findIndex(t => t.id === state.currentId);
    if (state.isShuffle) {
      let r;
      do { r = Math.floor(Math.random() * state.tracks.length); }
      while (r === idx && state.tracks.length > 1);
      idx = r;
    } else {
      idx = (idx + 1) % state.tracks.length;
    }
    loadTrack(state.tracks[idx].id, true);
  }

  function prev() {
    if (state.tracks.length === 0) return;
    let idx = state.tracks.findIndex(t => t.id === state.currentId);
    if (state.audio.currentTime > 3) {
      state.audio.currentTime = 0;
      return;
    }
    idx = (idx - 1 + state.tracks.length) % state.tracks.length;
    loadTrack(state.tracks[idx].id, true);
  }

  // ============ События аудио ============
  state.audio.addEventListener('timeupdate', () => {
    if (!state.audio.duration) return;
    const pct = (state.audio.currentTime / state.audio.duration) * 100;
    els.progressFill.style.width = pct + '%';
    els.progressThumb.style.left = pct + '%';
    els.currentTime.textContent = formatTime(state.audio.currentTime);
  });

  state.audio.addEventListener('loadedmetadata', () => {
    els.totalTime.textContent = formatTime(state.audio.duration);
  });

  state.audio.addEventListener('ended', () => {
    if (state.repeatMode === 2) {
      state.audio.currentTime = 0;
      play();
    } else if (state.repeatMode === 1 || state.tracks.length > 1) {
      next();
    } else {
      state.isPlaying = false;
      updatePlayIcon();
      els.artworkWrap.classList.remove('playing');
    }
  });

  state.audio.volume = state.volume;

  // ============ Контролы ============
  els.playBtn.addEventListener('click', togglePlay);
  els.nextBtn.addEventListener('click', next);
  els.prevBtn.addEventListener('click', prev);
  els.forwardBtn.addEventListener('click', () => {
    state.audio.currentTime = Math.min(state.audio.duration || 0, state.audio.currentTime + 10);
  });
  els.backwardBtn.addEventListener('click', () => {
    state.audio.currentTime = Math.max(0, state.audio.currentTime - 10);
  });

  els.loadBtn.addEventListener('click', () => els.fileInput.click());
  els.fileInput.addEventListener('change', (e) => {
    addFiles(e.target.files);
    e.target.value = '';
  });

  els.shuffleBtn.addEventListener('click', () => {
    state.isShuffle = !state.isShuffle;
    els.shuffleBtn.classList.toggle('active', state.isShuffle);
    showToast(state.isShuffle ? 'Перемешивание включено' : 'Перемешивание выключено');
  });

  // Прогресс-бар
  function seekTo(clientX) {
    if (!state.audio.duration) return;
    const rect = els.progressBar.getBoundingClientRect();
    const pct = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
    state.audio.currentTime = pct * state.audio.duration;
  }

  let isDraggingProgress = false;
  els.progressBar.addEventListener('pointerdown', (e) => {
    isDraggingProgress = true;
    els.progressBar.classList.add('active');
    seekTo(e.clientX);
    els.progressBar.setPointerCapture(e.pointerId);
  });
  els.progressBar.addEventListener('pointermove', (e) => {
    if (isDraggingProgress) seekTo(e.clientX);
  });
  els.progressBar.addEventListener('pointerup', (e) => {
    isDraggingProgress = false;
    els.progressBar.classList.remove('active');
  });

  // Громкость
  function setVolume(clientX) {
    const rect = els.volumeBar.getBoundingClientRect();
    const pct = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
    state.volume = pct;
    state.audio.volume = pct;
    els.volumeFill.style.width = (pct * 100) + '%';
    updateVolumeIcon();
  }

  function updateVolumeIcon() {
    if (state.volume === 0) {
      els.volIcon.innerHTML = '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>';
    } else if (state.volume < 0.5) {
      els.volIcon.innerHTML = '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>';
    } else {
      els.volIcon.innerHTML = '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>';
    }
  }

  let isDraggingVolume = false;
  els.volumeBar.addEventListener('pointerdown', (e) => {
    isDraggingVolume = true;
    setVolume(e.clientX);
    els.volumeBar.setPointerCapture(e.pointerId);
  });
  els.volumeBar.addEventListener('pointermove', (e) => {
    if (isDraggingVolume) setVolume(e.clientX);
  });
  els.volumeBar.addEventListener('pointerup', () => {
    isDraggingVolume = false;
  });

  // Инициализация громкости
  els.volumeFill.style.width = (state.volume * 100) + '%';
  updateVolumeIcon();

  // ============ Drag & Drop ============
  let dragCounter = 0;
  window.addEventListener('dragenter', (e) => {
    e.preventDefault();
    dragCounter++;
    els.dragOverlay.classList.add('active');
  });
  window.addEventListener('dragover', (e) => e.preventDefault());
  window.addEventListener('dragleave', (e) => {
    e.preventDefault();
    dragCounter--;
    if (dragCounter <= 0) {
      dragCounter = 0;
      els.dragOverlay.classList.remove('active');
    }
  });
  window.addEventListener('drop', (e) => {
    e.preventDefault();
    dragCounter = 0;
    els.dragOverlay.classList.remove('active');
    if (e.dataTransfer.files.length > 0) {
      addFiles(e.dataTransfer.files);
    }
  });

  // ============ Рендер плейлиста ============
  function renderPlaylist() {
    if (state.tracks.length === 0) {
      els.playlist.innerHTML = '<div class="playlist-empty">Ваша библиотека пуста.<br>Загрузите музыку, чтобы начать.</div>';
      return;
    }
    els.playlist.innerHTML = '';
    state.tracks.forEach((track) => {
      const item = document.createElement('div');
      item.className = 'track-item' + (track.id === state.currentId ? ' playing' : '');
      item.innerHTML = `
        <div class="track-item-icon">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
          <div class="equalizer">
            <span></span><span></span><span></span><span></span>
          </div>
        </div>
        <div class="track-item-info">
          <div class="track-item-name">${escapeHtml(track.name)}</div>
          <div class="track-item-duration">${formatTime(track.duration)} · ${(track.size / 1024 / 1024).toFixed(1)} МБ</div>
        </div>
        <button class="track-item-delete" data-id="${track.id}" aria-label="Удалить">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"/>
            <path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6"/>
            <path d="M10 11v6M14 11v6"/>
          </svg>
        </button>
      `;
      item.addEventListener('click', (e) => {
        if (e.target.closest('.track-item-delete')) return;
        loadTrack(track.id, true);
      });
      item.querySelector('.track-item-delete').addEventListener('click', (e) => {
        e.stopPropagation();
        removeTrack(track.id);
      });
      els.playlist.appendChild(item);
    });
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ============ Persistence (только метаданные, без самих файлов) ============
  function saveMetadata() {
    // Файлы хранить нельзя (blob URLs не переживут сессию), но сохраняем настройки
    try {
      localStorage.setItem('wave_settings', JSON.stringify({
        volume: state.volume,
        isShuffle: state.isShuffle,
      }));
    } catch (e) {}
  }

  function loadSettings() {
    try {
      const s = JSON.parse(localStorage.getItem('wave_settings') || '{}');
      if (typeof s.volume === 'number') {
        state.volume = s.volume;
        state.audio.volume = s.volume;
        els.volumeFill.style.width = (s.volume * 100) + '%';
        updateVolumeIcon();
      }
      if (s.isShuffle) {
        state.isShuffle = true;
        els.shuffleBtn.classList.add('active');
      }
    } catch (e) {}
  }

  // ============ Клавиатура ============
  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT') return;
    if (e.code === 'Space') {
      e.preventDefault();
      togglePlay();
    } else if (e.code === 'ArrowRight') {
      next();
    } else if (e.code === 'ArrowLeft') {
      prev();
    } else if (e.code === 'ArrowUp') {
      e.preventDefault();
      setVolumeByDelta(0.05);
    } else if (e.code === 'ArrowDown') {
      e.preventDefault();
      setVolumeByDelta(-0.05);
    }
  });

  function setVolumeByDelta(d) {
    state.volume = Math.max(0, Math.min(1, state.volume + d));
    state.audio.volume = state.volume;
    els.volumeFill.style.width = (state.volume * 100) + '%';
    updateVolumeIcon();
    saveMetadata();
  }

  // ============ Запуск ============
  loadSettings();
  resizeCanvas();
  // Повторный resize после применения стилей
  setTimeout(resizeCanvas, 100);
  drawWave();
  renderPlaylist();
})();
</script>
</body>
</html>
